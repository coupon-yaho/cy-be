# Gradle 실행 옵션. **Spring Initializr 가 안 만드는 파일이라 지금까지 없었다** —
# 지운 게 아니라 처음부터 없어서 캐시가 전부 기본값(꺼짐)이었다.
#
# ── 실측 (M-series 11코어 · Docker VM 7.65GB, 2026-08-27) ────────────────────
#
#   전체 clean build      97초  →  76초
#   변경 없는 재빌드       6초  →   2초
#
# ⚠️ **한때 `docs/13` §4c 가 "전체 빌드가 5분" 이었다.** CY-621(컨테이너를 스프링 컨텍스트가
#    아니라 JVM 이 소유하게 함)이 그 대부분을 이미 없앴고, CY-661 이 97초로 재서 그 절을
#    정정했다. 남은 76초 중 약 70초는 **테스트 본체**다(테스트를 뺀 빌드는 8초).


# ── 빌드 캐시 ────────────────────────────────────────────────────────────────
# 입력이 같은 태스크의 출력을 재사용한다. 브랜치를 오가며 같은 커밋을 다시 빌드하는
# 이 저장소의 흐름(리뷰 라운드가 여러 번이다)에서 값이 크다.
org.gradle.caching=true

# ── 설정 캐시 ────────────────────────────────────────────────────────────────
# 태스크 그래프 계산 결과를 재사용한다. 변경 없는 재빌드가 6초 → 2초가 된 몫이
# 대부분 여기다. 경고 없이 저장·재사용되는 것을 확인했다
# ("Configuration cache entry stored" → "Reusing configuration cache").
org.gradle.configuration-cache=true


# ── `org.gradle.parallel` 은 켜지 않는다 ─────────────────────────────────────
# **한 번 켰다가 실측으로 뺐다.** 축을 하나만 움직여 세 회차를 쟀다
# (`clean test --rerun-tasks`, 매 회차 빌드 캐시를 지워 콜드로 맞춤):
#
#     parallel=false   72 · 69 · 71초   평균 70.7
#     parallel=true    76 · 74 · 71초   평균 73.7
#
# **빠르지 않고 오히려 느리다.** 모듈이 의존으로 줄 세워져 있어서다 —
# `core → storage → batch` 이고 `batch` 가 `storage` 의 `testFixtures` 를 쓴다.
# `docs/13` §4c 가 원래 *"완전 병렬이 안 된다"* 고 적어 뒀는데 맞는 말이었다.
#
# **대가는 실재했다.** 병렬을 켜면 모듈이 겹쳐 돌아 동시 mysql 컨테이너가
# **3개 → 5개**가 된다(실측). CY-392 를 깨뜨린 18개와는 멀지만, **얻는 것이 없는데
# 치를 이유가 없다.** CI(ubuntu-latest)는 컨테이너 전용 VM 없이 7GB 를 JVM 과
# 나눠 쓰므로 그쪽 마진은 로컬보다 좁고, 거기서는 아예 안 쟀다.
#
# 켤 생각이라면 **위 세 회차를 다시 재고** CI 에서도 컨테이너 최대치를 관측한 뒤에 한다.
