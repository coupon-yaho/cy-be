# api 4대 앞의 LB. Docker 내부 DNS 가 api 의 A 레코드를 전부 돌려주고 회전시킨다.
#
# ⚠️ upstream 블록에 server api:8080 을 적으면 기동 시각에 딱 한 번 resolve 하고
#    그 IP 에 고정된다 — 재기동으로 IP 가 바뀌거나 scale 이 늘어도 안 따라간다.
#    변수 proxy_pass 는 요청마다 resolver 를 다시 타므로 4대에 고르게 나간다.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 8080;
    server_name _;

    # 부하 회차에서 이게 기본값(1024)이면 nginx 가 먼저 병목이 된다.
    client_body_buffer_size 16k;

    location / {
        set $api_upstream "http://api:8080";
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 발급은 대기를 허용한다(D11 — 거절하지 않는다). 여기서 먼저 끊으면
        # 재는 것이 서버 대기가 아니라 nginx 타임아웃이 된다.
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_next_upstream off;   # 재시도가 발급을 두 번 태우면 안 된다
    }
}
