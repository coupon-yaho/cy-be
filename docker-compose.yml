# ⚠️ infra/prometheus 는 Gradle 모듈이 아니다. 같은 infra/ 아래 있는 infra/mq · infra/redis 는
#    settings.gradle 에 include 된 자바 모듈이지만, infra/prometheus 는 이 파일이 컨테이너에
#    마운트하는 순수 설정 디렉터리다 — build.gradle 도 소스셋도 없다. 디렉터리 구조만 봐서는
#    구분이 안 되므로 여기 적어 둔다.
#
# ⚠️ CODEOWNERS 상 이 파일은 팀 5인 공동 소유다. 지금은 prometheus 서비스 하나만 들어 있다 —
#    P-1 이 세운 관측 인프라다. api · batch · mysql · redis · kafka 는 각자의 티켓이 여기에
#    덧붙인다.
#
#    docs/11-batch-implementation.md 는 부하 회차에 batch 를 빼기 위해 base.yml + batch.yml
#    분할을 못박고 있다. 그 분할이 도착하면 이 파일이 base.yml 이 되는 게 자연스럽다.
#    TODO(CY-213 후속, @SH-Seol): 앱 서비스가 붙을 때 분할 여부를 확정한다.

name: coupon-yaho

services:
  prometheus:
    # 태그를 고정한다. latest 는 회차마다 다른 바이너리를 쓰게 만들고, 그러면 비교표의
    # "동일 리소스" 전제가 조용히 깨진다.
    image: prom/prometheus:v3.6.0
    container_name: coupon-yaho-prometheus
    restart: unless-stopped

    # ⚠️ ports: 를 추가하지 말 것. Prometheus 에는 인증이 없어서 호스트로 내보내는 순간
    #    모든 지표가 열린다. 화면은 우리 API 가 이 네트워크 안에서 대신 읽어 준다.
    #    브라우저로 직접 봐야 하면 그때만 `docker compose port` 대신
    #    `docker exec -it coupon-yaho-prometheus wget -qO- localhost:9090/...` 을 쓴다.
    #    PrometheusScrapeConfigContractTest 가 ports 부재를 지킨다.

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 프로젝트 기간 전체. 실측 디스크 증가가 시간당 약 2.5MB 라 3주 연속 켜도 1.3GB 미만이다
      # — 회차를 골라 지울 이유가 없다. 완료 회차 사본은 별도(OBS-22).
      #
      # 대가: 이 값을 넘긴 회차는 조용히 사라진다. 30일 넘게 쓸 회차가 생기면 여기가 아니라
      # OBS-22 의 사본으로 남겨야 한다.
      - --storage.tsdb.retention.time=30d
      # ⚠️ --web.enable-lifecycle 을 켜지 말 것. 인증 없는 /-/reload · /-/quit 가 열린다.
      #    설정을 고쳤으면 컨테이너를 재시작한다 — 아래 볼륨 덕분에 데이터는 남는다.

    volumes:
      # 읽기 전용. 컨테이너가 제 설정을 덮어쓸 이유가 없다.
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # ⚠️ named volume 이어야 한다. 컨테이너를 지우면 TSDB 가 같이 사라지고, 부하 회차
      #    데이터가 거기 있다. bind mount 로 바꾸면 호스트 uid 와 nobody(65534)가 어긋나
      #    기동에 실패한다.
      - prometheus-data:/prometheus

    networks:
      - coupon-yaho

volumes:
  prometheus-data:
    # 이름을 고정한다. 기본 이름은 프로젝트명 접두사가 붙어 compose 파일을 분할하는 순간
    # 달라지고, 그러면 과거 회차 데이터가 "사라진 것처럼" 보인다.
    name: coupon-yaho-prometheus-data

networks:
  coupon-yaho:
    name: coupon-yaho
