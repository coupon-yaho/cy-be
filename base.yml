# 부하 중에도 그대로 뜨는 인프라입니다. batch 는 여기 없습니다 — batch.yml 오버레이입니다.
#
# docs/11-batch-implementation.md 가 정한 분할이다:
#   docker compose -f base.yml up                     # batch 를 아예 안 띄운다
#   docker compose -f base.yml -f batch.yml up batch  # 부하 종료 후 겹쳐 올린다
# "base.yml 은 한 글자도 안 바뀌므로 비교표의 동일 리소스 limit 이 유지된다" 가 그 근거라,
# 여기에 batch 를 넣으면 k6 측정 프로토콜이 깨진다.
#
# ⚠️ 관제도 base 에 둔다. 부하 중에는 batch 가 없어 BatchTargetDown 이 뜨는데,
#    그것은 silence 로 다룬다 — 규칙에 예외를 파면 "일부러 껐다" 와 "꺼져 버렸다" 가
#    같은 값이 된다. docs/14 4단계에 결정과 명령이 있다.
#
# ⚠️ 스키마를 만드는 것은 여기 없다. 마이그레이션 소유자는 api 하나이고 batch 는
#    flyway.enabled:false 다. mysql 이 만드는 것은 **빈 DB** 뿐이라, 이 스택만 띄우고
#    batch 를 올리면 SchemaPresenceGuard 가 기동을 막는다 — README 의 순서를 따를 것.

name: cy

services:
  mysql:
    image: mysql:8.4
    # ⚠️ 세션 존을 못 박는다. CY-392 의 cy_batch_last_success_seconds 가
    #    UNIX_TIMESTAMP(END_TIME) 으로 에폭을 내는데, 그 값은 **저장된 값을 세션 존으로**
    #    해석한 것이다. 드라이버는 URL 의 serverTimezone(UTC)으로 변환해 쓰므로,
    #    둘이 갈리면 게이지가 그 차이만큼 어긋난다 — 과거 방향이면 ExpireNotSucceeding 이
    #    영구 발화하고, 배치는 멀쩡한데 "만료가 SLA 안에 성공하지 못했습니다" 가 나간다.
    #
    #    mysql:8.4 의 기본은 time_zone=SYSTEM 이라 **컨테이너 OS 존**을 따른다.
    #    지금까지 맞았던 것은 그것이 우연히 UTC 였기 때문이다. TZ 를 얹거나
    #    /etc/localtime 을 마운트하는 순간 깨진다. 테스트 컨테이너는 이미 같은 값을 쓴다
    #    (MySqlContainerConfig 의 --default-time-zone=+00:00).
    command: ["--default-time-zone=+00:00"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-app}
      MYSQL_USER: ${DB_USERNAME:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app}
    ports:
      # ⚠️ 127.0.0.1 을 빼면 안 된다. compose 의 짧은 문법은 IP 를 안 적으면 0.0.0.0 에
      #    묶는다 — 공인 IP 가 붙은 호스트에서 띄우는 순간 인터넷 어디서든 app/app 으로
      #    붙는다. mysql 이미지가 만드는 계정이 'app'@'%' 라 원격 접속이 열려 있다.
      - "127.0.0.1:${DB_HOST_PORT:-3306}:3306"
    healthcheck:
      # batch 가 DB 보다 먼저 뜨면 "테이블 없음" SQL 에러로 죽고, 스택트레이스가 SQL
      # 계층이라 "검증 배치가 깨졌다" 로 읽힌다. 그 오진을 여기서 막는다.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  prometheus:
    image: prom/prometheus:v3.5.0
    # ⚠️ CI 의 규칙 검사(.github/workflows/build.yml)와 같은 태그여야 한다.
    #    다르면 CI 가 통과한 규칙을 운영 Prometheus 가 거부할 수 있다.
    restart: unless-stopped
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      # 재기동해도 지표가 남아야 한다. VerificationMetricsStale 의 `offset 10m` 은
      # 10분 전 값을 읽는데, 볼륨이 없으면 재기동마다 그 갈래가 통째로 안 평가된다.
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # ⚠️ command 를 주면 이미지 기본 인자가 통째로 덮인다. 기본값에 있던
      #    --storage.tsdb.path 를 다시 적지 않으면 TSDB 가 엉뚱한 곳에 앉아
      #    아래 볼륨이 아무것도 안 담는다.
      - --storage.tsdb.path=/prometheus
    ports:
      # 인증이 없다. 열면 스크레이프된 전 지표를 누구나 읽는다 —
      # application.yml.example 이 관리 포트에 대해 적은 것과 같은 성격이다.
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9490}:9090"
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # silence 가 재기동을 넘어 살아야 한다. docs/14 시연 절차 첫 단계가 만료·정리 알림을
      # **26시간** 재우는데, 볼륨이 없으면 스택을 한 번 올렸다 내리는 것으로 되살아난다.
      - alertmanager-data:/alertmanager
    ports:
      # 인증이 없다. 열면 누구나 silence 를 걸거나 알림을 주입할 수 있다 —
      # 관제를 조용히 꺼 버리는 경로다.
      - "127.0.0.1:${ALERTMANAGER_HOST_PORT:-9493}:9093"
    depends_on:
      - alert-sink

  alert-sink:
    # 표준 라이브러리만 쓰는 mock 리시버라 이미지를 따로 만들지 않는다.
    image: python:3.13-slim
    # 죽은 채로 두면 Prometheus 는 계속 firing, Alertmanager 는 실패를 자기 로그에만
    # 남기고, 사람은 `logs alert-sink` 에 새 줄이 없는 것을 "규칙이 틀렸다" 로 읽는다.
    restart: unless-stopped
    # 같은 스택의 batch 는 Dockerfile 에서 일부러 root 를 뗐다. 여기만 root 로 둘 이유가
    # 없다 — 지금은 호스트 포트 매핑이 없어 신뢰 경계를 안 넘지만, 누가 디버깅하려고
    # 포트를 여는 날 그 프로세스가 root 다.
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    volumes:
      - ./infra/alertmanager/alert-sink.py:/app/alert-sink.py:ro
    command: ["python", "-u", "/app/alert-sink.py"]

volumes:
  mysql-data:
  prometheus-data:
  alertmanager-data:
