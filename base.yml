# 부하 중에도 그대로 뜨는 인프라입니다. batch 는 여기 없습니다 — batch.yml 오버레이입니다.
#
# docs/11-batch-implementation.md 가 정한 분할이다:
#   docker compose -f base.yml up                     # batch 를 아예 안 띄운다
#   docker compose -f base.yml -f batch.yml up batch  # 부하 종료 후 겹쳐 올린다
# "base.yml 은 한 글자도 안 바뀌므로 비교표의 동일 리소스 limit 이 유지된다" 가 그 근거라,
# 여기에 batch 를 넣으면 k6 측정 프로토콜이 깨진다.
#
# ⚠️ 관제도 base 에 둔다. 부하 중에는 batch 가 없어 BatchJobNotRunning 이 뜨는데,
#    그것이 정상임을 다루는 방법은 CY-359 4단계에서 정한다(inhibit 또는 silence).

name: cy

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-app}
      MYSQL_USER: ${DB_USERNAME:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app}
    ports:
      - "${DB_HOST_PORT:-3306}:3306"
    healthcheck:
      # batch 가 DB 보다 먼저 뜨면 "테이블 없음" SQL 에러로 죽고, 스택트레이스가 SQL
      # 계층이라 "검증 배치가 깨졌다" 로 읽힌다. 그 오진을 여기서 막는다.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  prometheus:
    image: prom/prometheus:v3.5.0
    # ⚠️ CI 의 규칙 검사(.github/workflows/build.yml)와 같은 태그여야 한다.
    #    다르면 CI 가 통과한 규칙을 운영 Prometheus 가 거부할 수 있다.
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "${PROMETHEUS_HOST_PORT:-9490}:9090"
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "${ALERTMANAGER_HOST_PORT:-9493}:9093"
    depends_on:
      - alert-sink

  alert-sink:
    # 표준 라이브러리만 쓰는 mock 리시버라 이미지를 따로 만들지 않는다.
    image: python:3.13-slim
    volumes:
      - ./infra/alertmanager/alert-sink.py:/app/alert-sink.py:ro
    command: ["python", "-u", "/app/alert-sink.py"]

volumes:
  mysql-data:
