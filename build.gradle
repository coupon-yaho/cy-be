plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0' apply false
    id 'io.spring.dependency-management' version '1.1.7'
}

allprojects {
    group = 'com.kafkick'
    version = '0.0.1-SNAPSHOT'
    description = 'coupon-yaho'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        }
    }

    dependencies {
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.register("prepareKotlinBuildScriptModel") {}

    // 커밋되는 것은 *.yml.example 이고 실제로 로드되는 이름은 gitignore 대상이다(.gitignore:44-49).
    // 복사를 빼먹으면 앱이 죽지 않고 <b>설정 없이</b> 뜬다 — application.yml 이 없으면 그 안의
    // spring.config.import 가 통째로 안 돌아서, 나머지 파일이 없다는 사실조차 드러나지 않는다.
    //
    // 실측 — 그 상태의 신규 클론에서 ./gradlew build 는 observation.datasource.enabled 를
    // 조건으로 갖는 빈이 사라져 테스트 10개로만 실패한다. 메시지는
    // NoSuchBeanDefinitionException: BatchExecutionRepository 이고, 원인이 설정 부재라는 것은
    // 거기에 안 나온다. 나머지 638개는 그대로 초록이라 "설정 없이 도는 앱을 검증 중" 이라는
    // 사실도 안 보인다.
    //
    // 그래서 빌드가 채운다. Dockerfile 이 이미 이미지 빌드에서 같은 복사를 한다 — 새 규칙이
    // 아니라 로컬·CI 에도 같은 것을 적용하는 것이다.
    //
    // ⚠️ 소스 트리에는 쓰지 않는다. src/main/resources 에 만들어 두면 gitignore 대상 파일을
    //    빌드가 만들어 놓는 꼴이라, 각자 고친 값을 다음 빌드가 덮는지 아닌지 알 수 없게 된다.
    //    여기서 채우는 것은 빌드 산출물뿐이고, 실제 이름의 파일이 소스에 있으면 그쪽이 이긴다.
    //
    // ⚠️ "산출물에 없으면 채운다" 가 아니라 "소스에 없으면 채운다" 이다. 둘은 다르다 —
    //    앞의 술어는 지난 빌드가 만들어 둔 파일도 보존해서, .example 을 고쳐도 예전 내용이
    //    남는 상태를 만든다. 실측으로는 지금 Gradle 이 자기 출력 디렉터리의 미확인 파일을
    //    치워 주기 때문에 그 일이 안 벌어지지만, 그건 우리가 선언한 보장이 아니라 남의 동작이다.
    //    소스를 술어로 쓰면 그 동작에 기대지 않고 매 실행마다 생성본을 최신 .example 로 덮는다.
    tasks.named('processResources') {
        def resourceRoots = sourceSets.main.resources.srcDirs
        doLast {
            def output = destinationDir
            fileTree(output) { include '**/*.yml.example' }.each { example ->
                def relative = output.toPath().relativize(example.toPath()).toString()
                def realRelative = relative - '.example'
                // 각자 만든 실제 파일이 있으면 그것이 이긴다. processResources 가 이미 복사했다.
                if (resourceRoots.any { new File(it, realRelative).exists() }) {
                    return
                }
                new File(output, realRelative).bytes = example.bytes
            }
        }
    }

    tasks.named('test') {
        useJUnitPlatform()

        // ── 스프링 테스트 컨텍스트 캐시 상한 ────────────────────────────────
        //
        // 기본값은 32 다(ContextCache.DEFAULT_MAX_CONTEXT_CACHE_SIZE — javap 로 확인).
        // 한때 여기가 **4** 였다. MySqlContainerConfig 가 컨테이너를 @Bean 으로 내줘서
        // **컨텍스트마다 mysqld 가 하나씩** 떴고, 동시에 18개가 살아 약 8GB 를 써서
        // Docker VM(7.65GB)을 넘겼기 때문이다 — CI 가 그걸로 세 번 깨졌다(CY-392).
        //
        // **CY-621 이 그 원인을 없앴다.** 컨테이너를 JVM 이 소유하므로 컨텍스트가 밀려나도
        // mysqld 는 그대로 산다. 실측: :batch:test 의 컨테이너 기동이 44회 → 4회,
        // 동시에 살아 있는 것이 18개 → 3개, 전체 빌드가 약 300초 → 97초.
        //
        // ⚠️ **제약이 메모리에서 연결 수로 옮겨 갔다.** 캐시된 컨텍스트가 각자 Hikari 풀을
        //    들고 **한 서버**에 붙는다. 32로 올린 직후 "Too many connections" 가 282번 났고,
        //    컨테이너의 --max-connections 를 아래 식으로 계산해 넘겨 풀었다.
        // **두 값을 한 곳에서 계산한다.** 예전에는 maxSize 가 여기, --max-connections 가
        // MySqlContainerConfig 에 각각 하드코딩돼 서로를 몰랐다. 한쪽만 올리면 나오는 실패가
        // "Too many connections" 인데, 그걸 받는 사람은 Hikari 를 의심하지 mysqld 인자를
        // 의심하지 않는다 — 이 저장소는 이미 같은 종류의 오독으로 시간을 태웠다.
        //
        // 컨텍스트당 Hikari 풀은 batch 가 가장 크다 — application.yml.example 의
        // BATCH_DB_POOL_SIZE 기본값 13 이다(storage 는 10). 큰 쪽으로 잡고 여유 3배를 둔다.
        // 계산식이 곧 관계의 문서다.
        def contextCacheSize = 32
        def poolPerContext = 13
        systemProperty 'spring.test.context.cache.maxSize', "$contextCacheSize"
        systemProperty 'test.mysql.maxConnections', "${contextCacheSize * poolPerContext * 3}"

        // ⚠️ forkEvery·maxParallelForks 를 켜면 **JVM 수만큼 컨테이너가 곱해진다.**
        //    CY-621 이 44회를 4회로 줄인 것을 되돌리는 유일한 길이다. 켜야 한다면
        //    컨테이너 수를 먼저 재고 결정해라.
        //
        // ⚠️ TESTCONTAINERS_RYUK_DISABLED 를 켜면 회수가 **정상 종료 때만** 된다.
        //    kill -9 로 죽는 CI 러너에서는 컨테이너가 남는다 — SharedMySqlContainers 참고.
    }

    // ── 설정 우선순위 검사용 .example 복사 ──────────────────────────────
    //
    // 저장소가 지키는 것은 .example 뿐이다. 실제 application.yml · storage.yml 은 gitignore
    // 대상이라 사람마다 다르고 CI 에는 아예 없다. 그런데 Boot 는 .example 확장자로 파서를
    // 못 고르므로, 읽을 수 있는 이름으로 복사해 실제로 뜨는 값을 테스트가 확인한다.
    //
    // resolved/ 아래에 둔다. 클래스패스 루트에 storage.yml 이라는 이름으로 놓으면 개발자가
    // 실행용으로 만든 storage/src/main/resources/storage.yml 을 가린다 — 자기 파일 대신
    // .example 을 읽으면서 그 사실을 알 방법이 없다. 그래서 import 경로도 함께 옮긴다.
    //
    // 여기 한 벌만 둔다. 모듈마다 복사하면 한쪽만 고쳐지고 다른 쪽은 낡은 규칙으로 통과한다 —
    // ConfigImportPrecedence 를 storage 픽스처로 올린 이유와 같다.
    // .example 을 가진 모듈에만 걸리므로 세 번째 모듈이 생겨도 따라온다.
    plugins.withId('java') {
        def moduleExample = file('src/main/resources/application.yml.example')
        if (moduleExample.exists()) {
            tasks.named('processTestResources') {
                // filter·rename 클로저의 "본문" 은 어떤 방법으로도 태스크 입력에 올라가지 않는다.
                // 치환 규칙이나 이름만 바꾸고 소스 yml 을 그대로 두면 UP-TO-DATE 로 건너뛰어
                // 옛 산출물이 남고, 원본을 읽는 검사와 사본을 읽는 검사가 서로 다른 파일을 보면서
                // 둘 다 통과한다 — clean 을 강제하는 CI 도 없다.
                //
                // 모듈당 복사 대상이 둘뿐이라 매번 도는 비용(수 ms, test 태스크는 내용 스냅샷이라
                // 재실행되지 않는다)이 규약에 기대는 위험보다 싸다.
                outputs.upToDateWhen { false }

                // 기본값은 데몬 JVM 의 플랫폼 기본 문자셋이다. filter 를 타는 파일만 그 문자셋으로
                // 다시 쓰이므로, JEP 400 이전 JDK 로 데몬이 뜨는 환경에서는 한글 주석이 깨진다.
                filteringCharset = 'UTF-8'

                from(moduleExample) {
                    into 'resolved'
                    rename { 'application.yml' }
                    filter { line ->
                        line.replace('classpath:storage.yml', 'classpath:/resolved/storage.yml')
                    }
                }
                from(project(':storage').file('src/main/resources/storage.yml.example')) {
                    into 'resolved'
                    rename { 'storage.yml' }
                }
            }
        }
    }
}

jar {
    enabled = false
}

// 배선 가드가 쓰는 값. Gradle 이 해석한 런타임 프로젝트 목록을 테스트에 넘긴다 — 배선 선언을
// build.gradle 문자열로 검사하면 주석 형태 하나로 뚫린다(근거는
// RedisLatencyMeterTestSupport.assertOnRuntimeClasspath() javadoc).
//
// 쓰는 곳이 api·batch 둘뿐이라 subprojects 로 넓히지 않는다. 넓히면 나머지 모듈의 test
// up-to-date 체크마다 필요 없는 의존성 해석이 붙는다.
configure([project(':api'), project(':batch')]) {
    tasks.named('test') {
        def runtimeProjects = provider {
            configurations.runtimeClasspath.incoming.resolutionResult.allComponents
                    .collect { it.id }
                    .findAll { it instanceof ProjectComponentIdentifier }
                    .collect { it.projectPath }
                    .join(',')
        }
        inputs.property('runtimeProjects', runtimeProjects)
        doFirst {
            systemProperty 'cy.runtimeProjects', runtimeProjects.get()
        }
    }
}
