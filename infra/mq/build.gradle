dependencies {
    implementation project(':core')

    implementation 'org.springframework.kafka:spring-kafka'

    // 이벤트 직렬화가 core 의 골든 픽스처와 같은 매퍼를 타야 해서 JsonMapper 를 컴파일 타임에 본다.
    implementation 'org.springframework.boot:spring-boot-starter-jackson'

    // 실패 카운터와 Kafka 클라이언트 메트릭. 레지스트리 구현은 api 의 actuator 가 준다.
    implementation 'io.micrometer:micrometer-core'

    // 미터 이름이 실제 scrape 출력에서 어떻게 보이는지 대조하는 계약 테스트가 쓴다.
    // 점→밑줄 변환과 Counter 의 _total 접미사가 어긋나면 조회 쪽이 조용히 빈다.
    testImplementation 'io.micrometer:micrometer-registry-prometheus'

    // KafkaBrokerComposeContractTest 가 org.yaml.snakeyaml.Yaml 로 저장소 루트의 compose.yml 을
    // 읽는다. 지금은 spring-boot-starter 가 전이로 끌어와 선언 없이도 컴파일되지만, 그건 저쪽
    // 사정이다 — Boot 가 그 전이 의존을 빼는 순간 우리 테스트가 컴파일에서 죽고 원인은 우리
    // build.gradle 어디에도 안 적혀 있다. 버전은 BOM 이 정한다(api/build.gradle 과 같은 이유).
    testImplementation 'org.yaml:snakeyaml'

    // 실제 브로커에 태우는 통합 테스트가 쓴다. "알 수 없는 enum 한 건이 컨슈머를 멈추지
    // 않는다" 는 대역으로 증명되지 않는다 — 그 성질은 역직렬화 → 에러 핸들러 → 컨테이너의
    // offset 커밋까지 세 계층이 맞물려야 성립하고, 그중 뒤의 둘은 우리 코드가 아니다.
    testImplementation 'org.testcontainers:testcontainers-kafka'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
}

tasks.named('test') {
    // ⚠️ 저장소 전체의 main 소스를 입력으로 건다. NotificationSenderNullContractTest 가
    // **클래스패스 밖의 소스 파일을 직접 읽기** 때문이다 — Gradle 은 그것을 모르므로,
    // 선언하지 않으면 다른 모듈에 무엇이 추가돼도 이 test 를 UP-TO-DATE 로 건너뛴다.
    //
    // 실측(프로브): 다른 모듈에 발송기 구현을 하나 더 만들고 돌려 보니 `:infra:mq:test` 가
    // UP-TO-DATE 로 아예 안 돌았다. 그 테스트는 "구현이 늘면 계약 목록도 늘어야 한다" 를
    // 잡으라고 만든 것인데, **정확히 그 상황에서 안 돈 것이다.**
    // 가드가 있는데 안 도는 상태가 가드가 없는 것보다 나쁘다 — 초록불이 뜨는데
    // 아무것도 안 봤다. (같은 이유로 아래 compose.yml 도 건다)
    inputs.files(rootProject.fileTree(rootProject.projectDir) {
        include '**/src/main/java/**/*.java'
        exclude '**/build/**'
    }).withPropertyName('repositoryMainSources')
        .withPathSensitivity(PathSensitivity.RELATIVE)

    // KafkaBrokerComposeContractTest 는 클래스패스 밖의 compose.yml 을 읽는다. 선언하지 않으면
    // Gradle 이 그 파일의 변경을 모르고 test 를 UP-TO-DATE 로 건너뛴다 — 브로커를 한 대로
    // 줄여도 초록불이 뜬다. 가드가 있는데 안 도는 상태가 가드가 없는 것보다 나쁘다
    // (api/build.gradle 이 같은 이유로 같은 선언을 한다).
    inputs.files(rootProject.file('compose.yml'))
        .withPropertyName('kafkaBrokerComposeContractInputs')
        .withPathSensitivity(PathSensitivity.RELATIVE)
}
