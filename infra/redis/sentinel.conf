# ⚠️ Redis 인증은 배선돼 있지 않다 — 정본은 docs/12-v2-redis-design.md §6.1.2 이다.
#    여기에 sentinel auth-pass 를 넣으려면 그 절의 표대로 master·replica 도 함께 고친다.
#    이 파일은 환경변수 치환이 안 되므로 auth-pass 는 entrypoint 에서 주입해야 한다.
port 26379
# ⚠️ **감시 대상은 호스트명이 아니라 고정 IP 다.** compose 가 redis 에 이 주소를 못 박는다.
#    호스트명으로 두면 안 되는 이유 — resolve-hostnames 는 Sentinel 이 SDOWN 을 판정할 때마다
#    이름을 **다시 해석**하는데, 감시 대상 컨테이너가 멈추면 Docker DNS 에서 그 이름이 사라져
#    해석이 실패하고 거기서 판정이 멈춘다. SDOWN → ODOWN → 리더 선출 → 승격 사슬이 첫 칸에서
#    끊겨 **failover 가 아예 일어나지 않는다**(실측: "Failed to resolve hostname 'redis'" 를
#    매초 찍으며 45초간 승격 없음). 죽은 이름을 해석해야 죽음을 판정할 수 있다는 모순이다.
#    resolve-hostnames no 로는 이 파일이 아예 못 뜬다("Can't resolve instance hostname", 실측).
#
#    **DNS 로 해석해 주입하지도 않는다.** 그러면 그때그때의 동적 주소가 볼륨에 영속되는데,
#    컨테이너·네트워크가 재생성돼 IP 가 바뀌면 세 Sentinel 이 폐기된 주소를 계속 감시한다 —
#    이름 해석 실패를 주소 노후화로 바꿀 뿐이다.
#
#    아래 자리표시자는 compose 가 `REDIS_MASTER_IP` 로 바꾼다. 그 값은 대역(`REDIS_SUBNET`)과
#    함께 .env 에 고정돼 있어 재생성으로 변하지 않는다 — 해석도 노후화도 없다.
sentinel monitor coupon-master __MASTER_ADDR__ 6379 2
sentinel down-after-milliseconds coupon-master 5000
sentinel failover-timeout coupon-master 10000
sentinel parallel-syncs coupon-master 1
