# ⚠️ Redis 인증은 배선돼 있지 않다 — 정본은 docs/12-v2-redis-design.md §6.1.2 이다.
#    여기에 sentinel auth-pass 를 넣으려면 그 절의 표대로 master·replica 도 함께 고친다.
#    이 파일은 환경변수 치환이 안 되므로 auth-pass 는 entrypoint 에서 주입해야 한다.
port 26379
# ⚠️ **감시 대상은 호스트명이 아니라 IP 다.** entrypoint 가 기동 시 `redis` 를 해석해
#    아래 자리표시자를 바꾼다(compose 참고). 호스트명으로 두면 안 되는 이유는 하나다 —
#    resolve-hostnames 는 Sentinel 이 SDOWN 을 판정할 때마다 이름을 **다시 해석**하는데,
#    감시 대상 컨테이너가 멈추면 Docker DNS 에서 그 이름이 사라져 해석이 실패하고
#    거기서 판정이 멈춘다. SDOWN → ODOWN → 리더 선출 → 승격 사슬이 첫 칸에서 끊겨
#    **failover 가 아예 일어나지 않는다**(실측: "Failed to resolve hostname 'redis'" 를
#    매초 찍으며 45초간 승격 없음). 죽은 이름을 해석해야 죽음을 판정할 수 있다는 모순이다.
#
#    resolve-hostnames no 로는 이 파일이 아예 못 뜬다 —
#    "Can't resolve instance hostname" 으로 기동 실패한다(실측). 그래서 IP 여야 한다.
sentinel monitor coupon-master __MASTER_ADDR__ 6379 2
sentinel down-after-milliseconds coupon-master 5000
sentinel failover-timeout coupon-master 10000
sentinel parallel-syncs coupon-master 1
