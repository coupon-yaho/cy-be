# P-1(OBS-6 선행) 소유 파일. 관제 시계열의 수집·보관 설정이다.
#
# Grafana 는 쓰지 않는다. 같은 격차 숫자가 v1 은 N/A · v2 는 오류 · v3 는 정상이라 임계선으로
# 표현할 수 없고, 원천별 상태 7종도 대시보드 도구가 담지 못한다. Prometheus 는 저장소로만 쓰고
# 화면은 우리 API 가 만든다.
#
# ⚠️ 이 파일이 여는 포트를 호스트로 내보내지 말 것. Prometheus 에는 인증이 없어서 노출하는
#    순간 모든 지표가 열린다. compose.yml 의 prometheus 서비스에 ports: 가 없는 이유이고,
#    관리 포트를 잠근 것(OBS-20)과 같은 이유다. PrometheusScrapeConfigContractTest 가 지킨다.
#
global:
  # 1초. 실측 근거(개발 머신 · 2026-08-18) — up 평균 1.0000 · 분당 60샘플 ·
  # scrape 평균 6.8ms(최대 45.3ms) · 8,200 req/s 부하 중 2.5~2.7ms · 처리량 영향 0.06%.
  #
  # 아래는 페이로드가 늘 때마다 다시 잰 이력이다. 두 환경의 값을 함께 남긴다 —
  # 하나만 남기면 다음 사람이 "코어 탓인지 페이로드 탓인지" 를 다시 못 가른다.
  #
  # ── OBS-31/46 · 개발 머신 (2026-08-25) ─────────────────────────────────────────────
  #
  #   페이로드  445 줄 · 29,037B · 257 표본 → 505 줄 · 34,574B · 317 표본 (+19.1% 바이트)
  #             outcome 축이 둘 → 넷이 되며 app_http_latency_seconds 가 60 → 120 줄.
  #   scrape    실경로 평균 9.9ms · p99 27.5ms · 최대 2.906s · up 평균 0.9968
  #             구/신 페이로드 A/B(정적 서빙) 평균 27.6 → 28.5ms.
  #   판정      평균·p99 한정 — 바이트가 +19.1% 늘어도 시간은 +3.6% 다. 고정비가 지배한다.
  #
  #   ⚠️ 이 비율을 꼬리에 얹지 말 것. 같은 A/B 의 p99 는 구 707ms · 신 487ms 로 구 페이로드가
  #      오히려 나빴고, 최대는 구 1.146s · 신 1.851s 로 반대였다. 방향이 어긋난다는 것 자체가
  #      이 꼬리가 페이로드가 아니라 측정 하네스의 것이라는 뜻이다. 이 머신은 페이로드와
  #      무관하게 이미 샜다 — count_over_time(up{job="api"}[1m]) 최솟값이 17 이었다(60 이 정상).
  #      그래서 꼬리 판정을 보류하고 아래 OBS-48 로 넘겼다.
  #
  # ── OBS-48(CY-558) · 2코어로 조인 조건 (2026-08-27) ← 위 보류를 닫았다 ─────────────
  #
  # ⚠️ 목표 환경 수치가 아니다. 티켓 제목의 "L2(2 vCPU)" 는 옛 토폴로지의 잔재다 —
  #    DEC-07(관제-진행기록 · 확정 2026-08-22)이 컴포넌트당 6코어급 머신으로 갈아엎었고,
  #    실제 환경에는 이 측정이 만든 코어 경합이 없다. 아래 값은 목표 환경보다 나쁜 쪽으로
  #    조인 하한 조건이다. 인용할 때 이 사실을 떼지 말 것.
  #
  #   페이로드  api 1,036 줄 · 100,933B · 810 표본 (개발 머신 기준선 대비 바이트 +192%)
  #             batch 391 줄 · 27,180B · 201 표본 (개발 머신 기준선 없음 — 그때는 안 쟀다)
  #
  #   scrape              유휴 241s          부하 725s
  #     api 평균          45.3 ms            82.6 ms     (+82%)
  #     api p99          780.6 ms           903.8 ms     (+16%)
  #     api 최대        1021.8 ms          1056.4 ms      (+3%)
  #     api 900ms 초과   2/241               9/725
  #     batch 평균        37.6 ms            54.0 ms
  #     batch p99        542.5 ms           513.3 ms
  #     batch 최대      1060.2 ms           725.0 ms
  #     batch 900ms 초과 2/241               0/725
  #
  #   판정      정상. min(count_over_time(up[1m])) 이 api·batch 모두 60 이다(기준 55 이상).
  #             더 조인 조건에서 정상이므로 실제 환경에서 나빠질 이유가 없다 — 보수적으로
  #             유효하다. 반대로 실제 환경이 얼마나 여유로운지는 모른다.
  #             ⚠️ 단 이 지표는 타임아웃 초과를 못 본다. 아래 scrape_timeout 주석을 함께 볼 것.
  #
  #   판정 1    꼬리는 페이로드가 아니라 api JVM 이 제 CPU 예산을 다 쓰고 있는가에 붙어 있다.
  #             부하가 얹은 것은 평균(+82%)이고 최대는 +3% 다. 부하 구간의 표본이 유휴보다
  #             많은데도(822 vs 741) 그렇다. 결정적인 것은 별개 구간이다 — 워밍업이 끝난 뒤에도
  #             api 가 5분 가까이 쿼터 상한(process_cpu_usage 1.000)에 붙어 백로그를 소화했는데,
  #             900ms 초과 53건 중 48건이 그 2분에 몰렸고 표본이 30초 통째로 0 인 구간이 있었다.
  #             부하가 없어도 CPU 가 차면 꼬리가 선다.
  #
  #   판정 2    "고정비가 지배한다" 는 코어를 조이면 그대로는 성립하지 않는다. 바이트 약 3배에
  #             유휴 평균 9.9 → 45.3ms 로 4.6배다 — 바이트보다 시간이 더 늘었다.
  #             ⚠️ 이 4.6배 안에 코어 감소분과 페이로드 증가분이 섞여 있고 가르지 않았다.
  #                가르려면 같은 조건에서 구 페이로드를 정적으로 한 벌 더 긁어야 한다.
  #                (A/B 두 벌 긁기는 폐기했다 — 코어가 빠듯하면 Prometheus 두 벌이 서로
  #                 코어를 다투어, 재려는 그 꼬리를 측정 도구가 만든다.)
  #
  #   재현 조건 CPU     컨테이너 CFS 쿼터 cpus:2 를 api·batch 에. 전용 코어 머신이 아니다 —
  #                     호스트 스케줄러가 위에 하나 더 있다. prometheus 에는 안 걸었다.
  #                     ⚠️ 컨테이너 nproc 은 12 로 보인다(쿼터라서). JVM 은 쿼터를 읽는다 —
  #                        system_cpu_count 2.0. nproc 만 보면 틀린 판단을 한다.
  #             토폴로지 N=1 · MySQL max_connections=151. 공식 AB-G3(N=4 · 50)가 아니다.
  #                     Tomcat threads.max 15 · Hikari 3 이 공식 총량(60 · 12)의 N=4 몫과
  #                     같아서 그대로 뒀고, 그래서 부하도 1/4 로 맞췄다.
  #             캠페인   DB OPEN 회차 3 고정. 구간 중 닫힌 회차 없음.
  #             부하     k6 constant-arrival-rate 5,000/s · 12분 · POST issue · timeout 2s.
  #                     회차 프로필에서 「5초 유지」만 늘렸다 — 5초=5 표본으로는 분포가 안 나온다.
  #                     dropped_iterations≠0 이라 성능 회차로는 무효다. 여기서 필요한 것은
  #                     "api 가 제 CPU 예산을 다 쓰는 상태" 하나였고 달성됐다(부하 중 207%/200%).
  #             batch    가동. 정합성 gap 수집이 MySQL 을 친다.
  #             공식회차 열지 않았다. benchmark_runs 에 행이 없어 회차 비교 데이터는 안 오염됐다.
  #
  #   안 잰 것  DEC-07 의 실제 토폴로지(컴포넌트당 6코어급 · api 는 한 대를 통째로) — 이게 제일
  #             크다. 머신이 한 대뿐이라 "각각 다른 머신" 은 애초에 재현이 안 된다.
  #             페이로드 A/B · 공식 토폴로지(N=4 · 50) · Kafka 를 띄운 페이로드 ·
  #             전용 코어 머신 · 부하 생성기 분리(k6 가 같은 호스트) · 1시간 창.
  #
  #   ⚠️ 수집값을 세는 보조 스크립트는 가져오기 성공을 먼저 확인할 것. 이번에 그걸 안 해서
  #      "캠페인 미터가 3→0 이 됐다" 는 없는 결함을 하나 만들어 냈다(실제로는 페이로드
  #      가져오기 실패였고, retireCampaign 은 closedAt+30분 예약이라 그 시점에 불가능하다).
  #      원시 수치·질의·관측 창 전체는 ~/Downloads/관제-prometheus-실측로그.md (비커밋).
  scrape_interval: 1s

  # interval 보다 작아야 한다. 크게 잡으면 스크레이프가 겹쳐 돌면서 샘플 타임스탬프가 밀리고,
  # count_over_time(up[1m]) 이 60 미만으로 떨어진다.
  #
  # ⚠️ [OBS-48 실측 정정] 이 값을 넘기면 up 은 0 이 된다. 예전 주석이 "넘겨도 up 은 0 이 안
  #    되고 샘플이 빠질 뿐" 이라 적었는데 prom/prometheus v3.6.0 에서는 틀리다 — 타임아웃을
  #    넘긴 스크레이프는 실패로 기록되어 up=0 을 <쓴다>. 교차 실측(2026-08-27)에서 up=0 이 난
  #    회수는 전부 900ms 초과 회수였다(부하 8/9 · 유휴 2/2).
  #
  #    그래서 두 지표는 서로 다른 고장을 본다. 하나로 다른 하나를 대신할 수 없다.
  #        avg_over_time(up[...])    타임아웃 초과·수집 실패. 실패율 = 1 - 이 값
  #        count_over_time(up[1m])   수집기가 아예 멈춰 샘플 자체가 없는 고장
  #    up=0 도 샘플이라 초과가 나도 후자는 60 그대로다 — 위 부하 구간에서 8회 실패했는데
  #    그 값은 60 이었다. 개발 머신의 17 은 반대로 스크레이프가 아예 안 돈 경우다.
  #    어느 쪽이든 화면에는 오류가 안 난다. 값이 성글어질 뿐이라 재지 않으면 아무도 모른다.
  scrape_timeout: 900ms

  # 규칙 파일이 아직 없다. 생기기 전까지 이 값은 아무 일도 하지 않는다 — interval 과 맞춰만 둔다.
  evaluation_interval: 1s

  # ⚠️ external_labels 를 여기에 넣지 말 것. 전 시계열에 라벨이 하나 붙는다.
  #    특히 benchmark_run_id 를 넣으면 회차마다 시계열 집합이 통째로 갈려서 회차 간 비교
  #    질의가 불가능해진다. 회차 경계는 benchmark_runs 의 started_at ~ stopped_at 으로
  #    질의 범위를 잘라 표현한다.

scrape_configs:
  # HTTP 지연·결과·in-flight·자원.
  #
  # 대상은 앱 포트(8080)가 아니라 관리 포트다. management.server.port 를 따로 두면 actuator 는
  # 그 포트에서만 응답한다 — 앱 포트로 긁으면 404 다.
  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api:9090']

  # 정합성 gap · 대기열 길이 · Kafka lag. 이걸 빠뜨리면 도메인 지표가 통째로 안 들어온다.
  #
  # 포트 번호는 batch 가 정한다 — 업무 9091(BATCH_PORT) · 관리 9092(BATCH_MANAGEMENT_PORT),
  # CY-247 이 확정했다. 여기 적힌 9092 는 그 사본이므로 한쪽만 고치면 조용히 up=0 이 된다.
  #
  # PrometheusScrapeConfigContractTest 가 두 파일을 대조한다. 다만 그것이 보는 것은
  # management.yml.example 의 기본값뿐이다 — BATCH_MANAGEMENT_PORT 를 넣어 띄우면 테스트는
  # 초록불인데 up=0 이다. Prometheus 는 설정 파일에서 환경변수를 풀지 않아 여기에 ${...} 를
  # 쓸 수도 없다. 그래서 지금은 "env 로 관리 포트를 바꾸지 않는다" 가 지켜지지 않으면
  # 아무도 못 잡는다.
  - job_name: batch
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['batch:9092']

# ── cardinality ────────────────────────────────────────────────────────────────
# 여기에 relabel_configs / metric_relabel_configs 로 라벨을 덧붙이지 않는다. 라벨 하나가
# 시계열 수를 그 라벨의 값 개수만큼 곱한다.
#
# sample_limit / label_limit 은 일부러 걸지 않았다. 한도를 넘기면 초과분만 버리는 게 아니라
# 그 스크레이프 전체가 실패하고 up=0 이 된다 — 카디널리티 사고를 관측 전면 정지로 바꾸는
# 방어라서, 지금처럼 대상이 둘뿐이고 미터 집합을 우리가 다 아는 상태에서는 대가가 더 크다.
# 대상이 늘어나면 다시 판단한다.
#
# uri 라벨은 Spring 이 템플릿(/api/v1/coupons/{id})으로 내보낸다 — 실제 id 가 들어오면
# 쿠폰 수(300만)만큼 시계열이 생겨 1초 간격으로 긁는 이쪽이 먼저 죽는다. 라벨을 만드는 쪽이
# 앱이라 이 파일로는 못 막고, UriTagCardinalityTest(api 모듈)가 런타임 라벨과 실제 컨트롤러
# 매핑 양쪽을 본다.
