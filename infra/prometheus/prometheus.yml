# 배치 서버 관제 설정.
#
# CY-359 부터 읽는 쪽이 있다 — base.yml 이 이 디렉터리를 /etc/prometheus 로 마운트한다.
#    확인은 파일 존재가 아니라 /api/v1/rules 응답으로 한다.
#
# 규칙 파일이 여기 있는 이유 — 예전에는 batch/src/main/resources/alerts/ 에 뒀는데,
# 거기 두면 **jar 안에만 들어가고** Prometheus 는 jar 를 읽지 않는다.
# "관제가 그대로 가져다 쓴다" 고 적어 놓고 통로를 안 만든 셈이었다.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 알림이 나갈 곳. 이것이 없으면 규칙이 평가돼도 Prometheus 웹 UI 의 Alerts 탭에만 뜨고
# 슬랙·PagerDuty 로는 한 줄도 안 간다 — 규칙을 저장소에 둔 이유가 사라진다.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "rules/*.yml"

scrape_configs:
  # 배치 서버의 관리 포트. 서비스 포트(9090)가 아니라 management 포트다 —
  # application.yml.example 의 BATCH_MANAGEMENT_PORT 와 같아야 한다.
  - job_name: cy-batch
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["batch:9092"]

  # 알림이 실제로 리시버까지 가는지 본다.
  #
  # 이 티켓의 제목이 "알림을 mock 리시버로 보낸다" 인데, 정작 **마지막 구간만 감시 밖**이었다.
  # alert-sink 가 죽으면 Prometheus 는 계속 firing 이고 Alertmanager 는 실패를 자기 로그에만
  # 남긴다 — `logs alert-sink` 에 새 줄이 없는 것을 사람은 "규칙이 틀렸다" 로 읽는다.
  #
  # 이 저장소가 ExpireMetricsUnknown·VerificationMetricsUnknown 으로 두 번 세운 축과 같다:
  # **감시가 꺼진 것을 감시한다.**
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # 규칙 평가와 알림 발송이 도는지. Prometheus 가 스스로를 못 긁으면 나머지도 못 믿는다.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
