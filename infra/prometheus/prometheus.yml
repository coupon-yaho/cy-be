# P-1(OBS-6 선행) 소유 파일. 관제 시계열의 수집·보관 설정이다.
#
# Grafana 는 쓰지 않는다. 같은 격차 숫자가 v1 은 N/A · v2 는 오류 · v3 는 정상이라 임계선으로
# 표현할 수 없고, 원천별 상태 7종도 대시보드 도구가 담지 못한다. Prometheus 는 저장소로만 쓰고
# 화면은 우리 API 가 만든다.
#
# ⚠️ 이 파일이 여는 포트를 호스트로 내보내지 말 것. Prometheus 에는 인증이 없어서 노출하는
#    순간 모든 지표가 열린다. compose.yml 의 prometheus 서비스에 ports: 가 없는 이유이고,
#    관리 포트를 잠근 것(OBS-20)과 같은 이유다. PrometheusScrapeConfigContractTest 가 지킨다.
#
global:
  # 1초. 실측 근거 — up 평균 1.0000 · 분당 60샘플 · scrape 평균 6.8ms(최대 45.3ms) ·
  # 8,200 req/s 부하 중 2.5~2.7ms · 처리량 영향 0.06%.
  #
  # ⚠️ 이 수치는 개발 머신(넉넉한 코어)에서 잰 것이다. L2 기준 환경은 2 vCPU 라 같은 절대값이라도
  #    상대 비중이 커진다. L2 재측정은 아직이다.
  #
  # ── OBS-31 의 outcome 축 배증 · OBS-46 의 재측정 (2026-08-25) ────────────────────────
  #
  # 판정(평균·p99 한정): 페이로드 증가는 scrape 시간을 그 비율로 안 늘린다
  #       (+19.1% 바이트 → 평균 +3.6%). 평균 10.3ms · p99 27.5ms 로 900ms 아래다.
  #
  # 판정 보류(꼬리): 이미 900ms 를 넘긴 스크레이프가 실측에 있다 — 이 개발 머신의 최근
  #       1시간 최대가 2.906s 다. A/B 에서도 최대가 구 1.146s → 신 1.851s 로 <늘었다>.
  #       이것을 페이로드 탓으로 볼 수 없다는 근거는 간접적이다(구 페이로드의 p99 가 오히려
  #       더 나빴고, 이 머신은 페이로드와 무관하게 이미 샌다 — 아래 ⚠️ 둘). 간접이라 여기서
  #       결론 내지 않고 L2(2 vCPU) 재측정으로 넘긴다.
  #
  # 그래서 이 문단이 말할 수 있는 전부는 "타임아웃 안에 든다" 가 아니라
  # "평균·p99 기준으로 이번 변경이 그 상태를 악화시키지 않는다" 다.
  #
  # 페이로드(실측). app_http_latency_seconds 블록만 축이 둘 → 넷으로 늘었다:
  #     60 줄 · 4,531B  →  120 줄 · 10,068B
  #   전체 /actuator/prometheus:
  #     445 줄 · 29,037B · 257 표본  →  505 줄 · 34,574B · 317 표본
  #     = +60 줄(+13.5%) · +5,537B(+19.1%) · +60 표본(+23.3%)
  #   ⚠️ 앞선 문단이 적었던 "233 줄 · 24KB · +25.8%" 는 그때의 페이로드 기준이라 지금은 틀리다.
  #      분모가 445 줄로 늘어 같은 +60 줄이 +13.5% 다.
  #
  # scrape 시간(실측). 살아 있는 스택의 api 대상(구 페이로드, 최근 1시간):
  #     평균 9.9ms · p99 27.5ms · 최대 2.906s · up 평균 0.9968
  #   새 페이로드는 격리된 Prometheus 하나를 따로 띄워 구/신 두 벌을 같은 조건으로 동시에
  #   긁는 A/B 로 쟀다(같은 이미지 prom/prometheus:v3.6.0 · interval 1s · timeout 900ms):
  #     평균 구 27.6ms  →  신 28.5ms.  차이 약 +1.0ms(+3.6%).
  #   즉 바이트가 +19.1% 늘어도 scrape 시간은 +3.6% 다 — 고정비(연결·컨텍스트)가 지배한다.
  #   실경로 평균 9.9ms 에 같은 비율을 얹으면 약 10.3ms 다 — 평균과 p99 는 900ms 아래다.
  #
  #   ⚠️ 이 비율을 꼬리에 그대로 얹지 말 것. 같은 A/B 의 p99 는 구 707ms · 신 487ms 로
  #      <구 페이로드가 더 나빴고>, 최대는 구 1.146s · 신 1.851s 였다. 두 값이 서로 반대
  #      방향이라는 것 자체가 이 꼬리가 페이로드가 아니라 측정 하네스(nginx 컨테이너 ·
  #      Docker Desktop 스케줄링)의 것이라는 뜻이다. 페이로드 증가분을 말할 수 있는 것은
  #      평균뿐이고, 꼬리는 아래 ⚠️ 대로 이 머신에서 이미 페이로드와 무관하게 샌다.
  #      실경로 최대 2.906s 에 이 비율을 곱한 값은 근거가 없다 — L2 재측정에서 함께 본다.
  #
  # ⚠️ 재현 방법과 그 한계. 지금 떠 있는 api 컨테이너는 OBS-31 이전 이미지라 outcome 이
  #    둘뿐이다. 그래서 신 페이로드는 <추정이 아니라> 두 실측을 이어 붙여 만들었다 —
  #    현행 코드를 실제로 기동해(Spring Boot 테스트, 관리 포트 HTTP scrape) 얻은 4축
  #    블록 120 줄을, 살아 있는 api 의 실제 페이로드에서 구 블록 자리에 끼웠다.
  #    A/B 는 그 파일을 정적으로 서빙해 긁었으므로 Prometheus 쪽 파싱까지 포함하지만
  #    앱의 렌더링 시간은 빠져 있다. 그 몫은 위 실경로 평균 9.9ms 안에 이미 들어 있다.
  #
  # ⚠️ 이 개발 머신에서는 페이로드와 무관하게 scrape 가 이미 샌다. 최근 1시간
  #    count_over_time(up{job="api"}[1m]) 의 최솟값이 17 이었다(60 이 정상). A/B 에서도 구/신이
  #    같은 정도로 샜다 — 원인은 페이로드가 아니라 Docker Desktop 의 스케줄링이다.
  #    아래 scrape_timeout 주석대로 이 누락은 오류를 안 낸다. 화면이 성글어질 뿐이다.
  scrape_interval: 1s

  # interval 보다 작아야 한다. 크게 잡으면 스크레이프가 겹쳐 돌면서 샘플 타임스탬프가 밀리고,
  # count_over_time(up[1m]) 이 60 미만으로 떨어진다.
  scrape_timeout: 900ms

  # 규칙 파일이 아직 없다. 생기기 전까지 이 값은 아무 일도 하지 않는다 — interval 과 맞춰만 둔다.
  evaluation_interval: 1s

  # ⚠️ external_labels 를 여기에 넣지 말 것. 전 시계열에 라벨이 하나 붙는다.
  #    특히 benchmark_run_id 를 넣으면 회차마다 시계열 집합이 통째로 갈려서 회차 간 비교
  #    질의가 불가능해진다. 회차 경계는 benchmark_runs 의 started_at ~ stopped_at 으로
  #    질의 범위를 잘라 표현한다.

scrape_configs:
  # HTTP 지연·결과·in-flight·자원.
  #
  # 대상은 앱 포트(8080)가 아니라 관리 포트다. management.server.port 를 따로 두면 actuator 는
  # 그 포트에서만 응답한다 — 앱 포트로 긁으면 404 다.
  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api:9090']

  # 정합성 gap · 대기열 길이 · Kafka lag. 이걸 빠뜨리면 도메인 지표가 통째로 안 들어온다.
  #
  # 포트 번호는 batch 가 정한다 — 업무 9091(BATCH_PORT) · 관리 9092(BATCH_MANAGEMENT_PORT),
  # CY-247 이 확정했다. 여기 적힌 9092 는 그 사본이므로 한쪽만 고치면 조용히 up=0 이 된다.
  #
  # PrometheusScrapeConfigContractTest 가 두 파일을 대조한다. 다만 그것이 보는 것은
  # management.yml.example 의 기본값뿐이다 — BATCH_MANAGEMENT_PORT 를 넣어 띄우면 테스트는
  # 초록불인데 up=0 이다. Prometheus 는 설정 파일에서 환경변수를 풀지 않아 여기에 ${...} 를
  # 쓸 수도 없다. 그래서 지금은 "env 로 관리 포트를 바꾸지 않는다" 가 지켜지지 않으면
  # 아무도 못 잡는다.
  - job_name: batch
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['batch:9092']

# ── cardinality ────────────────────────────────────────────────────────────────
# 여기에 relabel_configs / metric_relabel_configs 로 라벨을 덧붙이지 않는다. 라벨 하나가
# 시계열 수를 그 라벨의 값 개수만큼 곱한다.
#
# sample_limit / label_limit 은 일부러 걸지 않았다. 한도를 넘기면 초과분만 버리는 게 아니라
# 그 스크레이프 전체가 실패하고 up=0 이 된다 — 카디널리티 사고를 관측 전면 정지로 바꾸는
# 방어라서, 지금처럼 대상이 둘뿐이고 미터 집합을 우리가 다 아는 상태에서는 대가가 더 크다.
# 대상이 늘어나면 다시 판단한다.
#
# uri 라벨은 Spring 이 템플릿(/api/v1/coupons/{id})으로 내보낸다 — 실제 id 가 들어오면
# 쿠폰 수(300만)만큼 시계열이 생겨 1초 간격으로 긁는 이쪽이 먼저 죽는다. 라벨을 만드는 쪽이
# 앱이라 이 파일로는 못 막고, UriTagCardinalityTest(api 모듈)가 런타임 라벨과 실제 컨트롤러
# 매핑 양쪽을 본다.
