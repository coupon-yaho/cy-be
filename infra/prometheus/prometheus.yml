global:
  # ⚠️ **1초는 부하 회차 시계열 해상도 때문이다**(main). 배치 알림은 15초로도 충분했지만,
  #    측정 회차가 초 단위 곡선을 남겨야 해서 짧은 쪽으로 맞춘다. 알림 식은 전부
  #    `*_over_time` 창 기반이라 간격이 짧아져도 판정이 안 바뀐다.
  scrape_interval: 1s
  scrape_timeout: 900ms
  evaluation_interval: 1s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "rules/*.yml"

scrape_configs:
  # ⚠️ **job 이름은 batch 다(cy-batch 아님).** api 의 PrometheusScrapeConfigContractTest 가
  #    *"대상은 api·batch 둘"* 을 계약으로 고정한다 — 배포 기준선이 그쪽이라 알림 규칙을
  #    맞췄다(batch-alerts.yml 의 up{job=...} 9곳). 여기만 바꾸면 그 알림이 영원히 안 뜬다.
  - job_name: batch
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["batch:9092"]

  - job_name: api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:9090"]

  # ⚠️ **alertmanager·prometheus 자기 스크레이프는 뺐다(CY-744).**
  #    feature/CY-15 에는 있었는데, ① 알림 규칙이 그 두 잡을 하나도 안 쓰고(실측 grep 0건)
  #    ② api 의 PrometheusScrapeConfigContractTest 가 *"scrape 대상은 api·batch 둘이고
  #    전부 /actuator/prometheus"* 를 계약으로 고정한다. 그 둘은 actuator 가 아니라
  #    /metrics 를 열어서 계약을 만족시킬 수도 없다. 필요해지면 계약부터 고친다.
