rule_files:
  - ../rules/queue-gateway-alerts.yml

evaluation_interval: 1s

tests:
  - name: "상태·가용량·판정 이상을 각 운영 알림으로 구분한다"
    interval: 1s
    input_series:
      - series: 'up{job="queue-gateway",instance="queue-gateway:8081"}'
        values: '0x30'
      - series: 'waiting_snapshot_age{job="queue-gateway",instance="queue-gateway:8081"}'
        values: '-1x30'
      - series: 'waiting_capacity_nodes{job="queue-gateway",instance="queue-gateway:8081"}'
        values: '0x30'
      - series: 'waiting_judgement_total{job="queue-gateway",quality="degraded"}'
        values: '0+1x30'
      - series: 'waiting_backend_fallback_total{job="queue-gateway"}'
        values: '0+1x30'
      - series: 'waiting_allocation_entered_overshoot_total{job="queue-gateway"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 20s
        alertname: QueueGatewayTargetDown
        exp_alerts:
          - exp_labels:
              severity: critical
              channel: server
            exp_annotations:
              summary: "대기열 게이트웨이 지표가 보이지 않습니다"
              description: "queue-gateway:8081/actuator/prometheus 응답과 Prometheus targets의 queue-gateway 상태를 먼저 확인합니다."
      - eval_time: 20s
        alertname: QueueGatewaySnapshotUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              channel: server
            exp_annotations:
              summary: "대기열 스냅샷을 만들지 못하고 있습니다"
              description: "queue-gateway 로그와 /actuator/prometheus의 waiting_snapshot_age를 먼저 확인합니다. 음수는 스냅샷 생성 실패를 뜻합니다."
      - eval_time: 20s
        alertname: QueueGatewayCapacityNodesMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              channel: server
            exp_annotations:
              summary: "처리 가능량을 보고하는 API 인스턴스가 없습니다"
              description: "API 인스턴스와 Redis의 capacity:coupon-svc:v1 키, queue-gateway의 waiting_capacity_nodes를 먼저 확인합니다."
      - eval_time: 20s
        alertname: QueueGatewayJudgementDegraded
        exp_alerts:
          - exp_labels:
              severity: warning
              channel: server
            exp_annotations:
              summary: "대기열 입장 판정이 degraded 상태로 발생했습니다"
              description: "queue-gateway 로그와 /actuator/prometheus의 waiting_judgement_total{quality=\"degraded\"}를 먼저 확인합니다."
      - eval_time: 20s
        alertname: QueueGatewayBackendFallback
        exp_alerts:
          - exp_labels:
              severity: warning
              channel: server
            exp_annotations:
              summary: "대기열 게이트웨이가 백엔드 fallback을 수행했습니다"
              description: "queue-gateway 로그와 /actuator/prometheus의 waiting_backend_fallback_total, 백엔드 API 응답을 순서대로 확인합니다."
      - eval_time: 20s
        alertname: QueueGatewayAllocationOvershoot
        exp_alerts:
          - exp_labels:
              severity: critical
              channel: server
            exp_annotations:
              summary: "대기열 입장 배정이 공급 한도를 초과했습니다"
              description: "queue-gateway 로그와 /actuator/prometheus의 waiting_allocation_entered_overshoot_total, 배정 시점 capacity credit을 즉시 확인합니다."

  - name: "스냅샷이 5초를 넘어 오래되면 stale 알림이 뜨다"
    interval: 1s
    input_series:
      - series: 'waiting_snapshot_age{job="queue-gateway",instance="queue-gateway:8081"}'
        values: '6x30'
    alert_rule_test:
      - eval_time: 20s
        alertname: QueueGatewaySnapshotStale
        exp_alerts:
          - exp_labels:
              severity: warning
              channel: server
            exp_annotations:
              summary: "대기열 스냅샷이 5초 이상 갱신되지 않았습니다"
              description: "queue-gateway 로그와 /actuator/prometheus의 waiting_snapshot_age, Redis 응답 상태를 순서대로 확인합니다."

  - name: "up과 snapshot age 시계열이 아예 없어도 장애를 숨기지 않는다"
    interval: 1s
    alert_rule_test:
      - eval_time: 15s
        alertname: QueueGatewayTargetDown
        exp_alerts:
          - exp_labels:
              severity: critical
              channel: server
            exp_annotations:
              summary: "대기열 게이트웨이 지표가 보이지 않습니다"
              description: "queue-gateway:8081/actuator/prometheus 응답과 Prometheus targets의 queue-gateway 상태를 먼저 확인합니다."
      - eval_time: 15s
        alertname: QueueGatewaySnapshotUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              channel: server
            exp_annotations:
              summary: "대기열 스냅샷을 만들지 못하고 있습니다"
              description: "queue-gateway 로그와 /actuator/prometheus의 waiting_snapshot_age를 먼저 확인합니다. 음수는 스냅샷 생성 실패를 뜻합니다."

  - name: "카운터 리셋 자체는 새 장애로 계산하지 않는다"
    interval: 1s
    input_series:
      - series: 'waiting_judgement_total{job="queue-gateway",quality="degraded"}'
        values: '10 0x20'
      - series: 'waiting_backend_fallback_total{job="queue-gateway"}'
        values: '10 0x20'
      - series: 'waiting_allocation_entered_overshoot_total{job="queue-gateway"}'
        values: '10 0x20'
    alert_rule_test:
      - eval_time: 20s
        alertname: QueueGatewayJudgementDegraded
        exp_alerts: []
      - eval_time: 20s
        alertname: QueueGatewayBackendFallback
        exp_alerts: []
      - eval_time: 20s
        alertname: QueueGatewayAllocationOvershoot
        exp_alerts: []
