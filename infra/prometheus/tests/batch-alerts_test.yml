      - eval_time: 20m
        alertname: VerifyNotSucceeding
        exp_alerts:
          - exp_labels:
              severity: critical
              channel: server
              instance: batch:9092
              job: batch
              dataset: CLEAN
              scope: FULL
            exp_annotations:
              summary: "검증 배치가 SLA(25시간) 안에 CLEAN/FULL 판정을 내지 못했습니다"
              description: "게이트 판정의 근거가 갱신되지 않고 있습니다. **가장 흔한 원인은 그 슬롯에 발급이 있었던 것입니다** — startRunStep 의 rejectIssuancesUpdatedAfterAsOf 가 asOf 이후 갱신된 발급건을 보면 실행을 죽이고, 만료가 찍은 updated_at 은 지워지지 않으므로 그 asOf 는 영구히 못 씁니다. 배치 로그의 \"검증 배치가 판정을 내지 못했습니다\" 를 먼저 봅니다 — 그 문구가 반복되면 batch.schedule.verify-cron 을 발급이 멈춘 창으로 옮겨야 합니다. 그 문구가 없으면 BATCH_SCHEDULING_ENABLED 가 false 로 떴는지, batch.schedule.verify-cron 이 의도한 값인지 순서대로 봅니다. 판정을 내고도 statsAggregateStep 에서 죽으면 잡은 UNKNOWN 이라 여기 걸립니다 — 그때는 verification_runs 에 verdict 가 있는데 이 게이지만 안 움직입니다. 성공 이력이 아예 없는 상태는 아래 VerifyNeverSucceeded 가 집니다."
      - eval_time: 20m
        alertname: CleanupNotSucceeding
        exp_alerts:
          - exp_labels:
              severity: warning
              channel: server
              instance: batch:9092
              job: batch
              spring_batch_job_name: cleanupJob

            exp_annotations:
              summary: "정리 배치가 SLA(25시간) 안에 성공하지 못했습니다"
              description: "검증이 남긴 파생 행이 안 걷히고 있습니다. 실행당 최대 300만 행인 asof_state 가 쌓이므로 며칠이면 디스크가 눈에 띄게 준다. 배치 로그의 \"정리 배치를 시작하지 못했습니다\" 와 \"정리 배치가 끝내지 못했습니다\" 를 먼저 봅니다. BATCH_SCHEDULING_ENABLED 가 false 면 만료도 함께 안 돕니다. \"검증이 도는 중이라 정리를 여기서 멈춥니다\" WARN 이 반복되면 정리가 아니라 열린 채 남은 검증이 원인입니다. BATCH_STEP_EXECUTION 을 STEP_NAME 으로 갈라 STATUS 를 봅니다 — purgeVerificationRunsStep 이 FAILED 면 asof_state 가 안 걷힌 것이고, 그것이 COMPLETED 인데 purgeBatchMetadataStep 만 FAILED 면 asof_state 는 다 걷은 뒤 배치 메타에서 죽은 것입니다. 로그로 가르지 마십시오 — \"배치 메타를 걷었습니다\" 는 걷을 것이 0 인 밤에는 원래 안 찍힙니다. 성공 이력이 아예 없는 상태는 이 알림이 아니라 CleanupNeverSucceeded 가 집니다."