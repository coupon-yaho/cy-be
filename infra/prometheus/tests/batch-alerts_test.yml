      - series: 'cy_batch_admin_auth_enforcement{instance="batch:9092", job="batch"}'
        values: '1+0x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: BatchAdminAuthDisabled
        exp_alerts: []

  # 15분을 못 채우면 아직 안 운다 — 시연 중 잠깐 뜨는 것으로 깨우지 않는다.
  - interval: 1m
    name: "열린 채 꺼진 지 15분 전에는 안 운다"
    input_series:
      - series: 'cy_batch_admin_port_exposed{instance="batch:9092", job="batch"}'
        values: '1+0x40'
      - series: 'cy_batch_admin_auth_enforcement{instance="batch:9092", job="batch"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 14m
        alertname: BatchAdminAuthDisabled
        exp_alerts: []

  # 열린 채 꺼진 상태로 15분이 지나면 운다 — 1차도 2차도 없는 조합이다.
  - interval: 1m
    name: "열린 채 꺼진 채로 15분이 지나면 운다"
    input_series:
      - series: 'cy_batch_admin_port_exposed{instance="batch:9092", job="batch"}'
        values: '1+0x40'
      - series: 'cy_batch_admin_auth_enforcement{instance="batch:9092", job="batch"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: BatchAdminAuthDisabled
        exp_alerts:
          - exp_labels:
              severity: warning
              channel: server
              instance: "batch:9092"
              job: "batch"
            exp_annotations:
              summary: "포트가 열린 채 관리자 API 토큰 관문이 꺼져 있습니다"
              description: >-
                업무 포트를 호스트로 내보낸 상태에서 BATCH_ADMIN_AUTH_REQUIRED=false 입니다. /api/v1/admin/** 에는 stop·recover·abandon 이 있어 **포트에 닿는 누구나 도는 잡을 죽일 수 있습니다** — 1차 방어선(포트 미노출)도 없는 상태입니다. BATCH_ADMIN_TOKEN 을 주고 관문을 다시 켜거나, 포트 노출을 거두십시오.

  # 둘 다 있으면 부재 알림은 안 뜬다.
  - interval: 1m
    name: "관문 게이지가 둘 다 있으면 부재 알림은 안 운다"
    input_series:
      - series: 'up{instance="batch:9092", job="batch"}'
        values: '1+0x40'
      - series: 'cy_batch_admin_port_exposed{instance="batch:9092", job="batch"}'
        values: '0+0x40'
      - series: 'cy_batch_admin_auth_enforcement{instance="batch:9092", job="batch"}'
        values: '1+0x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: BatchAdminAuthGaugeMissing
        exp_alerts: []

  # 관문 게이지만 없어도 조인이 빈 벡터가 된다.
  - interval: 1m
    name: "관문 게이지만 없어도 운다"
    input_series:
      - series: 'up{instance="batch:9092", job="batch"}'
        values: '1+0x40'
      - series: 'cy_batch_admin_port_exposed{instance="batch:9092", job="batch"}'
        values: '1+0x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: BatchAdminAuthGaugeMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              channel: server
              instance: "batch:9092"
              job: "batch"
            exp_annotations:
              summary: "관리자 API 관문 게이지가 없습니다 — BatchAdminAuthDisabled 가 조용히 꺼져 있습니다"
              description: >-
                배치는 떠 있는데 cy_batch_admin_auth_enforcement 또는 cy_batch_admin_port_exposed 시리즈가 없습니다. BatchAdminAuthDisabled 가 둘을 and 로 묶으므로 **포트가 열린 채 관문이 꺼져 있어도 알림이 한 건도 안 갑니다**. 둘은 같은 @Bean 에서 나오므로, 없다는 것은 AdminTokenConfig 가 컴포넌트 스캔 밖으로 나갔다는 뜻일 수 있습니다 — 그러면 관문 자체도 없습니다. /actuator/prometheus 본문에서 두 이름을 직접 봅니다.

  # 노출 게이지만 없어도 마찬가지다 — 이쪽이 안쪽 and 를 판별한다.
  - interval: 1m
    name: "노출 게이지만 없어도 운다"
    input_series:
      - series: 'up{instance="batch:9092", job="batch"}'
        values: '1+0x40'
      - series: 'cy_batch_admin_auth_enforcement{instance="batch:9092", job="batch"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: BatchAdminAuthGaugeMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              channel: server
              instance: "batch:9092"
              job: "batch"
            exp_annotations:
              summary: "관리자 API 관문 게이지가 없습니다 — BatchAdminAuthDisabled 가 조용히 꺼져 있습니다"
              description: >-
                배치는 떠 있는데 cy_batch_admin_auth_enforcement 또는 cy_batch_admin_port_exposed 시리즈가 없습니다. BatchAdminAuthDisabled 가 둘을 and 로 묶으므로 **포트가 열린 채 관문이 꺼져 있어도 알림이 한 건도 안 갑니다**. 둘은 같은 @Bean 에서 나오므로, 없다는 것은 AdminTokenConfig 가 컴포넌트 스캔 밖으로 나갔다는 뜻일 수 있습니다 — 그러면 관문 자체도 없습니다. /actuator/prometheus 본문에서 두 이름을 직접 봅니다.

  # 설정 빈이 스캔 밖으로 나가면 둘이 함께 사라진다 — 관문도 탐지도 없는 상태다.
  - interval: 1m
    name: "관문 게이지가 둘 다 없으면 운다"
    input_series:
      - series: 'up{instance="batch:9092", job="batch"}'
        values: '1+0x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: BatchAdminAuthGaugeMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              channel: server
              instance: "batch:9092"
              job: "batch"
            exp_annotations:
              summary: "관리자 API 관문 게이지가 없습니다 — BatchAdminAuthDisabled 가 조용히 꺼져 있습니다"
              description: >-
                배치는 떠 있는데 cy_batch_admin_auth_enforcement 또는 cy_batch_admin_port_exposed 시리즈가 없습니다. BatchAdminAuthDisabled 가 둘을 and 로 묶으므로 **포트가 열린 채 관문이 꺼져 있어도 알림이 한 건도 안 갑니다**. 둘은 같은 @Bean 에서 나오므로, 없다는 것은 AdminTokenConfig 가 컴포넌트 스캔 밖으로 나갔다는 뜻일 수 있습니다 — 그러면 관문 자체도 없습니다. /actuator/prometheus 본문에서 두 이름을 직접 봅니다.

  # ── CY-744 ─────────────────────────────────────────────────────────────────
  # 2026-08-29 에 실제로 일어난 일을 잠근다: 스케줄러가 꺼진 채 25시간이 지나
  # critical 둘 + warning 하나가 함께 울었고 안내문 세 벌의 정답이 전부 같은 한 줄이었다.
  # 이제 **하나만** 울어야 한다.
  - interval: 1m
    name: "스케줄러가 꺼진 채 하루가 지나면 BatchSchedulingDisabled 하나만 운다"
    input_series:
      - series: 'cy_coupon_round_scheduling_enabled{instance="batch:9092", job="batch"}'
        values: '0x1600'
      # 마지막 성공이 25시간을 넘겼다 — 스케줄러가 켜져 있었다면 SLA 알림이 울 조건이다.
      - series: 'cy_batch_last_success_seconds{spring_batch_job_name="expireJob", instance="batch:9092", job="batch"}'
        values: '-95000x1600'
      - series: 'cy_verify_last_success_seconds{dataset="CLEAN", scope="FULL", instance="batch:9092", job="batch"}'
        values: '-95000x1600'
      # ⚠️ **이것이 2026-08-29 에 함께 운 셋째다.** 입력에 없으면 promtool 은 아무것도
      #    판정하지 않아서, 이 케이스 이름("하나만 운다")이 증명하는 것이 없어진다.
      - series: 'cy_expire_measured_at_seconds{instance="batch:9092", job="batch"}'
        values: '-95000x1600'
    alert_rule_test:
      # for(25h) 를 아직 못 채웠다 — 부하 측정으로 잠깐 끄는 구간은 안 운다.
      - eval_time: 23h
        alertname: BatchSchedulingDisabled
        exp_alerts: []
      # SLA 를 넘긴 상태인데도 두 알림이 조용하다. 원인이 하나로 확정된 상황이라
      # 사람에게 갈래 셋을 뒤지라고 시키지 않는다.
      - eval_time: 23h
        alertname: ExpireNotSucceeding
        exp_alerts: []
      - eval_time: 23h
        alertname: VerifyNotSucceeding
        exp_alerts: []
      # 25시간을 넘기면 이것 하나가 운다.
      - eval_time: 25h5m
        alertname: BatchSchedulingDisabled
        exp_alerts:
          - exp_labels:
              severity: critical
              channel: server
              instance: batch:9092
              job: batch
            exp_annotations:
              summary: "배치 스케줄러가 하루 넘게 꺼져 있습니다 — 만료·검증·정리가 한 번도 안 돕니다"
              description: "batch.scheduling.enabled 가 false 로 떠 있습니다. 크론 슬롯(만료·검증·정리·회차 전이)이 **하나도 발화하지 않으므로** 재고가 안 돌아오고 게이트 판정도 갱신되지 않습니다. 부하 측정 회차 때문에 일부러 껐다면 회차가 끝난 뒤 되돌리십시오 — 그 구간이 25시간을 넘긴 것 자체가 이상입니다. 컨테이너 환경변수 BATCH_SCHEDULING_ENABLED 를 봅니다. batch.yml 의 기본값이 **false** 이므로 .env 에 true 를 안 적으면 꺼진 채로 뜹니다 — .env.example 은 true 이고, 그 둘이 갈리면 이 상태가 됩니다. 켠 뒤에는 다음 슬롯부터 돕니다. 밀린 만료는 한 번에 따라잡히지만 검증은 asOf 슬롯마다 한 건이라 건너뛴 회차는 안 되돌아옵니다."
      - eval_time: 25h5m
        alertname: ExpireNotSucceeding
        exp_alerts: []
      - eval_time: 25h5m
        alertname: VerifyNotSucceeding
        exp_alerts: []
      - eval_time: 25h5m
        alertname: ExpireMetricsBackdated
        exp_alerts: []

  # ── CY-744 ─────────────────────────────────────────────────────────────────
  # **게이지가 없어지는 경우를 잠근다.** `and … == 1` 로 썼다가 되돌린 이유다 —
  # 그 형태는 시리즈가 사라지면 좌변까지 빈 벡터로 만들어 critical 을 침묵시킨다.
  # `unless … == 0` 은 우변이 비면 좌변을 그대로 통과시킨다.
  - interval: 1m
    name: "스케줄러 게이지가 사라져도 SLA critical 은 그대로 운다"
    input_series:
      # cy_coupon_round_scheduling_enabled 를 **일부러 안 넣는다.**
      - series: 'cy_batch_last_success_seconds{spring_batch_job_name="expireJob", instance="batch:9092", job="batch"}'
        values: '-95000x200'
      - series: 'cy_verify_last_success_seconds{dataset="CLEAN", scope="FULL", instance="batch:9092", job="batch"}'
        values: '-95000x200'
    alert_rule_test:
      - eval_time: 100m
        alertname: ExpireNotSucceeding
        exp_alerts:
          - exp_labels:
              severity: critical
              channel: server
              spring_batch_job_name: expireJob
              instance: batch:9092
              job: batch
            exp_annotations:
              summary: "만료 배치가 SLA(25시간) 안에 성공하지 못했습니다"
              description: "갈래가 셋이라 먼저 어느 쪽인지 가른다. **값이 오래됐으면** 배치 서버가 떠 있는지, BATCH_SCHEDULING_ENABLED 가 false 로 뜨지 않았는지, batch.schedule.expire-cron 이 의도한 값인지 순서대로 본다. 검증이 도는 동안 슬롯을 건너뛰는 것도 지연을 만드는데, 그쪽은 로그의 \"만료 슬롯을 건너뜁니다\" WARN 이 답한다. **NaN 이면** 갈래가 셋이다. 먼저 `increase(cy_batch_refresh_failures_total[10m]) > 0` 을 본다 — 증가했으면 되읽기 실패다. 안 증가했으면 7일 창(되읽기 질의의 조회 범위) 안에 성공한 실행이 없는 것이고, 8일 넘게 안 돈 경우가 여기다 — BATCH_JOB_EXECUTION 을 직접 조회해 가른다. **미래 시각이면** 원인은 언제나 시간대 설정이다. 드라이버가 쓸 때 쓰는 존과 UNIX_TIMESTAMP 가 읽을 때 쓰는 세션 존이 갈린 것이다 — storage.yml URL 의 serverTimezone(Connector/J 8.0.23+ 에서 connectionTimeZone 의 별칭이다)과 `SELECT @@session.time_zone, @@global.time_zone` 을 함께 본다. 둘이 다르면 그 차이가 그대로 오차다. 과거 방향으로 어긋나면 위 \"값이 오래됐으면\" 갈래로 나오므로, 그쪽을 다 뒤져도 원인이 안 나오면 이 축을 본다."
      - eval_time: 100m
        alertname: VerifyNotSucceeding
        exp_alerts:
          - exp_labels:
              severity: critical
              channel: server
              dataset: CLEAN
              scope: FULL
              instance: batch:9092
              job: batch
            exp_annotations:
              summary: "검증 배치가 SLA(25시간) 안에 CLEAN/FULL 판정을 내지 못했습니다"
              description: "게이트 판정의 근거가 갱신되지 않고 있습니다. **가장 흔한 원인은 그 슬롯에 발급이 있었던 것입니다** — startRunStep 의 rejectIssuancesUpdatedAfterAsOf 가 asOf 이후 갱신된 발급건을 보면 실행을 죽이고, 만료가 찍은 updated_at 은 지워지지 않으므로 그 asOf 는 영구히 못 씁니다. 배치 로그의 \"검증 배치가 판정을 내지 못했습니다\" 를 먼저 봅니다 — 그 문구가 반복되면 batch.schedule.verify-cron 을 발급이 멈춘 창으로 옮겨야 합니다. 그 문구가 없으면 BATCH_SCHEDULING_ENABLED 가 false 로 떴는지, batch.schedule.verify-cron 이 의도한 값인지 순서대로 봅니다. 판정을 내고도 statsAggregateStep 에서 죽으면 잡은 UNKNOWN 이라 여기 걸립니다 — 그때는 verification_runs 에 verdict 가 있는데 이 게이지만 안 움직입니다. 성공 이력이 아예 없는 상태는 아래 VerifyNeverSucceeded 가 집니다."
      # 꺼진 것이 아니라 없는 것이므로 이쪽은 안 운다.
      - eval_time: 100m
        alertname: BatchSchedulingDisabled
        exp_alerts: []

  # ══════════════════════════════════════════════════════════════════════════
  # 게이트가 **전이**를 어떻게 다루는가 (CY-744 3차 리뷰가 BLOCKER 로 잡은 자리)
  #
  # 한때 규칙이 min_over_time 이었다. 그것은 창의 **최솟값**이라 0 샘플이 하나라도
  # 있으면 0 이고, 스크레이프 한 주기만 꺼도 그 뒤 25시간 동안 여섯 알림이 통째로
  # 침묵했다. 그런데 기존 케이스는 전부 '0x1600'(내내 꺼짐)이라 전이 경로를 안 타서
  # min 이든 max 든 똑같이 통과했다 — **아무것도 증명하지 않는 테스트였다.**
  # 아래 둘이 그 경로를 든다. 되돌리면 첫 케이스가 빨개진다.
  # ══════════════════════════════════════════════════════════════════════════
  - interval: 1m
    name: "잠깐 껐다 켠 것으로는 안 재운다 — 창 내내 꺼져 있어야 재운다"
    input_series:
      # t=9분에 딱 한 샘플만 0. 그 뒤로는 계속 켜져 있다.
      - series: 'cy_coupon_round_scheduling_enabled{instance="batch:9092", job="batch"}'
        values: '1x9 0 1x1590'
      - series: 'cy_coupon_round_pending_open{instance="batch:9092", job="batch"}'
        values: '3x1600'
      - series: 'cy_batch_last_success_seconds{instance="batch:9092", job="batch", spring_batch_job_name="expireJob"}'
        values: '-95000x1600'
      - series: 'cy_verify_last_success_seconds{instance="batch:9092", job="batch", dataset="CLEAN", scope="FULL"}'
        values: '-95000x1600'
    alert_rule_test:
      # 스케줄러가 9시간 50분째 켜져 있고 세 축이 다 SLA 초과다 — 전부 울어야 한다.
      - eval_time: 600m
        alertname: CouponRoundsNotOpening
        exp_alerts:
          - exp_labels:
              severity: critical
              channel: server
              instance: batch:9092
              job: batch
            exp_annotations:
              summary: "지금 열려 있어야 하는 회차가 아직 SCHEDULED 입니다 — 그 회차는 발급이 안 됩니다"
              description: "회차 상태 전이가 5분 넘게 밀렸습니다. 발급 요청은 OPEN 일 때만 통과하므로 그 회차는 **지금 아무도 발급받을 수 없습니다.** 이 게이지는 재고 없는 회차와 창이 지난 회차를 이미 뺀 값이라 **스케줄러 쪽**입니다. **세 갈래로 가릅니다.** ① increase(cy_coupon_round_ticks_total[5m]) == 0 → 스케줄러 스레드가 막혔거나 빈이 안 뜬 것입니다. 스레드 덤프와 기동 로그를 봅니다. ② ticks 는 오르는데 increase(cy_coupon_round_select_failures_total[5m]) > 0 → **대상 조회가 죽고 있습니다.** 흔한 원인은 커넥션 풀 고갈입니다 (BATCH_DB_POOL_SIZE, 04:10~04:30 겹침). ③ ticks 는 오르고 조회도 되는데 increase(cy_coupon_round_transition_failures_total[5m]) > 0 → UPDATE 가 죽고 있습니다. 배치 로그의 \"열기 N건이 실패했습니다\" 가 대표 원인을 답니다. 셋 다 0 이면 게이지가 낡은 것입니다 — CouponRoundMetricsStale 을 봅니다."
      - eval_time: 600m
        alertname: ExpireNotSucceeding
        exp_alerts:
          - exp_labels:
              severity: critical
              channel: server
              instance: batch:9092
              job: batch
              spring_batch_job_name: expireJob
            exp_annotations:
              summary: "만료 배치가 SLA(25시간) 안에 성공하지 못했습니다"
              description: "갈래가 셋이라 먼저 어느 쪽인지 가른다. **값이 오래됐으면** 배치 서버가 떠 있는지, BATCH_SCHEDULING_ENABLED 가 false 로 뜨지 않았는지, batch.schedule.expire-cron 이 의도한 값인지 순서대로 본다. 검증이 도는 동안 슬롯을 건너뛰는 것도 지연을 만드는데, 그쪽은 로그의 \"만료 슬롯을 건너뜁니다\" WARN 이 답한다. **NaN 이면** 갈래가 셋이다. 먼저 `increase(cy_batch_refresh_failures_total[10m]) > 0` 을 본다 — 증가했으면 되읽기 실패다. 안 증가했으면 7일 창(되읽기 질의의 조회 범위) 안에 성공한 실행이 없는 것이고, 8일 넘게 안 돈 경우가 여기다 — BATCH_JOB_EXECUTION 을 직접 조회해 가른다. **미래 시각이면** 원인은 언제나 시간대 설정이다. 드라이버가 쓸 때 쓰는 존과 UNIX_TIMESTAMP 가 읽을 때 쓰는 세션 존이 갈린 것이다 — storage.yml URL 의 serverTimezone(Connector/J 8.0.23+ 에서 connectionTimeZone 의 별칭이다)과 `SELECT @@session.time_zone, @@global.time_zone` 을 함께 본다. 둘이 다르면 그 차이가 그대로 오차다. 과거 방향으로 어긋나면 위 \"값이 오래됐으면\" 갈래로 나오므로, 그쪽을 다 뒤져도 원인이 안 나오면 이 축을 본다."
      - eval_time: 600m
        alertname: VerifyNotSucceeding
        exp_alerts:
          - exp_labels:
              severity: critical
              channel: server
              instance: batch:9092
              job: batch
              dataset: CLEAN
              scope: FULL

            exp_annotations:
              summary: "검증 배치가 SLA(25시간) 안에 CLEAN/FULL 판정을 내지 못했습니다"
              description: "게이트 판정의 근거가 갱신되지 않고 있습니다. **가장 흔한 원인은 그 슬롯에 발급이 있었던 것입니다** — startRunStep 의 rejectIssuancesUpdatedAfterAsOf 가 asOf 이후 갱신된 발급건을 보면 실행을 죽이고, 만료가 찍은 updated_at 은 지워지지 않으므로 그 asOf 는 영구히 못 씁니다. 배치 로그의 \"검증 배치가 판정을 내지 못했습니다\" 를 먼저 봅니다 — 그 문구가 반복되면 batch.schedule.verify-cron 을 발급이 멈춘 창으로 옮겨야 합니다. 그 문구가 없으면 BATCH_SCHEDULING_ENABLED 가 false 로 떴는지, batch.schedule.verify-cron 이 의도한 값인지 순서대로 봅니다. 판정을 내고도 statsAggregateStep 에서 죽으면 잡은 UNKNOWN 이라 여기 걸립니다 — 그때는 verification_runs 에 verdict 가 있는데 이 게이지만 안 움직입니다. 성공 이력이 아예 없는 상태는 아래 VerifyNeverSucceeded 가 집니다."
  - interval: 1m
    name: "스케줄러를 껐어도 미래 시각은 운다 — 그 축은 시간대 오설정이다"
    input_series:
      # compose 기본(false)이 곧 이 형상이다. 게이트가 켜져 있어도 미래 갈래는 살아야 한다.
      - series: 'cy_coupon_round_scheduling_enabled{instance="batch:9092", job="batch"}'
        values: '0x30'
      - series: 'cy_batch_last_success_seconds{instance="batch:9092", job="batch", spring_batch_job_name="expireJob"}'
        values: '100000x30'
      - series: 'cy_batch_last_success_seconds{instance="batch:9092", job="batch", spring_batch_job_name="cleanupJob"}'
        values: '100000x30'
      - series: 'cy_verify_last_success_seconds{instance="batch:9092", job="batch", dataset="CLEAN", scope="FULL"}'
        values: '100000x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: ExpireNotSucceeding
        exp_alerts:
          - exp_labels:
              severity: critical
              channel: server
              instance: batch:9092
              job: batch
              spring_batch_job_name: expireJob
