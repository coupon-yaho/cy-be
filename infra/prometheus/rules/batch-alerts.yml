# 배치 서버 알림 규칙. 관제(Prometheus)가 그대로 가져다 쓴다.
#
# 여기 적힌 메트릭은 우리가 만든 것이 아니라 Spring Batch 가 Micrometer 로 자동 등록하고,
# 관리 포트(기본 9092)의 /actuator/prometheus 로 나간다. 그래서 의존성이 오르거나
# 노출 목록이 좁아지면 **우리도 모르게 사라질 수 있다.** 그것을 막으려고
# BatchMetricExposureTest 가 이 파일을 직접 읽어, 여기 쓰인 이름이 실제로 나오는지 대조한다.
# 규칙을 추가할 때 새 메트릭을 쓰면 그 테스트가 먼저 확인해 준다.
#
# 세 규칙의 성격이 다르다.
#   실패    — 신호가 있다. 잡이 FAILED 로 끝나면 로그(ERROR)와 메트릭 양쪽에 남는다.
#   멈춤    — **신호가 없다.** 이것이 가장 위험하다. 서버가 죽었거나, 누가
#             BATCH_SCHEDULING_ENABLED=false 로 띄웠거나, 크론이 틀렸을 때가 여기다.
#             "일어난 일" 이 아니라 "안 일어난 일" 이라 없는 것을 감시해야 잡힌다.
#   지연    — 주기보다 오래 끈다. 한 번은 넘어가도 이어지면 다음 주기와 겹친다.
#
# ⚠️ 알림마다 channel 라벨이 붙는다 — alertmanager 가 그것으로 수신함을 가른다.
#    severity 로 가르면 안 된다. warning 셋 중 데이터 축은 ExpireSkippingBrokenCoupons
#    하나뿐이고, BatchJobRunningTooLong(성능)·ExpireMetricsUnknown(설정)은 서버 축이다.
#    섞이면 "데이터를 봐라" 로 라우팅된 것의 실제 원인이 접속 URL 인 상황이 나온다 —
#    CY-347 이 없애려 한 오진이 라우팅 계층에서 되살아난다.
#    새 알림을 더할 때 channel 을 빼면 alertmanager 의 sink-unrouted 로 떨어진다.

groups:
  - name: cy-batch
    rules:

      # 잡이 스스로 멈춘 경우. 만료 배치에는 그런 자리가 다섯 있다 —
      #   EXPIRE_ON_CORRUPT_SCHEMA → **접속 설정이 틀렸다.** 오염 스키마를 보고 있어
      #                            시작 전에 세웠다. 데이터도 서버도 아니고 DB 주소다
      #   EXPIRE_HISTORY_COUNT_MISMATCH → 우리 쓰기가 어긋났다. 이력이 빠진 발급건을 찾는다
      #   EXPIRE_ASOF_IN_FUTURE  → 넘긴 파라미터가 틀렸다. 손 트리거에서만 열리고,
      #                            EXPIRED 는 종단이라 이미 넘어간 건은 되돌릴 수 없다
      #   STOCK_ROW_MISSING · STOCK_UNDERFLOW
      #                          → **CY-347 이후 뜻이 바뀌었다.** 이미 어긋난 재고는
      #                            blockedCoupons 가 창 밖으로 빼므로 여기 안 온다.
      #                            여기 왔다면 제외 논리가 새거나 실행 중 재고가 움직인 것이라
      #                            봐야 할 곳은 데이터가 아니라 코드/동시 쓰기다.
      #
      # 데이터가 이미 어긋난 축은 실패가 아니라 ExpireSkippingBrokenCoupons 로 나간다 —
      # 그것이 "데이터가 틀렸다는 판정이 나와도 배치는 정상 종료" 의 실체다.
      #
      # ⚠️ 다섯을 갈라서 알릴 수단이 지금 메트릭에 없다 — spring_batch_job_seconds_count 에
      #    에러코드 라벨이 없어서, 이 알림은 다섯을 한 덩어리로 본다.
      # 어느 자리였는지는 배치 서버 로그의 ERROR 에 EXPIRATION-00N 으로만 남는다.
      # 위 목록이 각각 어디를 봐야 하는지 적고 있다 —
      # 셋(HISTORY_COUNT_MISMATCH · STOCK_ROW_MISSING · STOCK_UNDERFLOW)은 코드를,
      # ASOF_IN_FUTURE 는 넘긴 파라미터를, ON_CORRUPT_SCHEMA 는 접속 URL 을 본다.
      # **데이터를 보러 가는 자리는 이제 없다** — 그 축은 ExpireSkippingBrokenCoupons 다.
      # increase() 만으로는 **첫 실패를 영원히 못 잡는다.** 이 카운터는 status 별로 시계열이
      # 갈리고 FAILED 계열은 첫 실패 때 값 1 로 태어난다. 창 안에 샘플이 하나뿐이면
      # 델타가 0 이라 조건이 거짓이다. 데드락으로 만료가 한 번 희생되는 일회성 실패가
      # 정확히 그 경우다 — 두 번째 실패가 없으면 알림이 한 번도 안 뜬다.
      #
      # 그래서 "10분 전에는 없던 FAILED 계열" 갈래를 or 로 붙인다.
      - alert: BatchJobFailed
        expr: >-
          sum by (spring_batch_job_name) (
            increase(spring_batch_job_seconds_count{spring_batch_job_status="FAILED"}[10m])
          ) > 0
          or (
            (
              sum by (spring_batch_job_name) (
                spring_batch_job_seconds_count{spring_batch_job_status="FAILED"}
              )
              unless
              sum by (spring_batch_job_name) (
                spring_batch_job_seconds_count{spring_batch_job_status="FAILED"} offset 10m
              )
            )
            # "10분 전에 관제가 살아 있었다" 를 함께 본다. 이것이 없으면 스크레이프가 10분 넘게
            # 끊겼다 복구될 때, FAILED 카운터가 0 이 아닌 모든 잡에 대해 옛 실패가 새 실패로
            # 다시 울린다 — 재기동 오탐을 옆 규칙에서 없애고 여기 남겨 둘 이유가 없다.
            and on (spring_batch_job_name)
            sum by (spring_batch_job_name) (spring_batch_job_seconds_count offset 10m)
          )
        for: 0m
        labels:
          severity: critical
          # 라우팅 축. severity 는 긴급도이고, 어디를 봐야 하는지는 이것이 진다.
          channel: server
        annotations:
          summary: "배치 잡이 실패했다 ({{ $labels.spring_batch_job_name }})"
          description: >-
            다시 돌린다고 낫는 실패가 아닐 수 있다.
            배치 서버 로그에서 같은 시각의 ERROR 를 찾아 원인을 먼저 본다.

      # 아예 안 도는 상태. 만료가 밀리면 기한 지난 쿠폰이 계속 살아 있고,
      # 그만큼 재고(active_count)가 안 돌아와 발급 가능 수량이 줄어든 채로 유지된다.
      #
      # ⚠️ **증분 창을 쓰지 않는다.** 예전 BatchJobNotRunning 은
      #    spring_batch_job_seconds_count 의 15분 창 절대 델타가 0 인지로 봤는데, 그것은
      #    **주기가 5분일 때만 성립하는 축**이다. 만료를 배치 창(일 1회)으로 옮기면 그 창이
      #    하루의 대부분 비어 **영구 critical** 이 된다 — 규칙이 틀린 게 아니라 축이 안 맞는다.
      #
      #    마지막 성공 시각은 그 축을 안 탄다. 주기가 5분이든 하루든 질문이 하나이고,
      #    아래 SLA 숫자만 주기에 맞춰 바꾸면 된다.
      #
      # ⚠️ 근거는 DB 다. cy_batch_last_success_seconds 는 BATCH_JOB_EXECUTION 을 읽어 내므로
      #    **재기동해도 값이 그대로** 살아 있다. JVM 안 카운터였다면 배포 직후 최대 한 주기
      #    동안 "모름" 이고, 일 1회에서는 그것이 하루다.
      #
      # SLA 90,000(25시간) = (max-expire-skips 0 + 1) × 일 1회 크론(86,400) + 되읽기 한
      # 주기(60) + BatchJobRunningTooLong(600) = 87,060 위에 여유 2,940초.
      # 만료가 하루를 거르면 25시간째에 운다.
      #
      # ⚠️ **잡 소요 항(600)이 왜 들어가나.** 이 게이지는 END_TIME 이라 이번 실행이 아직
      #    안 끝났으면 그동안 나이가 계속 자란다 — 그 항이 없으면 "어제보다 오래 걸린
      #    정상 실행" 이 도는 도중에 critical 이 뜬다. SlaBudget 이 그 부등식을 진다.
      #
      # ⚠️ **한때 180,000(50시간)이었다.** 건너뛰기를 켜 둔(max-expire-skips=1) 대가였다 —
      #    검증이 도는 중이면 만료 슬롯을 한 번 건너뛰었고, 뚫고 지나가면 그 검증의 asOf 를
      #    영구히 못 쓰기 때문이다(재시딩 말고 복구가 없다). 그 손잡이를 0 으로 내리려면
      #    **겹침 자체가 없어야** 했는데, 검증을 띄우는 경로가 손 트리거뿐이라 시각을 못 가렸다.
      #    CY-470 이 검증을 05:00 크론에 걸어 일정 분리(만료 04:10 · 정리 04:30 · 검증 05:00)를
      #    세웠고, 그래서 둘을 함께 되돌렸다 — MAX_EXPIRE_SKIPS 0 · 이 값 90,000.
      #
      # ⚠️ **여유가 2,940초뿐이다.** run-refresh-ms 를 올리거나 크론을 늘리면 곧바로
      #    ExpireScheduler 생성자의 부등식이 깨져 기동이 거절된다 — 그 거절이 정상 상태의
      #    오탐 critical 보다 낫다는 것이 그 가드의 결정이다.
      #
      # ⚠️ **batch.metrics.expire-sla-seconds 와 같은 값이어야 한다.** 프로메테우스는 앱
      #    설정을 못 읽으므로 두 곳이 손으로 맞춰져 있고, 앱 쪽은 그 값으로
      #    (max-expire-skips + 1) × 크론 최대간격 + run-refresh-ms < SLA 를 기동 때 검사한다.
      #    한쪽만 바꾸면 기동은 되는데 알림이 어긋나거나, 알림은 맞는데 기동이 거절된다.
      #
      # 시연처럼 5분 크론으로 되돌릴 때는 **셋을 함께** 바꾼다 —
      # EXPIRE_CRON · MAX_EXPIRE_SKIPS · EXPIRE_SLA_SECONDS
      # (그리고 **식 둘** — 이 규칙과 ExpireMetricsBackdated).
      #
      # ⚠️ **그때 SLA 를 크론에 맞춰 줄이면 기동이 거절된다(CY-470).** 소요 항(600초)이
      #    부등식에 들어가면서 짧은 크론에서는 그 항이 지배적이 됐다 —
      #    5분 크론·skips 0 이면 300 + 60 + 600 = 960 이라 **SLA 를 961 이상**으로 줘야 한다.
      #    (skips 1 이면 1,260 이상.) 그전에는 360 이면 통과했다.
      #    줄이고 싶으면 BatchJobRunningTooLong 임계를 함께 내리고 SlaBudget 의 상수도
      #    같이 고쳐야 한다 — 그 값이 "정상 상태의 소요 상한" 이라는 선언이기 때문이다.
      - alert: ExpireNotSucceeding
        expr: >-
          (time() - cy_batch_last_success_seconds{spring_batch_job_name="expireJob"}) > 90000
          or (cy_batch_last_success_seconds{spring_batch_job_name="expireJob"} - time()) > 60
        # 나이 갈래는 이미 SLA 만큼 기다린 뒤라 여기서 더 길게 볼 이유가 없다.
        #
        # ⚠️ 스크레이프가 끊긴 갈래는 여기 안 넣는다. 그때 프로메테우스가 이 게이지에
        #    stale 마커를 넣어 두 갈래가 전부 빈 결과가 되고 for 타이머가 리셋된다.
        #    그 사건은 아래 BatchTargetDown 이 up 계열로 따로 진다 — up 은 스크레이프
        #    실패에도 0 이 계속 생성되므로 계열이 안 끊긴다.
        #
        # ⚠️ NaN 갈래도 여기 없다. 그쪽은 예산이 다르다 — 빈 스키마 첫 기동에서는
        #    첫 크론 슬롯(300초) + 되읽기 한 주기(60초)를 기다려야 값이 생긴다.
        #    이 for(5분)를 그대로 주면 **정상 기동인데 critical 이 났다가 스스로 꺼진다.**
        #    아래 ExpireNeverSucceeded 가 그 예산을 갖고 진다.
        for: 5m
        labels:
          severity: critical
          # 라우팅 축. severity 는 긴급도이고, 어디를 봐야 하는지는 이것이 진다.
          channel: server
        annotations:
          summary: "만료 배치가 SLA(25시간) 안에 성공하지 못했습니다"
          description: >-
            갈래가 셋이라 먼저 어느 쪽인지 가른다.
            **값이 오래됐으면** 배치 서버가 떠 있는지, BATCH_SCHEDULING_ENABLED 가 false 로
            뜨지 않았는지, batch.schedule.expire-cron 이 의도한 값인지 순서대로 본다.
            검증이 도는 동안 슬롯을 건너뛰는 것도 지연을 만드는데, 그쪽은 로그의
            "만료 슬롯을 건너뜁니다" WARN 이 답한다.
            **NaN 이면** 갈래가 셋이다. 먼저
            `increase(cy_batch_refresh_failures_total[10m]) > 0` 을 본다 —
            증가했으면 되읽기 실패다. 안 증가했으면 7일 창(되읽기 질의의 조회 범위) 안에
            성공한 실행이 없는 것이고, 8일 넘게 안 돈 경우가 여기다 —
            BATCH_JOB_EXECUTION 을 직접 조회해 가른다.
            **미래 시각이면** 원인은 언제나 시간대 설정이다. 드라이버가 쓸 때 쓰는 존과
            UNIX_TIMESTAMP 가 읽을 때 쓰는 세션 존이 갈린 것이다 —
            storage.yml URL 의 serverTimezone(Connector/J 8.0.23+ 에서 connectionTimeZone 의
            별칭이다)과 `SELECT @@session.time_zone, @@global.time_zone` 을 함께 본다.
            둘이 다르면 그 차이가 그대로 오차다. 과거 방향으로 어긋나면 위 "값이 오래됐으면"
            갈래로 나오므로, 그쪽을 다 뒤져도 원인이 안 나오면 이 축을 본다.

      # 정리도 배치 창에 크론이 있으므로 같은 축을 건다.
      #
      # SLA 90,000(25시간) = 일 1회 크론(86,400) + 되읽기 한 주기(60)
      # + CleanupRunningTooLong(900) = 87,360 위에 여유 2,640초.
      # 만료보다 20분 뒤라는 사실은 여기 안 들어간다 — 이 식은 **정리 자신의 마지막 성공**
      # 에서 재므로 만료와의 간격은 예산과 무관하다.
      #
      # ⚠️ **정리에는 만료의 max-expire-skips 같은 상한이 없다.** 검증이 도는 중이면 정리는
      #    횟수 제한 없이 물러난다(종료 코드 YIELDED). 그 상태를 잡는 것이 바로 이 알림이다 —
      #    물러난 실행은 마지막 성공에 안 실리므로 25시간째에 여기서 운다. 즉 SLA 부등식이
      #    yield 를 모델링하지 않는 대신, **반복되는 yield 는 이 알림이 진다.**
      #
      # ⚠️ **batch.metrics.cleanup-sla-seconds 와 같은 값이어야 한다.** CleanupScheduler
      #    생성자가 그 값으로 "크론 최대간격 + run-refresh-ms < SLA" 를 기동 때 검사한다.
      #    한쪽만 바꾸면 CLEANUP_CRON 을 주 1회로 돌리는 것만으로 정상 상태에서 매일 운다.
      #
      # ⚠️ NaN 갈래는 여기 없다. 아래 CleanupNeverSucceeded 가 그 예산을 갖고 진다 —
      #    비교 필터가 NaN 을 떨어뜨려서, 한 번도 성공한 적 없는 상태는 이 식으로 **영구 침묵**이다.
      #
      # ⚠️ 정리가 안 도는 것은 만료가 안 도는 것과 무게가 다르다. 재고가 안 돌아오는 것이
      #    아니라 디스크가 차는 것이라, severity 를 warning 으로 둔다.
      - alert: CleanupNotSucceeding
        expr: >-
          (time() - cy_batch_last_success_seconds{spring_batch_job_name="cleanupJob"}) > 90000
          or (cy_batch_last_success_seconds{spring_batch_job_name="cleanupJob"} - time()) > 60
        for: 5m
        labels:
          severity: warning
          channel: server
        annotations:
          summary: "정리 배치가 SLA(25시간) 안에 성공하지 못했습니다"
          description: >-
            검증이 남긴 파생 행이 안 걷히고 있습니다. 실행당 최대 300만 행인 asof_state 가
            쌓이므로 며칠이면 디스크가 눈에 띄게 준다.
            배치 로그의 "정리 배치를 시작하지 못했습니다" 와 "정리 배치가 끝내지 못했습니다" 를
            먼저 봅니다. BATCH_SCHEDULING_ENABLED 가 false 면 만료도 함께 안 돕니다.
            "검증이 도는 중이라 정리를 여기서 멈춥니다" WARN 이 반복되면 정리가 아니라
            열린 채 남은 검증이 원인입니다.
            BATCH_STEP_EXECUTION 을 STEP_NAME 으로 갈라 STATUS 를 봅니다 —
            purgeVerificationRunsStep 이 FAILED 면 asof_state 가 안 걷힌 것이고,
            그것이 COMPLETED 인데 purgeBatchMetadataStep 만 FAILED 면 asof_state 는
            다 걷은 뒤 배치 메타에서 죽은 것입니다. 로그로 가르지 마십시오 —
            "배치 메타를 걷었습니다" 는 걷을 것이 0 인 밤에는 원래 안 찍힙니다.
            성공 이력이 아예 없는 상태는 이 알림이 아니라 CleanupNeverSucceeded 가 집니다.

      # 성공 이력을 아직 못 본 상태. 신규 스키마 · BATCH_SCHEDULING_ENABLED=false ·
      # 7일 창 밖이 전부 여기다. 만료 쪽 ExpireNeverSucceeded 와 같은 모양이고,
      # **이것이 없으면 "한 번도 안 돈 정리" 가 영구 침묵이다** — 그 상태가 정확히
      # CleanupJobConfig javadoc 이 "가장 나쁜 결말" 이라고 적은 것이다.
      #
      # for 는 만료와 같은 이유로 짧게 둔다 — 자세한 근거는 ExpireNeverSucceeded 쪽에 적었다.
      # 요약하면 **크론 슬롯을 예산으로 쓰면 재기동마다 타이머가 리셋돼 영원히 안 뜬다.**
      # 콜드 스타트는 시연 절차 첫 단계의 silence 가 덮는다. 만료(10분)보다 길게 둔 것은
      # warning 이라 급히 울릴 이유가 없어서다.
      - alert: CleanupNeverSucceeded
        expr: >-
          cy_batch_last_success_seconds{spring_batch_job_name="cleanupJob"}
          != cy_batch_last_success_seconds{spring_batch_job_name="cleanupJob"}
        for: 30m
        labels:
          severity: warning
          channel: server
        annotations:
          summary: "정리 배치의 성공 이력이 아직 없습니다"
          description: >-
            먼저 `increase(cy_batch_refresh_failures_total[10m]) > 0` 을 본다 —
            증가했으면 되읽기 실패이지 정리 문제가 아니다.
            안 증가했으면 진짜로 성공 이력이 없는 것이다:
            BATCH_SCHEDULING_ENABLED 가 false 로 떴거나(batch.yml 의 기본값이다),
            스키마가 새로 만들어졌거나, 8일 넘게 성공이 없는 것이다.
            매일 실패하는 경우 8일째에 BatchJobFailed 가 아니라 이 알림으로 넘어온다.

      # ── 검증(CY-470) ────────────────────────────────────────────────────────
      # **그레인이 잡 이름이 아니다.** verifyJob 하나가 CLEAN/FULL(게이트가 보는 것)과
      # CORRUPT/FULL(리허설)을 함께 도는데, 잡 이름 그레인에 SLA 를 걸면 리허설 한 번이
      # 시계열을 앞으로 밀어 SLA 를 리셋한다 — 정작 게이트 조합은 며칠째 안 돌았는데 조용하다.
      # 그래서 cy_verify_last_success_seconds{dataset,scope} 를 따로 낸다.
      #
      # ⚠️ **batch.metrics.verify-sla-seconds 와 같은 값이어야 한다.** 프로메테우스는 앱
      #    설정을 못 읽으므로 두 곳이 손으로 맞춰져 있고, 앱 쪽은 그 값으로
      #    크론 최대간격 + run-refresh-ms < SLA 를 기동 때 검사한다.
      #    한쪽만 바꾸면 기동은 되는데 알림이 어긋나거나, 알림은 맞는데 기동이 거절된다.
      #
      # ⚠️ **critical 이다.** 검증이 안 도는 것은 데이터가 틀린 것과 다르지만, 게이트 판정의
      #    근거가 통째로 없어지는 것이라 "며칠 뒤에 알아도 되는" 종류가 아니다 —
      #    그리고 안 돌아도 데이터는 어제 그대로라 **아무도 이상을 못 느낀다.**
      - alert: VerifyNotSucceeding
        expr: >-
          (time() - cy_verify_last_success_seconds{dataset="CLEAN",scope="FULL"}) > 90000
          or (cy_verify_last_success_seconds{dataset="CLEAN",scope="FULL"} - time()) > 60
        for: 5m
        labels:
          severity: critical
          channel: server
        annotations:
          summary: "검증 배치가 SLA(25시간) 안에 CLEAN/FULL 판정을 내지 못했습니다"
          description: >-
            게이트 판정의 근거가 갱신되지 않고 있습니다.
            **가장 흔한 원인은 그 슬롯에 발급이 있었던 것입니다** — startRunStep 의
            rejectIssuancesUpdatedAfterAsOf 가 asOf 이후 갱신된 발급건을 보면 실행을 죽이고,
            만료가 찍은 updated_at 은 지워지지 않으므로 그 asOf 는 영구히 못 씁니다.
            배치 로그의 "검증 배치가 판정을 내지 못했습니다" 를 먼저 봅니다 — 그 문구가
            반복되면 batch.schedule.verify-cron 을 발급이 멈춘 창으로 옮겨야 합니다.
            그 문구가 없으면 BATCH_SCHEDULING_ENABLED 가 false 로 떴는지,
            batch.schedule.verify-cron 이 의도한 값인지 순서대로 봅니다.
            판정을 내고도 statsAggregateStep 에서 죽으면 잡은 UNKNOWN 이라 여기 걸립니다 —
            그때는 verification_runs 에 verdict 가 있는데 이 게이지만 안 움직입니다.
            성공 이력이 아예 없는 상태는 아래 VerifyNeverSucceeded 가 집니다.

      # 성공 이력을 아직 못 본 상태. 신규 스키마 · BATCH_SCHEDULING_ENABLED=false ·
      # 7일 창 밖이 전부 여기다. for 를 크론 슬롯으로 잡으면 안 되는 근거는
      # ExpireNeverSucceeded 쪽에 적었다 — 재기동마다 stale 마커가 들어가 타이머가 리셋된다.
      #
      # ⚠️ **이 알림은 콜드 스타트 silence 에 넣지 않는다.** 볼륨을 지우고 띄운 날 하루 동안
      #    뜨는 것은 맞지만, 그 하루가 "게이트 근거가 없는 하루" 이기도 하다 — 만료의
      #    NotOpening 계열을 silence 에서 뺀 것과 같은 판단이다.
      - alert: VerifyNeverSucceeded
        expr: >-
          cy_verify_last_success_seconds{dataset="CLEAN",scope="FULL"}
          != cy_verify_last_success_seconds{dataset="CLEAN",scope="FULL"}
        for: 10m
        labels:
          severity: critical
          channel: server
        annotations:
          summary: "검증 배치의 CLEAN/FULL 성공 이력이 아직 없습니다"
          description: >-
            먼저 `increase(cy_batch_refresh_failures_total[10m]) > 0` 을 본다 —
            증가했으면 되읽기 실패이지 검증 문제가 아니다.
            안 증가했으면 진짜로 성공 이력이 없는 것이다:
            BATCH_SCHEDULING_ENABLED 가 false 로 떴거나(batch.yml 의 기본값이다),
            스키마가 새로 만들어졌거나, 8일 넘게 CLEAN/FULL 성공이 없는 것이다.
            **CORRUPT 를 손으로 돌린 것은 이 알림을 끄지 않는다** — 그것이 이 그레인의 요지다.

      # 시계열이 아예 없는 경우. 위 둘이 전부 빈 벡터가 되면 오탐이 아니라 **영구 침묵**이다.
      #
      # ⚠️ 게이지는 verifyJob 빈 유무와 **무관하게** 만들어진다(BatchRunMetrics 생성자).
      #    그래서 이 알림이 뜬다면 원인은 "빈이 없다" 가 아니라 **라벨이 어긋났다** 뿐이다 —
      #    잡 이름 그레인의 GaugeMissing 들과 원인 집합이 다르다.
      - alert: VerifyGaugeMissing
        expr: >-
          absent(cy_verify_last_success_seconds{dataset="CLEAN",scope="FULL"})
          and on() (min_over_time(up{job="cy-batch"}[5m]) == 1)
        for: 5m
        labels:
          severity: critical
          channel: server
        annotations:
          summary: "검증의 마지막 성공 시각 게이지가 아예 없습니다 — 라벨이 어긋났습니다"
          description: >-
            배치는 떠 있는데 이 시계열이 없습니다. 이 게이지는 잡 빈 유무와 무관하게
            무조건 만들어지므로, 원인은 VerifyRunContext 의 SLA_DATASET·SLA_SCOPE 가
            바뀐 것뿐입니다 — 그 값은 VerifyScheduler 가 크론에 싣는 조합이기도 해서,
            한쪽만 고치면 검증은 도는데 게이지는 영원히 비어 있습니다.
            /actuator/prometheus 본문에서 cy_verify_last_success_seconds 의 라벨을 직접 봅니다.

      # 시계열이 아예 없는 경우. 근거는 ExpireGaugeMissing 과 같다 — 셀렉터가 안 맞으면
      # 위 둘이 전부 빈 벡터가 되고, 그 결과는 오탐이 아니라 **영구 침묵**이다.
      - alert: CleanupGaugeMissing
        expr: >-
          absent(cy_batch_last_success_seconds{spring_batch_job_name="cleanupJob"})
          and on() (min_over_time(up{job="cy-batch"}[5m]) == 1)
        for: 5m
        labels:
          severity: warning
          channel: server
        annotations:
          summary: "cleanupJob 의 마지막 성공 시각 게이지가 아예 없습니다 — 라벨이 어긋났습니다"
          description: >-
            배치는 떠 있는데 이 시계열이 없습니다. 잡 이름(CleanupJobConfig.JOB_NAME)이
            바뀌었거나, cleanupJob 빈이 컨텍스트에서 사라진 것입니다 —
            BatchRunMetrics 는 List<Job> 빈에서 이름을 모으므로 빈이 없으면 게이지도 없습니다.
            /actuator/prometheus 본문에서 cy_batch_last_success_seconds 의 라벨을 직접 봅니다.

      # 성공 이력을 아직 못 본 상태. 신규 스키마 · BATCH_SCHEDULING_ENABLED=false ·
      # 7일 창 밖(8일 넘게 안 돎)이 전부 여기다. 되읽기 실패도 같은 모양이라
      # BatchRunMetricsStale 을 함께 본다.
      - alert: ExpireNeverSucceeded
        expr: >-
          cy_batch_last_success_seconds{spring_batch_job_name="expireJob"}
          != cy_batch_last_success_seconds{spring_batch_job_name="expireJob"}
        # ⚠️ **이 예산은 크론 슬롯이 아니다.** 크론이 일 1회가 되면서 "슬롯 한 번" 을
        #    예산으로 삼으면 25시간인데, **그 값으로는 이 알림이 영원히 안 뜬다** —
        #    배치가 재기동하면 이 게이지에 stale 마커가 들어가 식이 빈 결과가 되고
        #    for 타이머가 0 으로 리셋된다(위 ExpireNotSucceeding 주석이 같은 메커니즘을
        #    적어 뒀다). 25시간을 채우려면 그동안 재배포가 한 번도 없어야 하는데,
        #    시연 주간에는 그쪽이 오히려 어렵다. 한 번 그렇게 올렸다가 되돌렸다.
        #
        # **그래서 콜드 스타트는 규칙이 아니라 silence 로 다룬다.** 볼륨을 지우고 띄우면
        # 다음 슬롯까지 최대 하루 동안 이 알림이 뜨는데, 그것은 "일부러 껐다" 와 같은 종류의
        # 상태다 — 이 저장소는 그 경우 **규칙에 예외를 안 파고 사람이 재운다**(docs/14 의
        # BATCH_SCHEDULING_ENABLED 절이 같은 결정을 적었다). 시연 절차 첫 단계가 그 명령이다.
        #
        # 10분은 되읽기 한 주기(60초)의 여유다.
        for: 10m
        labels:
          severity: critical
          channel: server
        annotations:
          summary: "만료 배치의 성공 이력이 아직 없습니다"
          description: >-
            먼저 `increase(cy_batch_refresh_failures_total[10m]) > 0` 을 본다 —
            증가했으면 되읽기 실패이지 만료 문제가 아니다.
            안 증가했으면 진짜로 성공 이력이 없는 것이다:
            BATCH_SCHEDULING_ENABLED 가 false 로 떴거나(batch.yml 의 기본값이다),
            스키마가 새로 만들어졌거나, 7일 넘게 성공이 없는 것이다.

      # **시계열이 아예 없는 경우.** 라벨 축이나 잡 이름이 어긋나면 위 규칙들의 셀렉터가
      # 아무것과도 안 맞아 **전부 빈 벡터**가 되고, 그 결과는 오탐이 아니라 **영구 침묵**이다.
      # 감시 축에서는 그쪽이 더 나쁘다 — 만료가 며칠 안 돌아도 아무 신호가 없다.
      # 타깃이 살아 있는 것을 함께 확인해 BatchTargetDown 과 겹치지 않게 한다.
      - alert: ExpireGaugeMissing
        expr: >-
          absent(cy_batch_last_success_seconds{spring_batch_job_name="expireJob"})
          and on() (min_over_time(up{job="cy-batch"}[5m]) == 1)
        for: 5m
        labels:
          severity: critical
          channel: server
        annotations:
          summary: "expireJob 의 마지막 성공 시각 게이지가 아예 없습니다 — 라벨이 어긋났습니다"
          description: >-
            배치는 떠 있는데 이 시계열이 없습니다. 잡 이름(ExpireJobConfig.JOB_NAME)이
            바뀌었거나, 지표 태그 축이 바뀌었거나, 스크레이프에 relabel 이 붙은 것입니다.
            /actuator/prometheus 본문에서 cy_batch_last_success_seconds 의 라벨을 직접 봅니다.

      # 스크레이프가 끊긴 것. 위 규칙에서 갈라 둔 이유는 for 예산이 다르기 때문이다 —
      # 배치 재기동은 이미지 pull 이 느린 날 십 분을 넘길 수 있고, 그것은 사건이 아니다.
      # docs/14 가 부하 구간(batch 미기동)을 silence 로 다루기로 한 것도 이 축이다.
      # **absent() 로는 크래시루프를 못 잡는다.** 컨테이너가 15분 안에 잠깐씩 뜨면
      # 샘플이 하나만 들어와도 absent() 가 거짓이 되어 for 타이머가 리셋되고,
      # 그동안 ExpireNotSucceeding 쪽도 시계열이 끊겨 자기 for 를 못 채운다 —
      # 두 규칙이 서로의 사각을 만든다(promtool test rules 로 65분간 알림 0건을 재현했다).
      #
      # up 은 프로메테우스가 스크레이프마다 스스로 만드는 계열이라 끊기지 않는다.
      # 창 평균이 0.9 미만이면 15분 중 1분 30초 넘게 못 긁은 것이다.
      #
      # unless 절이 **복구를 빠르게 푼다.** 창 평균만 쓰면 타깃이 올라온 뒤에도 15분 창에서
      # 0 구간이 다 빠져나갈 때까지(최대 13분 30초) 조건이 참으로 남는다 — 부하 측정 뒤
      # silence 를 푸는 절차(docs/14)가 그 구간과 겹쳐 오탐 critical 이 나간다.
      # 크래시루프는 정의상 5분 연속 up=1 이 안 나오므로 감지는 유지된다.
      #
      # ⚠️ job 값은 infra/prometheus/prometheus.yml 의 job_name 과 같아야 한다.
      #    다르면 이 규칙이 조용히 안 뜬다. (이것은 프로메테우스가 붙이는 **타깃 라벨**이라,
      #    우리가 내보내는 지표에 job 태그를 달지 말라는 금지와 다른 축이다.)
      - alert: BatchTargetDown
        expr: >-
          avg_over_time(up{job="cy-batch"}[15m]) < 0.9
          unless min_over_time(up{job="cy-batch"}[5m]) == 1
        for: 5m
        labels:
          severity: critical
          channel: server
        annotations:
          summary: "배치의 실행 지표가 아예 안 보입니다 — 서버가 떠 있는지 봅니다"
          description: >-
            시계열이 사라졌습니다. 배치 컨테이너가 안 떠 있거나 스크레이프가 끊긴 것입니다.
            부하 측정 구간처럼 batch 를 일부러 안 띄우는 때는 정상이므로 그 구간에만
            silence 를 겁니다 — docs/14 에 명령이 있습니다.

      # 간헐 실패를 잡는다. 되읽기가 성공/실패를 번갈아 하면 게이지가 정상 ↔ NaN 을 오가고,
      # 아래 BatchRunMetricsUnknown 과 BatchStuckExecution 의 for 타이머가 **서로 반대편 값에
      # 리셋되어 둘 다 영영 안 찬다** — 시체 실행이 있는데도 28분간 알림 0건인 것을
      # promtool test rules 로 재현했다. 카운터는 리셋을 안 타므로 그 구간을 문다.
      #
      # 절대 델타를 쓰는 이유는 VerificationMetricsStale 과 같다 — 재기동하면 카운터가
      # 새로 태어나는데 increase() 는 리셋 직전 값을 더해 배포마다 뜬다.
      #
      # 임계 3 은 되읽기 주기 상한(120초)에서도 10분 창에 다섯 번 시도한다는 계산이다.
      - alert: BatchRunMetricsStale
        expr: >-
          (
            cy_batch_refresh_failures_total
            - cy_batch_refresh_failures_total offset 10m
          ) >= 3
        for: 5m
        labels:
          severity: warning
          channel: server
        annotations:
          summary: "배치 실행 지표 되읽기가 반복 실패하고 있습니다"
          description: >-
            게이지가 정상과 NaN 을 오가는 동안은 NaN 감시도 시체 감시도 for 를 못 채웁니다.
            배치 로그의 "배치 실행 지표를 되읽지 못했습니다" 가 원인을 답합니다.
            흔한 원인은 커넥션 풀 고갈과 배치 메타 잠금입니다.

      # 되읽기가 실패해 지표가 NaN 인 상태. 이것이 없으면 BatchStuckExecution 이
      # 조용히 꺼진다 — NaN > 0 은 거짓이라 그 규칙이 발화 조건 자체를 못 만든다.
      # CY-347 이 ExpireMetricsUnknown 으로 값을 치른 그 자리와 같은 모양이다.
      # for 를 ExpireNotSucceeding 과 **같은 5분으로 맞춘다.** 되읽기가 실패하면
      # markUnknown() 이 두 게이지를 동시에 떨어뜨리므로 둘은 같은 사건인데, for 가 다르면
      # 그 사이 구간에서 저쪽 runbook 의 "함께 떠 있으면 되읽기 실패다" 감별이
      # **구조적으로 거짓**이 된다. 기동 직후 NaN 구간은 되읽기 주기(최대 120초)라 5분이면 덮인다.
      - alert: BatchRunMetricsUnknown
        expr: cy_batch_stuck_executions != cy_batch_stuck_executions
        for: 5m
        labels:
          severity: warning
          channel: server
        annotations:
          summary: "{{ $labels.spring_batch_job_name }} 의 실행 지표를 못 읽고 있습니다 — BatchStuckExecution 이 꺼져 있습니다"
          description: >-
            되읽기가 실패해 게이지가 NaN 입니다. 이 동안 BatchStuckExecution 은 울릴 수 없고,
            만료↔검증 상호 배제가 꺼진 것을 알 수단이 없습니다.
            배치 로그의 "배치 실행 지표를 되읽지 못했습니다" 와
            cy_batch_refresh_failures_total 증분을 함께 봅니다.

      # ──────────────────────────────────────────────────────────────────────
      # 회차 상태 전이 (CY-446)
      #
      # ⚠️ **"스케줄러가 돌았나" 를 알림 축으로 안 쓴다.** CouponRoundScheduler 는 Spring Batch
      #    잡이 아니라 @Scheduled 라 배치 메타를 안 남긴다 — 마지막 성공 시각 축이 없다.
      #    그래서 결과를 본다: **지금 열려 있어야 하는데 안 열린 회차가 있는가.**
      #    CY-392 가 BatchJobNotRunning(증분 창의 델타가 0인지)을 없앤 이유와 같다.
      #    다만 감별용으로 cy_coupon_round_ticks_total 은 낸다 — runbook 이 "스케줄러 쪽인가"
      #    를 가르려면 그것이 있어야 한다.
      #
      # ⚠️ **끈 구간을 갈래에서 뺀다.** batch.yml 의 기본이 BATCH_SCHEDULING_ENABLED=false 이고
      #    결정론 증명 구간에 그것을 끄는 것이 정상 절차다. 되읽기 빈은 그 스위치와 무관하게
      #    뜨므로 게이지는 계속 나가는데, 그것을 critical 로 내보내면 정상 절차 내내 알림이
      #    하나 켜져 있고 곧 무시된다. cy_coupon_round_scheduling_enabled 로 갈래를 뺀다.
      #
      # ⚠️ **재고 없는 회차는 이 축이 아니다.** 그건 데이터가 틀린 것이고 서버를 봐도 안
      #    사라진다 — CouponRoundBlockedByMissingStock(warning / channel: data)이 진다.
      - alert: CouponRoundsNotOpening
        expr: >-
          (cy_coupon_round_pending_open > 0)
          and on(instance, job) (cy_coupon_round_scheduling_enabled == 1)
        for: 5m
        labels:
          severity: critical
          channel: server
        annotations:
          summary: "지금 열려 있어야 하는 회차가 아직 SCHEDULED 입니다 — 그 회차는 발급이 안 됩니다"
          description: >-
            회차 상태 전이가 5분 넘게 밀렸습니다. 발급 요청은 OPEN 일 때만 통과하므로
            그 회차는 **지금 아무도 발급받을 수 없습니다.**
            이 게이지는 재고 없는 회차와 창이 지난 회차를 이미 뺀 값이라 **스케줄러 쪽**입니다.
            **세 갈래로 가릅니다.**
            ① increase(cy_coupon_round_ticks_total[5m]) == 0 → 스케줄러 스레드가 막혔거나
            빈이 안 뜬 것입니다. 스레드 덤프와 기동 로그를 봅니다.
            ② ticks 는 오르는데 increase(cy_coupon_round_select_failures_total[5m]) > 0 →
            **대상 조회가 죽고 있습니다.** 흔한 원인은 커넥션 풀 고갈입니다
            (BATCH_DB_POOL_SIZE, 04:10~04:30 겹침).
            ③ ticks 는 오르고 조회도 되는데
            increase(cy_coupon_round_transition_failures_total[5m]) > 0 →
            UPDATE 가 죽고 있습니다. 배치 로그의 "열기 N건이 실패했습니다" 가 대표 원인을 답니다.
            셋 다 0 이면 게이지가 낡은 것입니다 — CouponRoundMetricsStale 을 봅니다.

      - alert: CouponRoundsNotClosing
        expr: >-
          (cy_coupon_round_pending_close > 0)
          and on(instance, job) (cy_coupon_round_scheduling_enabled == 1)
        for: 5m
        labels:
          severity: warning
          channel: server
        annotations:
          summary: "close_at 이 지난 회차가 아직 OPEN 입니다"
          description: >-
            마감 예정 시각이 지난 회차가 안 닫혔습니다. 재고가 남은 회차라 발급이 계속
            통과합니다 — 예정보다 많이 나갈 수 있습니다.
            여는 쪽(CouponRoundsNotOpening)이 함께 떠 있으면 스케줄러 자체가 안 도는 것이니
            그쪽 runbook 을 따릅니다. 이것만 떠 있으면 닫기 UPDATE 가 실패하고 있는 것이고,
            배치 로그의 "닫기 N건이 실패했습니다" 가 원인을 답니다.

      # 데이터 축이다. 서버를 고쳐도 안 사라진다 — coupon_stocks 에 행이 없는 회차는
      # 스케줄러가 **일부러** 안 연다(열면 발급 경로가 그 회차에서 죽는다).
      - alert: CouponRoundBlockedByMissingStock
        expr: cy_coupon_round_blocked_no_stock > 0
        for: 10m
        labels:
          severity: warning
          channel: data
        annotations:
          summary: "재고 행이 없어 못 여는 회차가 있습니다"
          description: >-
            열려야 할 시각인데 coupon_stocks 에 행이 없어 스케줄러가 일부러 안 연 회차입니다.
            열면 발급 경로가 그 회차에서 죽으므로 **안 여는 것이 맞습니다** —
            고칠 곳은 배치가 아니라 데이터입니다.
            SELECT c.id FROM coupons c LEFT JOIN coupon_stocks s ON s.coupon_id = c.id
            WHERE c.status='SCHEDULED' AND c.open_at <= NOW() AND c.close_at > NOW()
            AND s.coupon_id IS NULL;
            회차 생성 경로가 재고 행을 함께 넣는지 확인합니다.

      # 창을 통째로 놓친 회차. 스케줄러가 꺼져 있던 동안(부하 테스트는 배치 컨테이너를
      # 아예 안 띄운다) 지나간 회차이고, SCHEDULED → CLOSED 는 전이표에 없는 길이라
      # 스케줄러가 자동으로 처리하지 않는다 — 사람이 판단해야 한다.
      - alert: CouponRoundMissedWindow
        expr: >-
          (cy_coupon_round_missed_window > 0)
          and on(instance, job) (cy_coupon_round_scheduling_enabled == 1)
        for: 30m
        labels:
          severity: warning
          channel: data
        annotations:
          summary: "창을 통째로 놓친 회차가 있습니다 — SCHEDULED 인데 close_at 도 지났습니다"
          description: >-
            열릴 시각과 닫힐 시각이 둘 다 지난 채 SCHEDULED 로 남은 회차입니다.
            스케줄러는 이 회차를 **열지 않습니다** — 열면 마감 시각이 지난 회차에서 발급이
            나가고, 그 발급이 300만 건 정합성 검증의 입력을 오염시킵니다.
            SCHEDULED → CLOSED 는 전이표에 없는 길이라 자동으로 닫지도 않습니다.
            부하 테스트처럼 배치를 안 띄운 구간이 있었으면 정상입니다 — 그 회차를 어떻게
            할지(닫을지, 창을 옮길지) 사람이 정합니다.
            **스케줄러를 끈 구간은 갈래에서 뺍니다** — compose 기본이
            BATCH_SCHEDULING_ENABLED=false 라, 빼지 않으면 시드가 심은 SCHEDULED 회차의
            close_at 이 지나는 순간부터 이 알림이 영구 점등하고 데이터 담당은 고칠 것이
            없습니다(원인이 스케줄러를 끈 것입니다).

      # 간헐 실패를 잡는다. 되읽기가 성공/실패를 번갈아 하면 게이지가 정상 ↔ NaN 을 오가고,
      # 위 알림들과 MetricsUnknown 의 for 타이머가 **서로 반대편 값에 리셋되어 둘 다 영영
      # 안 찬다** — 회차가 안 열려 있는데도 25분간 알림 0건인 것을 promtool 로 재현했다.
      # increase() 를 쓰지 않는다: 재기동하면 카운터가 0 에서 다시 태어나 그 구간을 못 본다.
      - alert: CouponRoundMetricsStale
        expr: >-
          (
            cy_coupon_round_refresh_failures_total
            - cy_coupon_round_refresh_failures_total offset 10m
          ) >= 3
        for: 5m
        labels:
          severity: warning
          channel: server
        annotations:
          summary: "회차 전이 대기 되읽기가 간헐 실패하고 있습니다"
          description: >-
            게이지가 정상과 NaN 을 오가는 동안은 대기 감시도 NaN 감시도 for 를 못 채웁니다.
            배치 로그의 "회차 전이 대기 지표를 되읽지 못했습니다" 가 원인을 답합니다.
            흔한 원인은 커넥션 풀 고갈입니다 — BATCH_DB_POOL_SIZE 와 04:10~04:30 겹침을 봅니다.

      # 대상 조회가 죽는 것은 전이 UPDATE 가 죽는 것과 다른 축이다. 이것이 없으면
      # ticks 는 오르고 transition_failures 는 0 이라 runbook 의 감별이 막다른 길이 된다 —
      # 커넥션 풀 고갈이 정확히 그 경로다(조회가 전이보다 먼저 죽는다).
      - alert: CouponRoundSelectFailing
        expr: >-
          (
            cy_coupon_round_select_failures_total
            - cy_coupon_round_select_failures_total offset 10m
          ) >= 3
        for: 5m
        labels:
          severity: warning
          channel: server
        annotations:
          summary: "회차 전이의 대상 조회가 실패하고 있습니다"
          description: >-
            대상을 고르지 못해 그 축(열기 또는 닫기)을 건너뛰고 있습니다. 스케줄러는 돌고
            있으므로 ticks 는 오르는데 전이는 하나도 안 일어납니다 —
            transition_failures 만 보면 0 이라 원인을 못 찾습니다.
            배치 로그의 "대상을 고르지 못해 이번 주기의 ...를 건너뜁니다" 가 원인을 답합니다.
            흔한 원인은 커넥션 풀 고갈입니다 — BATCH_DB_POOL_SIZE 와 04:10~04:30 겹침을 봅니다.

      # 되읽기가 실패해 게이지가 NaN 인 상태. 이것이 없으면 위 넷이 조용히 꺼진다 —
      # NaN > 0 은 거짓이라 발화 조건 자체를 못 만든다. NaN 은 시리즈로 존재하므로
      # absent() 로는 못 잡고, NaN != NaN 이 참인 것을 쓴다.
      #
      # 게이지 넷을 함께 본다. 지금은 한 스냅샷에서 나와 같이 NaN 이 되지만, 그 결합이
      # 깨지는 리팩터가 오면 빠진 축만 눈이 멀고 아무것도 안 잡는다.
      - alert: CouponRoundMetricsUnknown
        expr: >-
          (cy_coupon_round_pending_open != cy_coupon_round_pending_open)
          or (cy_coupon_round_pending_close != cy_coupon_round_pending_close)
          or (cy_coupon_round_missed_window != cy_coupon_round_missed_window)
          or (cy_coupon_round_blocked_no_stock != cy_coupon_round_blocked_no_stock)
        for: 5m
        labels:
          severity: warning
          channel: server
        annotations:
          summary: "회차 전이 대기 지표를 못 읽고 있습니다 — CouponRoundsNotOpening 이 꺼져 있습니다"
          description: >-
            되읽기가 실패해 게이지가 NaN 입니다. 이 동안 회차가 안 열려도 알림이 안 뜹니다.
            배치 로그의 "회차 전이 대기 지표를 되읽지 못했습니다" 와
            cy_coupon_round_refresh_failures_total 증분을 함께 봅니다.
            흔한 원인은 커넥션 풀 고갈입니다.

      # **데이터 채널에도 눈이 먼 것을 알린다.** 되읽기가 실패하면 게이지 넷이 함께 NaN 이
      # 되는데, 위 알림은 channel: server 다 — 그것만 두면 데이터 담당은 자기 알림 둘
      # (BlockedByMissingStock · MissedWindow)이 발화 조건을 못 만드는 것을 모른다.
      # 이 저장소는 "데이터가 틀렸다는 판정과 배치가 일을 안 한다는 판정을 같은 알람으로
      # 묶지 않는다" 를 규칙으로 굳혔다 — 감시가 꺼진 사실에도 같은 규칙을 적용한다.
      - alert: CouponRoundDataMetricsUnknown
        expr: >-
          (cy_coupon_round_missed_window != cy_coupon_round_missed_window)
          or (cy_coupon_round_blocked_no_stock != cy_coupon_round_blocked_no_stock)
        for: 5m
        labels:
          severity: warning
          channel: data
        annotations:
          summary: "회차 데이터 축 지표를 못 읽고 있습니다"
          description: >-
            되읽기가 실패해 게이지가 NaN 입니다. 이 동안
            CouponRoundBlockedByMissingStock 과 CouponRoundMissedWindow 가 발화 조건을
            못 만듭니다 — 재고 행 없는 회차가 생겨도, 창을 놓친 회차가 쌓여도 조용합니다.
            원인은 서버 축입니다(CouponRoundMetricsUnknown 과 같은 사건) — 배치 담당과
            함께 봅니다.

      # **갈래 축이 사라진 것을 감시한다.** 세 회차 알림이 `and on(instance, job)
      # (cy_coupon_round_scheduling_enabled == 1)` 로 끈 구간을 빼는데, 그 게이지가 없어지면
      # 조인이 **빈 벡터**가 되어 셋이 통째로 침묵한다 — 게이지가 0 일 때와 없을 때가
      # 관측상 같아지고, 없을 때는 그것을 알려 주는 것도 없다.
      # CouponRoundMetricsMissing 은 pending_open 만 보므로 이 축을 못 덮는다.
      # ⚠️ **absent() 가 아니라 unless 다.** absent() 는 **전역 부재**만 참이라, 배치를 두
      # 대로 늘렸을 때 한 대에만 게이지가 없으면 조용하다 — 그런데 조인은
      # on(instance, job) 이라 **그 인스턴스의 알림 셋만** 침묵한다. 실측으로 확인했다:
      # up 둘 중 하나에만 게이지를 주면 absent 형은 안 뜨고 unless 형은 그 인스턴스를 지목한다.
      - alert: CouponRoundSwitchMetricMissing
        expr: >-
          (min_over_time(up{job="cy-batch"}[5m]) == 1)
          unless on(instance, job) cy_coupon_round_scheduling_enabled
        for: 10m
        labels:
          severity: warning
          channel: server
        annotations:
          summary: "회차 전이 스위치 게이지가 없습니다 — 알림 셋이 조용히 꺼져 있습니다"
          description: >-
            배치는 떠 있는데 cy_coupon_round_scheduling_enabled 시리즈가 없습니다.
            CouponRoundsNotOpening·NotClosing·MissedWindow 가 이 게이지로 끈 구간을 빼는데,
            없으면 그 조인이 빈 벡터가 되어 **셋 다 발화 조건을 못 만듭니다** —
            회차가 안 열려도 알림이 한 건도 안 갑니다.
            /actuator/prometheus 본문에서 그 이름을 직접 봅니다. 미터 이름이 바뀌었거나
            CouponRoundPendingRefresher 생성자가 그 게이지 등록에 도달하지 못한 것입니다.

      # 지표 자체가 사라진 상태. 배치가 떠 있는데도 없으면 되읽기 빈이 안 뜬 것이다 —
      # 그 빈은 batch.scheduling.enabled 와 무관하게 뜨므로, 꺼 놓은 것으로는 설명이 안 된다.
      # 부하 테스트는 컨테이너를 아예 안 띄우므로 up 으로 그 구간을 뺀다.
      - alert: CouponRoundMetricsMissing
        expr: >-
          absent(cy_coupon_round_pending_open)
          and on() (min_over_time(up{job="cy-batch"}[5m]) == 1)
        for: 10m
        labels:
          severity: warning
          channel: server
        annotations:
          summary: "회차 전이 대기 지표가 아예 없습니다"
          description: >-
            배치는 떠 있는데 cy_coupon_round_pending_open 시리즈가 없습니다.
            CouponRoundPendingRefresher 빈이 안 떴거나 이름이 바뀐 것입니다 —
            그 빈은 batch.scheduling.enabled 와 무관하게 뜨므로 스위치로는 설명이 안 됩니다.
            /actuator/prometheus 본문에서 cy_coupon_round_ 접두사 시리즈를 직접 봅니다 —
            미터 이름이 바뀌었거나 노출 목록이 좁아졌거나 스크레이프에 relabel 이 붙은
            것입니다. **기동 가드 거절은 여기 안 나옵니다** — 그 경우 프로세스가 안 떠서
            up 이 0 이고 이 알림의 갈래에서 빠집니다(그 축은 BatchTargetDown 이 집니다).

      # ──────────────────────────────────────────────────────────────────────
      # 종료 표시를 못 남기고 죽은 실행. 그 행은 STATUS 조회에 END_TIME 검사도 시간 상한도
      # 없어 **영원히** 남고, 만료↔검증 상호 배제가 그것을 시체로 보고 무시한다(CY-384).
      # 무시했다는 사실을 알리는 것이 그동안 WARN 로그 하나뿐이었다 — 게다가 그 로그는
      # **누가 가드를 부를 때만** 나와서, 검증을 하루 한 번 돌리면 며칠씩 신호가 없다.
      #
      # 상호 배제가 꺼진 상태라 "만료가 검증 한복판을 지나가는" 사고가 열려 있다.
      # 셋 다 API 가 있다 — expireJob 은 recover(CY-429), verifyJob 은 stop → abandon
      # (CY-368 · CY-678 이 stop 에 시체 판정을 더했다), cleanupJob 은 recover(CY-697).
      - alert: BatchStuckExecution
        expr: cy_batch_stuck_executions > 0
        for: 10m
        labels:
          severity: warning
          channel: server
        annotations:
          summary: "{{ $labels.spring_batch_job_name }} 에 진도가 멈춘 실행이 남아 있습니다"
          description: >-
            BATCH_JOB_EXECUTION 에서 STATUS 가 STARTING/STARTED/STOPPING 인데
            BATCH_STEP_EXECUTION.LAST_UPDATED 가 batch.stuck-job-after-ms 넘게 안 움직인
            행입니다. 대개 docker compose down 이 잡 한복판에 걸린 흔적입니다.
            **이 행이 있는 동안 만료와 검증의 상호 배제가 그만큼 꺼져 있습니다.**
            **손 SQL 은 마지막 수단입니다** — 살아 있는 실행에 쓰면 VERSION 이 올라가
            다음 update() 가 터집니다. API 도 같은 쓰기를 하지만, 시체 판정을 통과한
            실행에만 한다는 점이 다릅니다(batch.stuck-job-after-ms).
            expireJob 이면 GET /api/v1/admin/expire/runs/stuck 으로 확인하고
            POST .../runs/{id}/recover 한 번이면 됩니다 — 재시도해도 안전합니다.
            verifyJob 이면 /api/v1/admin/verify 쪽 stop → abandon 을 씁니다.
            그 stop 도 시체 판정을 지납니다(CY-678) — 진도가 있으면 409 로 거절합니다.
            cleanupJob 이면 GET /api/v1/admin/cleanup/runs/stuck 으로 확인하고
            POST .../runs/{id}/recover 한 번이면 됩니다(CY-697) — 만료와 같은 모양이고
            재시도해도 안전합니다.
            업무 포트가 안 열려 있으면 batch-expose.yml 을 얹습니다(docs/13 §4).
            asof_state DELETE 와 헷갈리지 마십시오. 그쪽은 다른 사고입니다.

      # 한 실행이 지나치게 오래 끄는 상태.
      #
      # **임계를 주기에서 떼어 냈다.** 5분 크론일 때는 "주기보다 오래" 가 곧 "슬롯이 사라진다"
      # 였지만, 일 1회에서 그 기준은 24시간이라 아무것도 못 잡는다. 대신 **일감의 크기**에서
      # 잡는다 — 하루치 만료가 약 6,300건이고 청크가 1,000이라 일곱 청크다. 600초는 그보다
      # 두 자릿수 여유이고, 그것을 넘으면 넘길 대상이 밀렸거나 한 청크가 막힌 것이다.
      #
      # ⚠️ **batch.stuck-job-after-ms(30분)보다 작아야 한다.** 그 값을 넘으면 만료↔검증
      #    상호 배제가 이 실행을 "죽었다" 로 보고 무시하기 시작한다 — 살아 있는데 느린 것을
      #    먼저 알려 주는 것이 이 알림의 몫이다.
      - alert: BatchJobRunningTooLong
        expr: spring_batch_job_active_seconds_max{spring_batch_job_name="expireJob"} > 600
        for: 1m
        labels:
          severity: warning
          # 라우팅 축. severity 는 긴급도이고, 어디를 봐야 하는지는 이것이 진다.
          channel: server
        annotations:
          summary: "만료 배치가 600초 넘게 돌고 있다 — 하루치는 일곱 청크다"
          description: >-
            넘길 대상이 밀려 있거나 한 청크가 오래 걸린다.
            BATCH_STEP_EXECUTION 의 WRITE_COUNT 로 실제 처리량을 먼저 확인한다.

      # 정리는 임계가 다르다. 지우는 양이 실행당 최대 300만 행이라 만료의 하루치(6,300건)와
      # 자릿수가 다르고, 그동안 asof_state 를 물고 있어 검증과 겹치면 서로 기다린다.
      # 900초는 stuck-job-after-ms(30분)보다 작아 "살아서 느림" 을 먼저 알린다.
      #
      # ⚠️ 잡 축을 정규식으로 합치지 않는다. 임계가 다르면 규칙도 갈라야, 한쪽을 조정할 때
      #    다른 쪽 임계가 조용히 따라 움직이지 않는다.
      - alert: CleanupRunningTooLong
        expr: spring_batch_job_active_seconds_max{spring_batch_job_name="cleanupJob"} > 900
        for: 1m
        labels:
          severity: warning
          channel: server
        annotations:
          summary: "정리 배치가 900초 넘게 돌고 있다 — asof_state 또는 배치 메타를 갈고 있다"
          description: >-
            보존 창 밖 실행이 몰렸거나 청크 하나가 오래 걸린다.
            **Step 이 둘이다.** BATCH_STEP_EXECUTION 을 STEP_NAME 으로 갈라 WRITE_COUNT 를 본다 —
            purgeVerificationRunsStep 이면 CLEANUP_CHUNK_SIZE 와 CLEANUP_STEP_TIMEOUT_MS 의
            관계를, purgeBatchMetadataStep 이면 CLEANUP_METADATA_CHUNK_SIZE 와
            CLEANUP_METADATA_KEEP_DAYS 를 본다 — 그 Step 의 WRITE_COUNT 는 **지운 잡 실행 수**라
            chunk-size 로 나누면 청크 수가 나온다(행 수가 아니다).
            두 chunk-size 는 뜻이 다르다 — 앞은 asof_state 행 수,
            뒤는 잡 실행 수다. 뒤 Step 은 보존 창을 처음 넘긴 밤에 한 번 몰린다
            (청크를 키우면 데드라인도 같이 키워야 한다).

      # 검증은 임계가 또 다르다. **실측 472초**다(CY-470, 300만 발급·516만 이력).
      # 그중 replayStep 하나가 312초를 쓴다 — 나머지 열 Step 을 합쳐도 그보다 짧다.
      # 1200초는 그 2.5배이고, stuck-job-after-ms(30분=1800초)보다 작아
      # "살아서 느림" 을 시체 판정보다 먼저 알린다.
      #
      # ⚠️ **정리(900)보다 크다.** 자릿수가 다른 것이 아니라 하는 일이 다르다 —
      #    정리는 지우고, 검증은 300만 발급을 리플레이해 asof_state 300만 행을 쓴 뒤
      #    규칙 다섯을 돌린다. 잡 축을 정규식으로 합치면 이 차이가 사라진다.
      - alert: VerifyRunningTooLong
        expr: spring_batch_job_active_seconds_max{spring_batch_job_name="verifyJob"} > 1200
        for: 1m
        labels:
          severity: warning
          channel: server
        annotations:
          summary: "검증 배치가 1200초 넘게 돌고 있다 — 실측은 472초다"
          description: >-
            BATCH_STEP_EXECUTION 을 STEP_NAME 으로 갈라 어느 Step 인지 먼저 본다.
            replayStep 이면 정상 구간에서 가장 무거운 Step 이므로 READ_COUNT 로
            진도를 보고 VERIFY_CHUNK_SIZE·VERIFY_REPLAY_WINDOW_SIZE 를 확인한다.
            statsAggregateStep 이면 집계가 걸린 것이다 — 그 Step 은 회차 단위로 쪼개져
            있으므로(CY-470) 회차 수가 늘었거나 DB 가 느린 것이다.
            **1200초를 넘긴 채 30분을 채우면 BatchStuckExecution 으로 넘어간다** —
            그때는 진도(LAST_UPDATED)가 멈춘 것이라 원인이 다르다.

      # ──────────────────────────────────────────────────────────────────────
      # 여기까지는 전부 "잡이 죽었나 / 도는가" 축이다. 셋 다 통과하면서 기한 지난 발급건이
      # 계속 쌓이는 상태가 있고, 그것이 이 잡의 가장 나쁜 실패 모드다 — 재고를 되돌리는
      # 유일한 배치가 조용히 일을 안 한다.
      #
      # 아래 둘이 그 축이고, **서로 갈라야 한다.**
      #   설계: 데이터가 틀렸다는 판정이 나와도 배치는 정상 종료다.
      #         배치가 실패했다고 할 때는 판정을 내지 못한 경우뿐이다.
      #         둘을 같은 알람으로 묶으면 서버를 고칠 상황과 데이터를 볼 상황이 안 갈린다.
      # ──────────────────────────────────────────────────────────────────────

      - alert: ExpireLeavesWorkBehind
        # 막힌 회차의 몫을 뺀 나머지 — 배치가 처리했어야 하는데 안 된 것이다.
        # 빼지 않으면 사람이 재고를 고칠 때까지 24시간 울리고, 그 알림은 곧 무시된다.
        # 뺄셈을 여기서 하지 않는다. 게이지 둘을 따로 set 하는 사이에 스크레이프가 끼면
        # 한쪽만 새 값인 샘플이 나와 식이 음수가 되거나 헛되이 참이 된다.
        # 한 문장에서 세어 한 시계열로 내보낸 값을 그대로 본다.
        expr: cy_expire_unexplained_pending > 0
        # 열 주기(되읽기 60초). **만료 주기가 아니다** — 만료는 일 1회이고, 이 값이 재는
        # 것은 "되읽기가 몇 번 같은 값을 확인했나" 다.
        # **한 실행이 대상을 다 비운다** — 청크는 0 이 나올 때까지 반복하므로
        # "대상이 많아서 다음 주기로 넘어간다" 는 일이 없다. 그래도 남는 것은 막힌 회차의
        # 몫(이미 뺐다)이거나 step-timeout 으로 청크가 끊긴 경우뿐이라, 길게 볼 이유가 없다.
        for: 10m
        labels:
          severity: critical
          # 라우팅 축. severity 는 긴급도이고, 어디를 봐야 하는지는 이것이 진다.
          channel: server
        annotations:
          summary: "만료가 밀리고 있습니다 (남은 대기 {{ $value }}건)"
          description: >-
            기한 지난 발급건이 남아 있습니다.
            **값은 마지막으로 성공한 만료 실행의 asOf 기준입니다**(cy_expire_measured_at_seconds).
            실패한 실행의 잔여는 여기 안 뜹니다 — 그 시각이 하루 이상 낡았으면
            BatchJobFailed·ExpireNotSucceeding 을 먼저 봅니다. 마지막 성공 이후의 밀림은
            이 알림이 아니라 그쪽이 집니다.
            내역은 진단용 게이지 둘로 갈립니다 —
            cy_expire_pending(전체) 과 cy_expire_blocked_pending(막힌 회차의 몫).
            재고가 어긋난 회차의 몫은 이미 뺀 값이라, **서버를 봐야 하는 상황**입니다.
            진도가 막혔거나(BATCH_STEP_EXECUTION 의 WRITE_COUNT 확인),
            asOf 가 엉뚱한 시각을 가리키고 있을 수 있습니다.
            **취소·사용 경로가 붙은 뒤라면** 마지막 성공 이후 CANCEL_USE(USED → ISSUED)로
            되돌아온 건이 여기 섞일 수 있습니다 — 그 회차는 얼린 제외 목록에 없어
            unexplained 로 들어옵니다. 그때는 배치가 아니라 이 규칙을 고쳐야 합니다.

      # ──────────────────────────────────────────────────────────────────────
      # 감시가 꺼진 것을 감시한다.
      #   위 두 알림은 전부 `> 0` 비교이고 `NaN > 0` 은 거짓이다 —
      #   **게이지가 NaN 인 동안 밀림 감시가 조용히 꺼진다.**
      #   NaN 은 시리즈로 존재하므로 absent() 로는 못 잡는다. NaN != NaN 이 참인 것을 쓴다.
      # ──────────────────────────────────────────────────────────────────────
      # **이 게이지는 이제 DB 되읽기다**(CY-421). 한때 afterJob 에서만 채워지는 JVM
      # 게이지라, 만료를 일 1회로 옮긴 뒤(CY-397) 재기동부터 다음 04:10 까지 **최대 하루**가
      # NaN 이었다. ExpirePendingRefresher 가 60초마다 마지막으로 성공한 실행의 asOf 로
      # 다시 세므로 그 창이 사라졌다.
      #
      # NaN 이 뜻하는 것은 넷인데, **둘은 사건이 아니다.**
      #   ① 성공한 실행이 7일 창 안에 없다 — 볼륨을 지우고 띄우면 다음 04:10 까지 정상이다.
      #      되읽기가 닫은 창은 "성공한 실행이 DB 에 있는데 프로세스가 재기동했다" 하나뿐이고
      #      **아예 한 번도 안 돈 창은 그대로다.** 규칙에 예외를 안 파고 시연 절차 첫 단계의
      #      silence 가 덮는다 — BATCH_SCHEDULING_ENABLED 에 대해 이미 내린 결정과 같다.
      #   ② 오염셋을 보고 있다 — 문서화된 정상 절차다(docs/14 의 "검증용 셋에 Spring Batch
      #      메타 테이블이 없다" 절). 이쪽은 silence 로 두면 사유가 ①과 달라 섞이므로
      #      **지표로 가른다**: cy_expire_clean_schema 로 조인한다.
      #
      # ⚠️ 조인을 `== 1`(정상셋으로 확인된 것만)로 걸면 **이 규칙이 갈래 ④를 스스로 죽인다.**
      #    되읽기가 recordSchema 에 닿기 전에 매번 죽으면 그 게이지도 NaN 이고, PromQL 에서
      #    NaN == 1 은 거짓이라 우변이 빈 벡터가 되어 좌변이 NaN 인 동안에도 못 뜬다.
      #    그래서 `unless == 0`(**오염셋으로 확인된 것만 뺀다**)으로 건다 — 빼겠다는 의도는
      #    그대로이고, "아직 모른다" 가 알림을 죽이지 않는다.
      #   ③ 제외 목록을 못 읽었다  ④ 되읽기가 실패했다 — 둘 다 사건이다.
      #
      # ③과 ④를 가르는 것이 실패 카운터다. ③은 다음 만료 창까지 안 변하는 **지속 상태**라
      # 카운터를 안 올린다(안 올리면 하루 1,440 이 쌓여 ExpireMetricsStale 이 엉뚱하게 뜬다).

      # ── docs/13 §2c — "돌기는 도는데 안 줄어든다" ─────────────────────────
      # **두 조건을 AND 로 묶는 것이 핵심이다.** 처리량 0 자체는 정상이다 —
      # 만료할 것이 없는 날이 대부분이다. **남은 대상이 있는데 0** 인 것이 사건이다.
      #
      # cy_expire_pending 이 아니라 cy_expire_unexplained_pending 이다. 막힌 회차의
      # 대기는 배치가 일부러 건너뛴 몫이라, 그것으로 묶으면 오염 회차 하나가 남아 있는
      # 동안 이 알림이 영구히 울린다.
      #
      # ⚠️ **창은 만료 주기(24h)보다 넓어야 한다.** 한때 30m 였는데, 만료가 하루 한 번
      #    04:10 이라 **하루 1,440분 중 1,410분 동안 좌변이 항상 참**이었다 — 남는 것은
      #    unexplained > 0 하나이고 그것이 곧 ExpireLeavesWorkBehind 의 식 전체다.
      #    promtool 로 재현했다: 04:10 에 1000건을 넘긴 뒤 eval_time 6h40m 에서 둘이 같이
      #    떴다. repeat_interval 이 1h 라 그 중복이 시간당 한 번씩 Slack 으로 나간다 —
      #    §2 를 닫으려는 티켓이 아무도 안 보게 만드는 알림을 하나 더 붙이는 꼴이었다.
      #    26h 면 "한 주기를 통째로 헛돌았다" 가 된다.
      #
      # ⚠️ **게이지가 좌변이어야 한다.** `and` 는 좌변의 값을 낸다. increase(...) == 0 을
      #    좌변에 두면 $value 가 **항상 0** 이라, summary 가 "아무것도 안 넘기고 있는데
      #    남은 대기가 0건" 이라는 자기모순이 된다. promtool 이 실제로 그렇게 렌더링했다.
      #
      # ⚠️ **`offset 26h` 가 배포 직후 오탐을 막는다.** 새로 뜬 프로세스의 시계열은
      #    창을 다 못 채우는데 `increase()` 는 그것을 **0** 으로 낸다 — 재현: 90분치
      #    시계열에 `unexplained=5` 만 있어도 85분에 떴다. `offset 26h` 항은 26시간 전에
      #    표본이 있어야 매칭되므로, 그때까지는 통째로 빈 벡터가 되어 조용하다.
      #    (값 비교가 아니라 **존재 검사**다. `>= 0` 은 있으면 항상 참이다.)
      - alert: ExpireMakingNoProgress
        expr: >-
          cy_expire_unexplained_pending > 0
          and increase(cy_expire_processed_total[26h]) == 0
          and (cy_expire_processed_total offset 26h) >= 0
        for: 30m
        labels:
          severity: warning
          channel: server
        annotations:
          summary: "만료가 돌기는 하는데 아무것도 안 넘기고 있습니다 (남은 대기 {{ $value }}건)"
          description: >-
            한 주기(26시간)를 통째로 도는 동안 넘긴 건수가 0 인데 설명 안 되는 대기가 남아 있습니다.
            ExpireLeavesWorkBehind 와 축이 다릅니다 — 저쪽은 **남아 있다**,
            이쪽은 **줄지 않는다** 입니다. 잡이 실패 없이 도는데 진도가 안 나가는
            상태를 잡습니다(리더 질의가 계속 빈 결과를 내는 경우가 그렇습니다).
            cy_expire_chunk_fill 이 함께 낮으면 회차 경계에 계속 걸리는 것이고,
            그것이 0 이면 후보 자체를 못 읽고 있는 것입니다.
            **잡이 아예 안 뜬 것은 이 알림이 아닙니다** — ExpireNotSucceeding 이 집니다.

      # ── docs/13 §2d — 실패 자리를 에러코드로 가른다 ───────────────────────
      # spring_batch_job_seconds_count 에는 에러코드 라벨이 없고 붙일 수도 없다.
      # 그래서 만료의 실패 자리 다섯이 한 시계열로 뭉쳤다. 각각 봐야 할 곳이 다르다 —
      # 셋은 코드, 하나는 넘긴 파라미터, 하나는 접속 URL 이다.
      - alert: ExpireFailedWithCode
        expr: increase(cy_expire_failures_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
          channel: server
        annotations:
          summary: "만료가 {{ $labels.error_code }} 로 실패했습니다"
          description: >-
            BatchJobFailed 와 겹칩니다 — 그쪽은 **실패했다**, 이쪽은 **어디서** 입니다.
            EXPIRATION-001(이력 수 불일치)·002(재고 행 없음)·003(재고 언더플로)은 코드,
            EXPIRATION-004(asOf 가 미래)는 넘긴 파라미터, EXPIRATION-005(오염 스키마)는
            접속 URL 을 봅니다.
            **UNCLASSIFIED 는 BusinessException 이 아닌 실패입니다.** 갈래가 셋입니다 —
            ① BinlogFormatGuard(binlog_format 이 STATEMENT) ② asOf 파라미터 누락
            ③ DB 예외(1213 deadlock · 1205 lock wait · 트랜잭션 타임아웃).
            배치 로그의 첫 스택트레이스가 셋 중 어느 것인지 답합니다.
      - alert: ExpireMetricsUnknown
        expr: >-
          (cy_expire_unexplained_pending != cy_expire_unexplained_pending)
          unless on(job, instance) (cy_expire_clean_schema == 0)
        # 열다섯 주기(되읽기 60초). 주기는 기동 때 10~120초로 강제되므로 최악에도 7.5주기다.
        for: 15m
        labels:
          severity: warning
          # 라우팅 축. severity 는 긴급도이고, 어디를 봐야 하는지는 이것이 진다.
          channel: server
        annotations:
          summary: "만료 대기를 세지 못하고 있습니다 — 밀림 감시가 꺼져 있습니다"
          description: >-
            만료 대기 건수를 되읽지 못하고 있습니다. **이 동안 ExpireLeavesWorkBehind 는
            울릴 수 없습니다.** 갈래가 넷이라 먼저 어느 쪽인지 가릅니다.
            먼저 `increase(cy_expire_refresh_failures_total[10m]) > 0` 을 봅니다 —
            증가했으면 되읽기 실패이고, 배치 로그의
            "만료 대기 지표를 되읽지 못했습니다" 가 원인을 답합니다(흔한 원인은 커넥션 풀 고갈).
            **ExpireNeverSucceeded 가 함께 떠 있으면 같은 사건입니다** — 만료가 아직 한 번도
            성공하지 않은 것이고, 볼륨을 새로 띄운 직후가 여기입니다.
            안 증가했으면 갈래가 둘입니다 — 7일 창 안에 COMPLETED 로 끝난 expireJob 이
            없거나, 그 실행의 제외 목록을 Step 문맥에서 못 읽은 것입니다.
            BATCH_JOB_EXECUTION 조회와 배치 로그의
            "제외 목록을 Step 문맥에서 못 읽었습니다" WARN 으로 가릅니다.
            오염셋을 보고 있는 경우는 이 알림에서 구조적으로 빠집니다(cy_expire_clean_schema).
            **볼륨을 지우고 띄운 직후는 정상입니다** — 그 구간은 시연 절차 첫 단계의
            silence 가 덮습니다.

      # **게이지가 0 인데 그 0 이 어제 것일 수 있다.** 계약이 "마지막으로 성공한 실행이 남긴
      # 몫" 이라, 오늘 만료가 실패하거나 슬롯을 건너뛰면 넷은 어제 기준으로 정상인 0 을 낸다 —
      # ExpireLeavesWorkBehind 는 조용하고, 값이 있으니 ExpireMetricsUnknown 도 조용하고,
      # 되읽기가 멀쩡하니 ExpireMetricsStale 도 조용하다. 그 창을 이 규칙이 진다.
      #
      # ⚠️ ExpireNotSucceeding 과 **다른 시간 축**이다 — 그쪽은 MAX(END_TIME)(잡이 돌았나),
      #    이쪽은 asOf(그 값이 어느 시점의 사실인가). 만료 손 트리거가 생기면 두 축이 갈린다.
      #
      # ⚠️ **batch.metrics.expire-sla-seconds 와 같은 값이어야 한다** — ExpireNotSucceeding
      #    과 같은 이유이고, 기동 가드의 거절 메시지가 이 규칙도 함께 이름으로 부른다.
      #    그보다 짧으면 정상적인 슬롯 건너뛰기에서 뜨고, 길면 하루치 백데이팅을 못 본다.
      #    **이 축에는 여유가 더 붙는다** — SLA 가 재는 END_TIME 과 달리 이쪽은 asOf 라
      #    잡 소요와 expire-pending-refresh-ms(최대 120초)만큼 늘 뒤에 있다.
      - alert: ExpireMetricsBackdated
        expr: >-
          (time() - cy_expire_measured_at_seconds) > 90000
          or (cy_expire_measured_at_seconds - time()) > 60
        for: 5m
        labels:
          severity: warning
          channel: server
        annotations:
          summary: "만료 대기 게이지가 너무 오래된 asOf 기준입니다"
          description: >-
            게이지 넷이 마지막으로 성공한 만료 실행의 asOf 로 계산됩니다.
            그 시각이 SLA(25시간)보다 낡았다는 것은 **그 뒤로 만료가 성공하지 못했다**는
            뜻이고, 그동안 쌓인 백로그는 ExpireLeavesWorkBehind 에 안 나옵니다.
            BatchJobFailed 와 ExpireNotSucceeding 을 함께 봅니다 — 뒤엣것은 잡의 종료 시각
            축이라 과거 asOf 실행이 성공하면 조용해질 수 있습니다.
            미래 시각이면 원인은 시간대 설정입니다.

      # 되읽기가 성공/실패를 번갈아 하면 게이지가 정상 ↔ NaN 을 오간다. 그 구간에서
      # ExpireLeavesWorkBehind 는 NaN 샘플에, ExpireMetricsUnknown 은 정상 샘플에 각각
      # for 타이머가 깨져 **둘 다 영영 안 찬다** — 카운터는 리셋을 안 타므로 그 구간을 문다.
      # BatchRunMetricsStale 이 같은 실패 모드를 promtool 로 재현해 세운 규칙이고,
      # **이 실패 모드는 CY-421 이 만들었다** — 예전 게이지는 하루 한 번만 바뀌어
      # 플래핑이 구조적으로 불가능했다.
      #
      # 절대 델타를 쓰는 이유는 형제와 같다 — 재기동하면 카운터가 0 으로 다시 태어나
      # increase() 가 그 구간을 못 본다.
      - alert: ExpireMetricsStale
        expr: >-
          (
            cy_expire_refresh_failures_total
            - cy_expire_refresh_failures_total offset 10m
          ) >= 3
        for: 5m
        labels:
          severity: warning
          channel: server
        annotations:
          summary: "만료 대기 지표 되읽기가 반복 실패하고 있습니다"
          description: >-
            게이지가 정상과 NaN 을 오가는 동안은 ExpireLeavesWorkBehind 도
            ExpireMetricsUnknown 도 for 를 못 채웁니다.
            배치 로그의 "만료 대기 지표를 되읽지 못했습니다" 가 원인을 답합니다.
            흔한 원인은 커넥션 풀 고갈과 배치 메타 잠금입니다.

      # ⚠️ **노출 창이 하루가 됐다.** 만료가 5분 크론이던 시절에는 재고를 고치면 다음 슬롯
      #    (5분)이 그 회차를 넘겨 자연 해소됐다. 배치 창(일 1회)으로 옮긴 뒤로는 고쳐도
      #    **다음 04:10 까지 안 만료된다** — 그동안 그 회차의 active_count 는 실제보다 크다.
      #    **앞당길 수단은 없다.** 만료를 손으로 띄우는 경로가 이 저장소에 없다(컨트롤러는
      #    검증용 하나뿐이고 spring.batch.job.enabled 도 false 다). 그 경로가 생기는 티켓은
      #    ExpirePendingRefresher 의 END_TIME 정렬도 함께 봐야 한다.
      #
      # **고친 뒤에도 이 알림이 계속 뜨는 것이 맞다.** 게이지는 마지막으로 성공한 실행이
      # 건너뛴 회차 수이고(CY-421), 그것은 그 실행에 대한 사실이라 재고를 고쳐도 안 바뀐다.
      # 다음 실행이 성공하면 그때 0 이 된다. 그 값을 지금 재고로 다시 계산하면
      # **데이터를 고친 것이 서버 critical(ExpireLeavesWorkBehind)로 나간다.**
      - alert: ExpireSkippingBrokenCoupons
        expr: cy_expire_blocked_coupons > 0
        # 열 주기(되읽기 60초). 최악(120초)에도 다섯 주기다.
        for: 10m
        labels:
          severity: warning
          # 라우팅 축. severity 는 긴급도이고, 어디를 봐야 하는지는 이것이 진다.
          channel: data
        annotations:
          summary: "재고가 어긋난 회차 {{ $value }}개를 건너뛰고 있습니다"
          description: >-
            **배치는 정상으로 돌고 있습니다.** 재고 행이 없거나 남은 대기를 다 빼면 음수가 되는
            회차라, 그 회차만 빼고 나머지는 계속 만료시킵니다.
            데이터를 봐야 하는 상황이고 서버 문제가 아닙니다.
            어느 회차인지는 만료 잡의 WARN 로그에 회차 id 로 남습니다(회차 id 오름차순).
            재고를 고쳐도 이 알림은 다음 만료(04:10)가 성공할 때까지 그대로입니다 —
            게이지가 "마지막으로 성공한 실행이 건너뛴 회차" 라서입니다.
            **방치하면 그 회차의 대기 행을 매 주기 다시 훑습니다.** 만료가 끝나도 그 행들은
            ISSUED 로 남아 다음 실행의 스캔 대상이 되므로, 오래 두면 잡 시간이 늘어납니다.

      # ──────────────────────────────────────────────────────────────────────
      # 검증 판정. verdict = FAIL 은 **정상 종료**라 위 알림이 하나도 안 울린다 —
      # 판정이 verification_runs 에 남을 뿐이라 누가 조회하기 전까지 아무도 모른다.
      # 게이트 판정의 본체인데 통로가 없었다.
      #
      # ⚠️ 조건을 "잡 FAILED" 로 잡으면 안 된다. Step 체인이
      #    finalizeRunStep → statsAggregateStep 이라, 통계 Step 이 죽으면 **잡은 FAILED 인데
      #    판정은 이미 커밋돼 있다.** 반대로 verdict = FAIL 인 실행은 잡이 COMPLETED 다.
      #    두 축이 서로 독립이므로 여기서는 **판정 자체**를 본다.
      # ──────────────────────────────────────────────────────────────────────

      - alert: VerificationVerdictFailed
        # == 1 로 쓴다. > 0 으로 두면 판정이 셋이 되는 날 새 값도 FAIL 로 울린다 —
        # 그 인코딩이 값 둘에 기대고 있다는 것은 VerdictCodeTest 가 지킨다.
        expr: cy_verification_verdict == 1
        # 판정은 온디맨드라 주기가 없다. 되읽기가 1분이므로 두 번은 봐야 한다.
        for: 5m
        labels:
          severity: warning
          # 라우팅 축. severity 는 긴급도이고, 어디를 봐야 하는지는 이것이 진다.
          channel: data
        annotations:
          # 라벨을 안 좁히면 first 가 어느 시계열을 집을지 보장되지 않는다 —
          # 다른 데이터셋의 숫자나 NaN 이 찍히고, 사람이 그 숫자로 첫 판단을 한다.
          summary: >-
            검증이 불일치를 찾았습니다 ({{ $labels.dataset }} 검출
            {{ with query (printf "cy_verification_findings{dataset='%s',scope='%s'}" $labels.dataset $labels.scope) }}{{ . | first | value | printf "%.0f" }}{{ end }}건)
          description: >-
            **판정은 났고 데이터가 어긋났습니다.** 배치가 실패한 것이 아닙니다 —
            불일치를 판정으로 남기고 정상 종료하는 것이 설계입니다.
            verification_findings 의 (finding_type, target_key) 를 봅니다.
            CORRUPT 는 정답 800행과의 집합 비교라 FAIL 이 곧 사고는 아닙니다.

      # NaN 을 감시한다. 이것이 없으면 "판정 감시가 꺼진 것" 을 아무도 모른다.
      #
      # verifyJob 은 크론이 없어 "안 돌았다" 축의 **알림**이 없다. CY-392 가
      # cy_batch_last_success_seconds{spring_batch_job_name="verifyJob"} 게이지는 냈지만,
      # 크론이 없는 동안은
      # "안 도는 것이 정상" 이라 SLA 를 걸 수 없다 — 걸면 영구 발화다.
      # 그래서 지표가 NaN 이면 **어떤 알림도 뜨지 않는다** — CY-347 이 ExpireMetricsUnknown
      # 으로 값을 치른 그 자리다.
      #
      # NaN 은 시리즈로 존재하므로 absent() 로는 못 잡는다. NaN != NaN 이 참인 것을 쓴다.
      - alert: VerificationMetricsUnknown
        expr: cy_verification_verdict != cy_verification_verdict
        # 기동 직후에는 아직 되읽기 전이라 NaN 이 정상이다. 그 구간을 넘긴다.
        # 그리고 "그 데이터셋을 아직 한 번도 안 돌렸다" 도 여기 걸린다 — 그것이 맞다.
        # 검증을 한 번도 안 돌린 채 게이트를 통과했다고 믿는 것이 이 알림이 막는 것이다.
        for: 30m
        labels:
          severity: warning
          # 판정을 못 내는 것은 데이터가 아니라 배선·설정 문제다.
          channel: server
        annotations:
          summary: "검증 판정을 지표로 못 내고 있습니다 ({{ $labels.dataset }})"
          description: >-
            **판정 감시가 꺼져 있습니다.** 그 데이터셋으로 닫힌 검증 실행이 아직 없거나,
            되읽기가 실패하고 있습니다. 후자면 배치 로그에 WARN 이 남습니다.
            이 동안 VerificationVerdictFailed 는 울릴 수 없습니다.

      # 되읽기가 실패해도 게이지를 안 지운다 — 지우면 정상 재기동 한 번에 판정이 사라져
      # 관제와 DB 가 갈린다. 그 결정의 대가가 이것이다: **낡은 값이 현재 값처럼 보인다.**
      #
      # 그 상태는 다른 어떤 알림에도 안 걸린다. verdict 가 어제의 0(PASS) 으로 유지되므로
      # VerificationVerdictFailed(== 1) 도, VerificationMetricsUnknown(NaN) 도 조용하다.
      # 잡이 안 돈 것도 아니라 BatchJobFailed 도 아니다. 이 카운터가 그 축을 진다.
      #
      # 재기동에 카운터가 새로 태어나기 때문에 increase() 가 아니라 **절대 델타**를 쓴다.
      # 재기동하면 카운터가 0 에서 새로 태어나는데, increase() 는 리셋을 감지해 리셋 직전
      # 값을 더하므로 누적 실패를 들고 있던 프로세스를 재배포하면 창이 리셋을 품는 동안
      # 조건이 참이 된다 — **배포할 때마다 뜬다.** 델타는 offset 쪽 계열이 없으면 결과가
      # 비어 그 갈래가 아예 평가되지 않고, 재기동 뒤에는 음수라 조건이 거짓이다.
      #
      # 임계 3 은 되읽기 주기에서 나온 수다. batch.verify.metrics-refresh-ms 가 기본 60초라
      # 10분 창에 열 번 시도하므로, 3 은 "세 번 연속 실패" 를 넘긴 것이다. 한 번 튄 것
      # (순간 잠금, 커넥션 재수립)으로는 안 울린다.
      # ⚠️ 그 프로퍼티를 올리면 여기도 함께 봐야 한다. 주기가 창(10분)보다 길어지면
      #    증분이 창 안에 3 을 못 채워 지속 실패인데도 영영 안 뜬다.
      #
      # for 를 창보다 짧게 둔다. 둘이 같으면 조건이 참인 구간과 for 요구가 같아져
      # 발화 여부가 평가 타이밍 정렬에 달린다 — 뜰지 안 뜰지가 우연이 된다.
      - alert: VerificationMetricsStale
        expr: >-
          (
            cy_verification_refresh_failures_total
            - cy_verification_refresh_failures_total offset 10m
          ) >= 3
        for: 5m
        labels:
          severity: warning
          # 값이 틀린 것이 아니라 값이 안 갱신되는 것이다 — 배선·설정 축이다.
          channel: server
        annotations:
          summary: "검증 판정을 되읽지 못하고 있습니다 — 지표가 낡고 있습니다"
          description: >-
            게이지는 마지막으로 성공한 되읽기 값을 그대로 들고 있습니다.
            **지금 DB 의 verdict 와 다를 수 있습니다.** 배치 로그의 WARN 이 원인을 답합니다.
            흔한 원인은 시드 데이터셋이 cy-seed 1f217b5 이전 것이라 verification_runs 에
            origin 컬럼이 없는 경우입니다 — 그때는 데이터셋을 다시 만들어야 합니다.

      # 알림이 리시버까지 못 가는 것. 규칙도 라우팅도 멀쩡한데 마지막 한 홉이 끊긴 상태다.
      #
      # 이것만 다른 축이다 — 나머지 여덟은 batch 를 보고, 이것은 **관제 자신**을 본다.
      # 그래서 이 알림이 뜨려면 관제가 최소한 살아 있어야 한다. 그 한계는 여기서 못 없앤다
      # (Prometheus 가 통째로 죽은 것은 밖에서 봐야 안다 — 지금 스택에 그 축은 없다).
      #
      # 절대 델타를 쓰는 이유는 VerificationMetricsStale 과 같다.
      # 재기동하면 카운터가 새로 태어나는데 increase() 는 리셋 직전 값을 더해 배포마다 뜬다.
      - alert: AlertDeliveryFailing
        expr: >-
          (
            sum(alertmanager_notifications_failed_total)
            - sum(alertmanager_notifications_failed_total offset 10m)
          ) > 0
        for: 5m
        labels:
          severity: critical
          # 데이터가 틀린 게 아니라 배선이 끊긴 것이다.
          channel: server
        annotations:
          summary: "알림이 리시버까지 못 가고 있습니다"
          description: >-
            Alertmanager 가 webhook 전송에 실패하고 있습니다. **지금 뜬 다른 알림도
            리시버에 안 닿았을 수 있습니다.** alert-sink 컨테이너가 살아 있는지
            (`docker compose -f base.yml ps alert-sink`) 먼저 봅니다.

      # 인덱스 축 거절을 끄고 띄운 상태. 기동 로그의 ERROR 한 줄이 유일한 흔적이라
      # **이 스택에서는 안 보인다** — Loki·promtail 이 없고 알림은 전부 지표 위에 선다.
      #
      # 거절이 켜져 있으면(기본) 이 알림은 구조적으로 못 뜬다. 그 경우 프로세스가 아예
      # 안 뜨므로 BatchTargetDown 이 그 축을 진다. 즉 둘이 겹치지 않는다.
      - alert: BatchSchemaIndexMissing
        expr: >-
          cy_batch_schema_index_missing > 0
          and on(job, instance) (cy_batch_schema_index_enforcement == 0)
        for: 5m
        labels:
          severity: warning
          channel: server
        annotations:
          summary: "배치 메타 인덱스가 없는 채로 떠 있습니다 — 거절을 꺼 뒀습니다"
          description: >-
            SCHEMA_GUARD_REQUIRE_BATCH_INDEXES=false 로 기동 거절을 끈 상태이고,
            실제로 인덱스가 {{ $value }}개 없습니다. **되읽기 게이지가 NaN 이 되거나
            정리 잡이 매 청크 전체 스캔을 합니다** — 그때 원인을 여기서 찾으십시오.
            기동 로그의 "배치 메타 인덱스가 없습니다" ERROR 가 어느 인덱스인지 답합니다.
            절차는 docs/14 의 배치 메타 주입 절입니다. 부은 뒤에는 거절을 다시 켜십시오.

      # JDBC 타임아웃 검사를 통과 못 한 채 떠 있는 상태. 끄고 띄웠거나 URL 을 못 읽었다.
      # 기동 로그의 ERROR/WARN 한 줄이 유일한 흔적이라 이 스택에서는 안 보인다.
      - alert: BatchJdbcTimeoutUnverified
        expr: cy_batch_jdbc_timeout_verified == 0
        for: 5m
        labels:
          severity: warning
          channel: server
        annotations:
          summary: "JDBC 타임아웃 검사를 못 지난 채 떠 있습니다"
          description: >-
            DATASOURCE_TIMEOUT_GUARD_REQUIRED=false 로 거절을 껐거나, DataSource 에서
            JDBC URL 을 못 읽어 검사를 건너뛴 상태입니다. **응답 없는 소켓을 끊을 수단이
            없을 수 있습니다** — 그러면 SchemaPresenceGuard 같은 기동 러너나 admin 조회가
            무기한 멈추고, 컨테이너는 떠 있는데 @Scheduled 가 하나도 안 돕니다.
            기동 로그의 "JDBC 타임아웃" ERROR/WARN 이 어느 갈래인지 답합니다.
            고친 뒤에는 거절을 다시 켜십시오.

      # JVM 기본 존이 UTC 를 벗어난 채 떠 있는 상태. 거절을 껐거나 베이스 이미지가 바뀌었다.
      # 가드 자신은 기동 때 ERROR 를 한 줄 남긴다. 그런데 이 스택엔 Loki·promtail 이 없어
      # 그것을 모으는 것이 없고, 재기동하면 스크롤 밖으로 밀린다. 그리고 **피해 쪽은 진짜로
      # 조용하다** — verification_runs 한 행 안에서 started_at 과 as_of 가 다른 좌표계에
      # 서는데, 예외도 로그도 안 나고 판정 결과도 안 바뀐다. 그래서 지표로 든다.
      # (선점문의 :stuckBefore 도 같은 축 문제였는데 CY-718 이 StuckRunClaim.claim 에
      #  바인딩을 모아 닫았다 — 여기 그 피해를 적어 두면 운영자가 이미 없는 버그를 쫓는다.)
      - alert: BatchDefaultZoneNotUtc
        expr: >-
          cy_batch_default_zone_verified == 0
          and on(job, instance) (cy_batch_timezone_enforcement == 0)
        for: 5m
        labels:
          severity: warning
          channel: server
        annotations:
          summary: "JVM 기본 존이 UTC 가 아닌 채로 떠 있습니다"
          description: >-
            TIMEZONE_GUARD_REQUIRED=false 로 거절을 끈 상태이고, 실제로 JVM 기본 존이
            고정 오프셋 0 이 아닙니다. **verification_runs 한 행 안에서 started_at(JVM 기본
            존)과 as_of(UTC)가 이 존의 오프셋만큼 벌어집니다** — 예외도 로그도 안 나고
            판정 결과도 안 바뀌어서, 나중에 그 시각으로 사건을 맞춰 볼 때 드러납니다.
            선점문의 :stuckBefore 는 CY-718 이 StuckRunClaim.claim 으로 닫았으니
            그쪽은 보지 마십시오.
            컨테이너는 batch.yml 의 TZ, 로컬은 -Duser.timezone=UTC 로 맞춘 뒤
            거절을 다시 켜십시오.

      # **위 알림이 조인으로 서 있다.** BatchDefaultZoneNotUtc 는 두 게이지를 and 로 묶는데,
      # 하나라도 없어지면 조인이 **빈 벡터**가 되어 위반이 있어도 조용하다 — 게이지가 0 일
      # 때와 없을 때가 관측상 같아진다. 둘은 DefaultZoneGuard 의 같은 publish() 에서 나오므로
      # 빈이 스캔 밖으로 나가면 함께 사라진다(테스트는 DefaultZoneGuardTest$Wiring 이 잡지만,
      # 그것은 빌드 시점이고 이쪽은 배포 시점이다).
      # ⚠️ **absent() 가 아니라 unless 다** — 형제 CouponRoundSwitchMetricMissing 과 같은 근거다.
      # absent() 는 전역 부재만 참이라 배치를 두 대로 늘렸을 때 한 대에만 게이지가 없으면
      # 조용한데, 조인이 on(instance, job) 이라 **그 인스턴스의 알림만** 침묵한다.
      # 안쪽 and 는 "둘 다 있을 때만 시리즈" 라서, 어느 한쪽이 없어도 이 알림이 뜬다.
      - alert: BatchTimezoneGaugeMissing
        expr: >-
          (min_over_time(up{job="cy-batch"}[5m]) == 1)
          unless on(instance, job)
          (cy_batch_default_zone_verified and on(instance, job) cy_batch_timezone_enforcement)
        for: 10m
        labels:
          severity: warning
          channel: server
        annotations:
          summary: "JVM 기본 존 게이지가 없습니다 — BatchDefaultZoneNotUtc 가 조용히 꺼져 있습니다"
          description: >-
            배치는 떠 있는데 cy_batch_default_zone_verified 또는
            cy_batch_timezone_enforcement 시리즈가 없습니다. BatchDefaultZoneNotUtc 가
            둘을 and 로 묶으므로 **JVM 기본 존이 UTC 가 아니어도 알림이 한 건도 안 갑니다**.
            거절을 끈 채 존이 어긋나면 DefaultZoneGuard 가 기동 때 ERROR 를 한 줄 남기지만
            이 스택엔 Loki·promtail 이 없어 그것을 모으는 것이 없고, 게이지가 없다는 것은
            그 빈이 아예 안 떴다는 뜻일 수 있어 그 한 줄마저 없습니다.
            /actuator/prometheus 본문에서 두 이름을 직접 봅니다. 미터 이름이 바뀌었거나
            DefaultZoneGuard 가 컴포넌트 스캔 밖으로 나간 것입니다.

      # 관리자 API 토큰 관문이 꺼진 채 떠 있는 상태(CY-742). 증상이 아예 없다 — 요청이
      # 그냥 통과하므로 예외도 로그도 안 난다. 꺼도 되는 구성이 있어서(포트를 안 내보내는
      # 로컬·시연) 기동을 막지는 않지만, 그 선택이 **잊힌 채 남는 것**을 막는다.
      # 포트를 내보내는 오버레이(batch-expose.yml)를 얹은 상태에서 이게 꺼져 있으면
      # 포트에 닿는 누구나 도는 잡을 중단·복구할 수 있다.
      # ⚠️ **for 가 형제 셋(5m)보다 길다.** 저쪽은 "실수로 꺼진 것" 을 잡지만 이 손잡이는
      # 로컬·시연에서 **일부러** 끄고 한동안 두는 쓰임이 있어서, 5분이면 그 정상 사용마다
      # 울려 곧 무시된다. 15분은 그런 세션을 넘기되 잊고 배포한 것은 잡는 길이다.
      - alert: BatchAdminAuthDisabled
        expr: cy_batch_admin_auth_enforcement == 0
        for: 15m
        labels:
          severity: warning
          channel: server
        annotations:
          summary: "관리자 API 토큰 관문이 꺼져 있습니다"
          description: >-
            BATCH_ADMIN_AUTH_REQUIRED=false 로 관문을 끈 상태입니다.
            /api/v1/admin/** 에는 stop·recover·abandon 이 있어 **포트에 닿는 누구나 도는
            잡을 죽일 수 있습니다**. 이 상태가 안전한 것은 포트를 밖으로 안 내보낼
            때뿐입니다(docs/11 §11) — batch-expose.yml 을 얹었다면 지금 끄십시오.
            다시 켜려면 BATCH_ADMIN_TOKEN 을 주고 BATCH_ADMIN_AUTH_REQUIRED=true 로 둡니다.
