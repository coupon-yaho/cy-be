# attempt 관측 계층과 토픽 프로비저닝 알림. 관제가 `rules/*.yml` 로 그대로 가져다 쓴다.
#
# 여기 메트릭은 infra:mq 가 등록하고 api·batch 의 관리 포트로 나간다. 이름의 정본은
# core 의 DomainMeterNames 이고, AttemptAlertRuleContractTest 가 이 파일과 대조한다.
#
# ⚠️ 알림마다 channel 라벨이 붙는다 — alertmanager 가 그것으로 수신함을 가른다.
#
# ⚠️ **여기 셋만 고른 기준은 "코드가 스스로 0 이 아니면 사고라고 적어 둔 것"** 이다.
#    DomainMeterNames 의 app.* 37개 중 알림이 붙은 것은 10개였는데, 나머지를 다 붙이면
#    "할 일이 없는 페이지" 가 된다 — 상태 미터는 값 미터의 **이유**이고,
#    app_queue_length·app_coupon_stock_remaining 은 0 이 정상(매진·한가)이며,
#    app_attempt_archive_outcome 의 duplicate 는 javadoc 이 **정상값**이라고 적어 뒀다.
#    **안 잰 임계로 알림을 만들지 않는다.**

groups:
  - name: cy-attempt
    rules:

      # 계약을 위반해 격리하고 **offset 을 넘긴** 레코드. javadoc 이 뜻을 못박아 뒀다 —
      #   "넘기는 대신 여기서 세므로, 이 값이 0 이 아니면 무언가를 버렸다는 뜻이다."
      #
      # 기준선이 0 이라 임계를 고를 필요가 없다. reason 으로 갈려 오므로 무엇을 버렸는지가
      # 알림에 그대로 실린다 — unknown_enum · unsupported_schema · other 셋으로 닫혀 있다.
      #
      # ⚠️ **넘기지 않으면 poison message 로 그 파티션이 멈춘다.** 그래서 넘기는 것이 맞고,
      #    버린 것을 세는 이 카운터가 유일한 흔적이다. 그것을 아무도 안 보면 흔적도 없다.
      - alert: AttemptContractViolations
        expr: increase(app_attempt_contract_violations_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
          channel: server
        annotations:
          summary: "attempt 레코드를 버렸습니다 ({{ $labels.reason }}, 10분 {{ $value }}건)"
          description: >-
            계약을 위반한 레코드를 격리하고 offset 을 넘겼습니다 — 그만큼의 관측 이벤트가
            사라졌습니다. 넘기지 않으면 poison message 로 그 파티션의 소비가 멈추므로
            넘기는 것이 맞고, **이 카운터가 유일한 흔적입니다.**
            reason 이 unknown_enum 이면 발행 쪽이 모르는 enum 값을 보냈다는 뜻이라
            배포 순서를 봅니다(소비자가 먼저 떠야 합니다).
            unsupported_schema 면 schemaVersion 이 이 소비자보다 앞선 것이고,
            other 면 그 둘 밖이라 격리된 레코드를 직접 봐야 합니다.

      # live 버퍼 쓰기에서 **삼킨** 실패. javadoc 이 이 미터의 존재 이유를 적어 뒀다 —
      #   "0 이 아니면 화면이 비어 있는데 Kafka 소비는 정상이라는 뜻이다. (...)
      #    대신 여기서 소리를 낸다."
      #
      # **그 소리를 듣는 것이 이 규칙이다.** 실패가 offset 을 안 막으므로(막으면 archive 까지
      # 리밸런싱에 휘말린다) 다른 어떤 신호도 안 뜬다 — 화면만 조용히 빈다.
      - alert: AttemptLiveAppendFailing
        expr: increase(app_attempt_live_append_failures_total[10m]) > 0
        for: 0m
        labels:
          severity: warning
          channel: server
        annotations:
          summary: "실시간 attempt 화면이 조용히 비고 있습니다 (10분 {{ $value }}건)"
          description: >-
            live 버퍼 쓰기가 실패했고 **그 실패는 삼켜집니다** — offset 을 막지 않으므로
            Kafka 소비는 정상으로 보이고 컨슈머 지표도 멀쩡합니다. 화면만 빕니다.
            버퍼는 Redis 이므로 그쪽부터 봅니다.
            app_attempt_live_unreadable_total 이 함께 오르면 원인이 Redis 가 아니라 **형식**입니다
            — 배포 경계를 사이에 두고 두 형식이 버퍼에 함께 앉아 있다는 뜻입니다.

      # 토픽 선언이 브로커에 반영됐는지. **되돌릴 수 없는 사고를 막는 자리다** —
      #   "확인되지 않은 채로 발급이 시작되면 브로커가 토픽을 대신 만든다
      #    (auto.create.topics.enable 기본값 true, RF 1). 그러면 RF3·ISR2·파티션6 계약이
      #    무효가 되고 RF 는 되돌릴 수 없다."
      #
      # ⚠️ **값 미터가 아니라 상태 미터를 본다.** 값은 확인 전에 NaN 이라 `!= 1` 이 NaN 에서
      #    거짓이 되어 조용하다. 상태(UNAVAILABLE=6)가 "확인하지 못했다" 를 진다.
      #    N_A(7)는 프로비저닝을 끈 회차라 사고가 아니고, PENDING(2)는 기동 직후다 —
      #    그래서 for 로 기동 구간을 넘긴다.
      - alert: KafkaTopicsUnprovisioned
        expr: app_kafka_topics_provisioned_state == 6
        for: 5m
        labels:
          severity: critical
          channel: server
        annotations:
          summary: "토픽 선언이 브로커에 반영됐는지 확인하지 못했습니다"
          description: >-
            **이 상태로 발급이 시작되면 브로커가 토픽을 대신 만듭니다**
            (auto.create.topics.enable 기본값 true, RF 1). 그러면 RF3·ISR2·파티션6 계약이
            무효가 되고 **RF 는 되돌릴 수 없습니다** — 토픽을 다시 만들어야 합니다.
            원인은 app_kafka_topics_provisioned_cause 가 가릅니다:
            **unconfirmed** 면 브로커가 아직 안 뜬 것이라 재기동·대기로 낫고,
            **mismatched** 면 선언과 다른 토픽이 이미 있는 것이라 그 토픽을 다시 만들어야
            합니다. 상태 미터만으로는 이 둘이 같은 값으로 보입니다.
