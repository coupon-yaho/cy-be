name: CodeRabbit Slack 알림

# CodeRabbit 이 PR 에 리뷰를 남기면 Slack 으로 보낸다.
#
# ─────────────────────────────────────────────────────────
# 왜 `on: status` 가 아니라 `on: pull_request_review` 인가
# ─────────────────────────────────────────────────────────
# CodeRabbit 의 `review_progress` 는 기본값이 true 이고, 이때는 **check run** 으로
# 진행 상황을 알린다. legacy commit status 는 `review_progress` 가 꺼져 있을 때만 쓴다
# (공식 스키마: "commit_status … is only used when review_progress is disabled").
# 그래서 `on: status` 로 잡으려 하면 이벤트 자체가 안 온다.
#
# 우리는 `.coderabbit.yaml` 에서 `request_changes_workflow: true` 를 켜 뒀다.
# CodeRabbit 이 사람 리뷰어처럼 **GitHub Review 를 제출**하므로 그걸 잡는다.
# 리뷰가 실제로 달렸다는 가장 직접적인 신호다.
#
# ─────────────────────────────────────────────────────────
# 신뢰 경계
# ─────────────────────────────────────────────────────────
#  1. 포크 PR 차단 — `pull_request_review` 는 base 레포 컨텍스트라 시크릿이 주입된다.
#     포크에서 온 PR 은 제외한다.
#  2. PR 제목 등 사용자 통제 값을 셸에 `${{ }}` 로 보간하지 않는다 (CWE-78).
#     payload 는 github-script 가 **파일로** 쓰고 curl 은 `--data @파일` 로 읽는다.
#  3. permissions 는 읽기만.
#
# ⚠️ 사전 준비: Settings > Secrets > Actions > SLACK_WEBHOOK_URL
#    Slack 앱 > Incoming Webhooks 에서 채널별 URL 발급 (예: #code-review)
#    시크릿이 없으면 실패하지 않고 스킵된다.

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  group: coderabbit-slack-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  notify:
    name: Slack 전송
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event.review.user.login == 'coderabbitai[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Slack payload 생성
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            const review = context.payload.review;

            // 리뷰 상태별 색과 문구. changes_requested 가 실제로 봐야 하는 신호다.
            const byState = {
              changes_requested: { color: 'danger',  text: '수정 요청' },
              approved:          { color: 'good',    text: '승인' },
              commented:         { color: 'warning', text: '코멘트' },
            };
            const state = byState[review.state?.toLowerCase()]
              ?? { color: '#cccccc', text: review.state ?? 'unknown' };

            // 하위 → 에픽 인지 에픽 → main 인지가 한눈에 보이게 한다.
            const flow = `\`${pr.head.ref}\` → \`${pr.base.ref}\``;
            const isEpicMerge = pr.base.ref === context.payload.repository.default_branch;

            const payload = {
              attachments: [
                {
                  color: state.color,
                  fallback: `CodeRabbit ${state.text}: #${pr.number} ${pr.title}`,
                  title: `CodeRabbit 리뷰 — ${state.text}`,
                  title_link: review.html_url,
                  fields: [
                    { title: 'PR',     value: `<${pr.html_url}|#${pr.number} ${pr.title}>`, short: false },
                    { title: '작성자', value: pr.user?.login ?? 'unknown', short: true },
                    { title: '변경',   value: `+${pr.additions ?? 0} / -${pr.deletions ?? 0}`, short: true },
                    { title: '브랜치', value: `${flow}${isEpicMerge ? '  *(에픽 머지)*' : ''}`, short: false },
                  ],
                  mrkdwn_in: ['fields', 'text'],
                },
              ],
            };

            fs.writeFileSync('slack-payload.json', JSON.stringify(payload));
            core.info(`payload 생성 완료: #${pr.number} ${state.text}`);

      - name: Webhook 시크릿 확인
        id: secret
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "has_webhook=false" >> "$GITHUB_OUTPUT"
            {
              echo "## ⏭️ Slack 알림 스킵"
              echo ""
              echo "\`SLACK_WEBHOOK_URL\` 시크릿이 없습니다."
              echo ""
              echo "1. Slack 앱 > Incoming Webhooks 에서 채널 URL 발급"
              echo "2. \`gh secret set SLACK_WEBHOOK_URL\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_webhook=true" >> "$GITHUB_OUTPUT"
          fi

      # payload 를 파일로 넘긴다. PR 제목이 셸에 보간되지 않게 하려는 것 (헤더 2번).
      - name: Slack 전송
        if: steps.secret.outputs.has_webhook == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          CODE=$(curl -sS -o /tmp/slack-res.txt -w '%{http_code}' \
            -X POST -H 'Content-type: application/json' \
            --data @slack-payload.json "$SLACK_WEBHOOK_URL")

          if [ "$CODE" != "200" ]; then
            echo "::error title=Slack 전송 실패::HTTP $CODE — $(cat /tmp/slack-res.txt)"
            exit 1
          fi
          echo "Slack 전송 완료 (HTTP $CODE)"
