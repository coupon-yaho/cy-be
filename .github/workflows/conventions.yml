name: Conventions

# PR 제목 / 브랜치명 / 커밋 메시지 규약 검사. (이슈 트래커: Jira)
#
# 강제 대상은 PR 제목과 브랜치명 — 실패하면 머지가 막힌다.
# 개별 커밋은 Squash merge로 사라지므로 경고만 한다.
#   → Settings > General > Squash merging + "Default to pull request title" 전제
#
# 브랜치·PR 제목에 Jira 이슈 키가 들어가야 Jira 개발 패널에
# 브랜치/PR/커밋이 자동 연결된다. 그 연결이 "업무 분담" 채점 증빙이다.
#
# required check 등록: Settings > Rules > Ruleset > Require status checks
#   PR 제목 규약, 브랜치명 규약

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

env:
  TYPES: 'feat|fix|refactor|test|docs|chore|perf|ci'

  # Jira 프로젝트 키 — 쿠폰 야호(Coupon Yaho)
  # 비워두면 대문자 2자 이상인 아무 키나 허용합니다(형식만 검사).
  JIRA_KEY: 'CY'

jobs:
  # ─────────────────────────────────────────────────────────
  # PR 제목 — Squash merge 시 main의 커밋 메시지가 된다. 반드시 통과.
  #   [CY-12] feat(coupon): 재고 차감을 원자적으로 처리
  #   [CY-31] fix: Entry-Token GETDEL 경합 수정      ← scope 생략 가능
  # ─────────────────────────────────────────────────────────
  pr-title:
    name: PR 제목 규약
    runs-on: ubuntu-latest
    steps:
      - name: Validate
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          KEY="${JIRA_KEY:-[A-Z][A-Z0-9]+}"
          PATTERN="^\[${KEY}-[0-9]+\] (${TYPES})(\([a-z0-9._-]+\))?: .{3,}$"

          if printf '%s' "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "✅ $PR_TITLE"
            exit 0
          fi

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## ❌ PR 제목 규약 위반

          \`\`\`
          $PR_TITLE
          \`\`\`

          **형식**: \`[<JIRA-KEY>] <type>(<scope>): <한글 요약>\`

          | 부분 | 규칙 |
          |---|---|
          | JIRA-KEY | 대괄호 안에 Jira 이슈 키 (예: \`[${JIRA_KEY:-CY}-12]\`) |
          | type | \`feat\` \`fix\` \`refactor\` \`test\` \`docs\` \`chore\` \`perf\` \`ci\` |
          | scope | 소문자, 숫자, 마침표, 밑줄, 하이픈 — **생략 가능** |
          | 요약 | 3자 이상 |

          **예시**
          \`\`\`
          [${JIRA_KEY:-CY}-12] feat(coupon): 재고 차감을 원자적으로 처리
          [${JIRA_KEY:-CY}-31] fix(entry): Entry-Token GETDEL 동시 요청 경합 수정
          [${JIRA_KEY:-CY}-45] test: 재고 N에 2N 스레드 동시성 테스트 추가
          \`\`\`

          > Squash merge라 이 제목이 그대로 main의 커밋 메시지가 됩니다.
          > 키가 있어야 Jira 이슈에 PR이 자동 연결됩니다.
          EOF

          echo "::error title=PR 제목 규약 위반::형식은 [JIRA-KEY] <type>(<scope>): <요약> 입니다. Summary 참고."
          exit 1

  # ─────────────────────────────────────────────────────────
  # 브랜치명 — <type>/<JIRA-KEY>-<설명>
  #   feat/CY-12-coupon-state-machine
  #   fix/CY-31-entry-token-getdel
  #
  # Jira는 브랜치명에서 키를 찾아 이슈에 자동 연결한다.
  # ─────────────────────────────────────────────────────────
  branch-name:
    name: 브랜치명 규약
    runs-on: ubuntu-latest
    steps:
      - name: Validate
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          KEY="${JIRA_KEY:-[A-Z][A-Z0-9]+}"
          PATTERN="^(${TYPES})/${KEY}-[0-9]+-[a-z0-9][a-z0-9-]*$"

          if printf '%s' "$BRANCH" | grep -qE "$PATTERN"; then
            echo "✅ $BRANCH"
            exit 0
          fi

          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## ❌ 브랜치명 규약 위반

          \`\`\`
          $BRANCH
          \`\`\`

          **형식**: \`<type>/<JIRA-KEY>-<설명>\`

          | 부분 | 규칙 |
          |---|---|
          | type | \`feat\` \`fix\` \`refactor\` \`test\` \`docs\` \`chore\` \`perf\` \`ci\` |
          | JIRA-KEY | Jira 이슈 키 (예: \`${JIRA_KEY:-CY}-12\`) |
          | 설명 | 소문자, 숫자, 하이픈만 |

          **예시**
          \`\`\`
          feat/${JIRA_KEY:-CY}-12-coupon-state-machine
          feat/${JIRA_KEY:-CY}-18-redis-lua-counter
          fix/${JIRA_KEY:-CY}-31-entry-token-getdel
          test/${JIRA_KEY:-CY}-45-corrupt-dataset
          \`\`\`

          **고치는 법**
          \`\`\`bash
          git branch -m ${TYPE:-feat}/${JIRA_KEY:-CY}-00-올바른-이름
          git push origin -u \$(git branch --show-current)
          git push origin --delete $BRANCH
          \`\`\`

          > Jira는 브랜치명에서 키를 찾아 이슈 개발 패널에 자동 연결합니다.
          EOF

          echo "::error title=브랜치명 규약 위반::형식은 <type>/<JIRA-KEY>-<설명> 입니다. Summary 참고."
          exit 1

  # ─────────────────────────────────────────────────────────
  # 커밋 메시지 — 경고만. Squash로 사라지므로 머지를 막지 않는다.
  #   feat(coupon): 재고 차감 원자화 [CY-12]     ← Jira 키는 뒤에
  # required check로 등록하지 말 것.
  # ─────────────────────────────────────────────────────────
  commit-messages:
    name: 커밋 메시지 (경고)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          KEY="${JIRA_KEY:-[A-Z][A-Z0-9]+}"
          PATTERN="^(${TYPES})(\([a-z0-9._-]+\))?: .{3,} \[${KEY}-[0-9]+\]$"
          BAD=0

          {
            echo "## 커밋 메시지 검사"
            echo ""
            echo "형식: \`<type>(<scope>): <요약> [JIRA-KEY]\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r line; do
            [ -z "$line" ] && continue
            SHA="${line%% *}"
            MSG="${line#* }"
            case "$MSG" in "Merge "*) continue ;; esac

            if printf '%s' "$MSG" | grep -qE "$PATTERN"; then
              echo "- ✅ \`${SHA:0:7}\` $MSG" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ⚠️ \`${SHA:0:7}\` $MSG" >> "$GITHUB_STEP_SUMMARY"
              BAD=$((BAD+1))
            fi
          done < <(git log --format='%H %s' "$BASE_SHA..$HEAD_SHA")

          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$BAD" -gt 0 ]; then
            {
              echo "> ⚠️ $BAD 개가 형식에 맞지 않습니다."
              echo "> Squash merge라 머지는 막지 않지만, Jira 이슈에 커밋이 자동 연결되지 않습니다."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=커밋 메시지::$BAD 개가 형식에 맞지 않습니다 (경고)"
          else
            echo "> 전부 통과." >> "$GITHUB_STEP_SUMMARY"
          fi
