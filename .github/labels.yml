# GitHub 라벨 정의
#
# 이슈 트래킹은 Jira가 한다. 여기 라벨은 **GitHub PR 목록에서만 필요한 것**만 남긴다.
#   - 영역/우선순위/스프린트 → Jira 컴포넌트·라벨·스프린트로 관리
#   - PR 필터링과 워크플로 제어 → 아래 라벨
