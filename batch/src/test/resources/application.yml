# ⚠️ **테스트 JVM 은 일부러 Asia/Seoul 이다**(batch/build.gradle 의 test 태스크, CY-392).
#    TimestampMappingTest 가 그 존에서 드라이버가 LocalDateTime 을 안 미는 것을 단언하기
#    때문이다. DefaultZoneGuard 는 UTC 가 아니면 기동을 거절하므로, 안 끄면 **컨텍스트를
#    띄우는 배치 테스트가 통째로** 그 자리에서 죽는다.
#
#    가드 자체는 DefaultZoneGuardTest 가 생성자를 직접 불러 잰다 — 스위치로 끈 것이
#    "검사를 안 한다" 가 되지 않게 한다.
batch:
  timezone-guard:
    required: false

  # 관리자 API 토큰 관문(CY-742)을 테스트에서는 끈다. 관리자 API 테스트가 여럿인데 각자
  # 토큰을 실으면, 관문을 실수로 지워도 그 테스트들이 전부 초록으로 남는다.
  # 관문 자체는 AdminTokenFilterTest 가 켠 채로 잰다.
  admin:
    auth:
      required: false

# 테스트 설정을 저장소에 고정한다.
# 이게 없으면 테스트가 main/resources/application.yml 을 읽는데, 그 파일은 .gitignore 대상이라
# 있는 사람과 없는 사람의 결과가 갈린다. .example 을 복사한 순간 flyway.enabled:false 로
# 스키마가 안 생기고, spring.config.import 가 없는 storage.yml 을 찾아 컨텍스트가 아예 안 뜬다.
spring:
  task:
    scheduling:
      pool:
        # ⚠️ **이 줄이 없으면 테스트가 운영에 없는 형상으로 돈다.** Boot 기본이 1 이라
        #    @Scheduled 전부가 스레드 하나를 다투는데, 운영은 그 수만큼 갖고 있다.
        #    SchedulerPoolGuard 가 기동 때 "풀 >= @Scheduled 수" 를 검사하므로 그 상태로는
        #    배치 테스트 컨텍스트가 통째로 안 뜬다.
        #
        # **운영값(main 의 8)을 흉내 내지 않는다.** 그 수를 여기 또 적으면 @Scheduled 를
        # 더할 때 고쳐야 할 자리가 하나 더 는다 — 가드가 요구하는 것은 "그 수 이상" 뿐이라
        # 넉넉히 준다. 운영값 자체는 ResolvedBatchConfigTest 와
        # VerificationMetricExposureTest 가 실제 파일을 읽어서 지킨다.
        size: 16
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    # spring.batch.jdbc.* 는 Boot 4.1 에 없는 키다. 메타 테이블은 V2 마이그레이션이 만든다.
    job:
      enabled: false             # 컨텍스트가 뜨자마자 잡이 자동 실행되는 것을 막는다
  jpa:
    hibernate:
      # 운영(storage.yml)과 같은 값이어야 이 테스트가 엔티티와 스키마의 드리프트를 잡는다.
      # batch 는 JPA 를 안 쓰지만 BatchApplication 이 scanBasePackages = "com.kafkick" 이라
      # storage 의 엔티티가 전부 스캔된다 — 여기서 none 이면 드리프트가 batch 테스트를 통과하고
      # 운영 기동에서 Schema-validation 으로 죽는다.
      #
      # 지금은 구체 @Entity 가 0개라 공허하게 통과한다. 엔티티가 생기는 날부터 일한다.
      #
      # ⚠️ CY-254 가 batch 에서 JPA 자동설정을 제외한다(HibernateJpaAutoConfiguration ·
      #    DataJpaRepositoriesAutoConfiguration). 그러면 이 줄은 **영영 안 일한다** —
      #    "엔티티가 생기는 날부터" 가 성립하지 않는다.
      #    그쪽이 BatchJpaFreeAssumptionTest 로 대신한다고 했으니, 그 티켓이 머지되면
      #    이 줄을 지우거나 그 테스트가 실제로 드리프트를 잡는지 확인해야 한다.
      ddl-auto: validate
