plugins {
    id 'org.springframework.boot'
}

dependencies {
    // 어댑터는 런타임에만. 배치가 JpaRepository 를 직접 참조하는 걸 컴파일 단계에서 막는다.
    // 배치는 JPA 엔티티를 만들지 않고 DataSource + Spring Batch JDBC 리더/라이터로 간다.
    implementation project(':core')
    runtimeOnly project(':storage')
    testImplementation testFixtures(project(':storage'))

    implementation 'org.springframework.boot:spring-boot-starter-batch'
    // 300만 행 집계·리플레이는 전부 SQL 이다. starter-batch 가 끌어오지만 직접 쓰므로 명시한다.
    implementation 'org.springframework:spring-jdbc'
    // 업무 포트의 verify 온디맨드 트리거용 — POST /api/v1/admin/verify (CY-368).
    // **관리 포트가 아니다.** 프론트 계약(docs/05)이 그 경로로 고정돼 있어 옮기면 계약이
    // 깨진다. 대신 batch.yml 이 그 포트를 기본으로 안 내보낸다 — 근거는 docs/15 결정 1.
    // ⚠️ 인증이 없다. 노출 축소가 막는 것은 인터넷뿐이고 compose 네트워크 안은 그대로다.
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // 관제가 Prometheus 로 batch JVM 을 직접 긁는다. 정합성 gap · 대기열 길이 · Kafka lag 은
    // api 가 만들 수 없다 — 300만 행 집계라 발급 경로에 얹으면 성능 측정이 오염된다.
    // 이 두 줄은 값이 나갈 통로만 연다. Gauge 등록은 관제 쪽 티켓(OBS-5)이 붙인다.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // 코드가 import 하지 않는 순수 런타임 아티팩트다. implementation 으로 두면 컴파일
    // 클래스패스에 Micrometer 가 올라가, 나중에 batch 가 MeterRegistry 를 직접 잡아도
    // 컴파일이 통과한다 — storage 를 runtimeOnly 로 묶어 둔 것과 같은 방어선이다.
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // JobLauncherTestUtils / JobRepositoryTestUtils
    testImplementation 'org.springframework.batch:spring-batch-test'
}

bootJar {
    enabled = true
}

jar {
    enabled = false
}
