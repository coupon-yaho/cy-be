import org.gradle.api.tasks.PathSensitivity

plugins {
    id 'org.springframework.boot'
}

dependencies {
    // 어댑터는 런타임에만. 배치가 JpaRepository 를 직접 참조하는 걸 컴파일 단계에서 막는다.
    // 대용량 검증·리플레이는 DataSource + Spring Batch JDBC 리더/라이터로 간다 — 300만 행을
    // 영속성 컨텍스트에 올리지 않는다. 회차 생성·상태 전이·만료 같은 도메인 경로는 공용
    // storage JPA 어댑터를 탄다(CY-245 계보). 아래 runtimeOnly 는 그대로라 batch 본 코드는
    // 여전히 Entity·JpaRepository 타입을 컴파일 타임에 못 본다 — 도메인 포트로만 부른다.
    implementation project(':core')
    testImplementation testFixtures(project(':core'))
    runtimeOnly project(':storage')
    testImplementation testFixtures(project(':storage'))

    // 테스트만 storage 를 본다. batch 가 끄는 관측 스위치의 키를 storage 가 소유해서, 둘을 잇는
    // 테스트가 그 상수를 직접 참조해야 하기 때문이다(DomainGaugeConfigContractTest).
    // 문자열로 옮겨 적으면 storage 가 키 이름을 바꿔도 CI 는 통과하고 기동만 조용히 죽는다.
    //
    // ⚠️ 위 runtimeOnly 는 그대로다. 본 코드는 여전히 storage 타입을 컴파일 타임에 못 본다.
    //    testFixtures 가 이미 전이로 끌어와 이 줄이 없어도 컴파일되지만, 선언 없이 경계를 넘는
    //    것보다 드러내 두는 편이 낫다 — api 가 같은 이유로 같은 줄을 갖고 있다.
    testImplementation project(':storage')

    implementation 'org.springframework.boot:spring-boot-starter-batch'
    // 300만 행 집계·리플레이는 전부 SQL 이다. starter-batch 가 끌어오지만 직접 쓰므로 명시한다.
    implementation 'org.springframework:spring-jdbc'
    // 관제 API 가 내부 네트워크에서 호출하는 verify 트리거를 제공한다 — CY-368 의
    // POST /api/v1/admin/verify. **관리 포트가 아니다.** 프론트 계약(docs/05)이 그 경로로
    // 고정돼 있어 옮기면 계약이 깨진다. 대신 batch.yml 이 그 포트를 기본으로 안 내보낸다
    // (docs/15 결정 1). 노출 축소가 막는 것은 인터넷뿐이고 compose 네트워크 안은 그대로다.
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // actuator·micrometer 는 아래 관측 절에서 선언한다 — micrometer 를 여기서
    // implementation 으로 두면 컴파일 클래스패스에 올라가 그쪽 runtimeOnly 방어선이 뚫린다.

    // 도메인 Gauge(OBS-5)가 Redis 재고 카운터를 읽는다. V1 회차는 Redis 자체가 없어 조회하지
    // 않지만, V2·V3 에서 같은 코드가 그대로 돌아야 하므로 통로는 컴파일 타임에 열어 둔다.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Redis 명령 레이턴시 계측(OBS/CY-310). 자동설정으로만 붙는다 — 본 코드는 이 모듈의 타입을
    // 컴파일 타임에 참조하지 않는다.
    //
    // ⚠️ 이 모듈의 imports 에는 런타임 설정 CAS 어댑터도 들어 있어 함께 켜진다. batch 는 그걸
    //    쓰지 않으므로 application.yml 의 spring.autoconfigure.exclude 로 뺀다 — 그쪽에 이유가 있다.
    //
    // 이 줄이 없으면 AutoConfiguration.imports 가 클래스패스에 올라오지 않아,
    // 테스트도 기동도 전부 초록불인 채 lettuce_command_* 만 조용히 빈다.
    //
    // api 도 같은 모듈을 문다(api/build.gradle). 그래서 관측 창 설정은 두 모듈이 각자
    // 갖는다 — api 는 observation.yml, batch 는 management.yml. 한쪽만 두면 그 JVM 의
    // Redis p99 만 기본 2분 창이 되어 HTTP p99 와 같은 시점의 값이 아니게 된다.
    // 이 줄이 지워지면 루트 build.gradle 의 cy.runtimeProjects 가드가 잡는다.
    runtimeOnly project(':infra:redis')

    // ⚠️ 위 runtimeOnly 는 그대로다. 본 코드는 여전히 이 모듈의 타입을 컴파일 타임에 못 본다.
    //    테스트만 경계를 넘는다 — 미터 네임스페이스를 infra:redis 가 소유하고 백분위·expiry 키는
    //    이 모듈의 application.yml 이 소유해서, 둘을 잇는 테스트가 그 상수를 직접 참조해야 한다
    //    (RedisLatencyWiringContractTest). 문자열로 옮겨 적으면 한쪽만 바뀌어도 계속 통과한다.
    testImplementation project(':infra:redis')
    testImplementation testFixtures(project(':infra:redis'))

    // 정합성 리더의 Redis 자료형 분기는 실제 Redis 에서만 증명된다. 목은 Lua 를 실행하지
    // 않아서, hash 분기가 없어도 통과한다 — 그 결함은 부하 시험 끝에 gap 4축이 안 닫힐 때에야
    // 드러난다(docs/14-v2-phase0/11 ③).
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    // 관제가 Prometheus 로 batch JVM 을 직접 긁는다. 정합성 gap · 대기열 길이 · Kafka lag 은
    // api 가 만들 수 없다 — 300만 행 집계라 발급 경로에 얹으면 성능 측정이 오염된다.
    // 이 두 줄은 값이 나갈 통로만 연다. Gauge 등록은 관제 쪽 티켓(OBS-5)이 붙인다.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // 코드가 import 하지 않는 순수 런타임 아티팩트다. implementation 으로 두면 컴파일
    // 클래스패스에 Micrometer 가 올라가, 나중에 batch 가 MeterRegistry 를 직접 잡아도
    // 컴파일이 통과한다 — storage 를 runtimeOnly 로 묶어 둔 것과 같은 방어선이다.
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // JobLauncherTestUtils / JobRepositoryTestUtils
    testImplementation 'org.springframework.batch:spring-batch-test'

    // [OBS-51] 집계 배치를 실제 MySQL 에 태우는 테스트가 스키마를 직접 올린다.
    // storage 는 flyway 를 implementation 으로 물어 런타임에는 이미 있고, 여기서 필요한 것은
    // 컴파일 타임 가시성뿐이다 — 대역만 쓰는 테스트로는 CONVERT_TZ·행 별칭 Upsert·드라이버
    // 시각 변환이 한 줄도 실행되지 않는다.
    testImplementation 'org.flywaydb:flyway-core'
}

tasks.named('test') {
    // **JVM 존을 DB 와 일부러 어긋나게 둔다.**
    //
    // MySqlContainerConfig 가 컨테이너를 --default-time-zone=+00:00 로 띄우는데, CI 러너의
    // JVM 존도 UTC 라 둘이 같아진다. 그러면 드라이버의 존 변환이 항등이 되어
    // **시간대 버그를 재현할 수 없다** — BatchRunMetricsRefresher 가 UNIX_TIMESTAMP 를 쓰는
    // 대신 자바에서 변환하도록 되돌려도 CI 는 초록이다. 실제로 이 프로젝트에서 그 자리가
    // 아홉 시간 어긋난 적이 있고(CY-392), 그때 잡아 준 것이 개발 기기의 KST 뿐이었다.
    //
    // user.timezone 은 JVM 기동 시점에 잡혀야 Connector/J 가 캐시하는 기본 존과도 맞는다 —
    // 테스트 안에서 TimeZone.setDefault 로 바꾸면 이미 열린 커넥션이 옛 존을 들고 있다.
    systemProperty 'user.timezone', 'Asia/Seoul'

    // **모듈 밖 파일을 읽는 테스트가 있다. 입력으로 선언해야 한다.**
    //
    // AlertChannelRegistryTest 는 `../infra/prometheus/rules/batch-alerts.yml` 과
    // `../docs/14-observability-wiring.md` 를 Path.of("..") 로 직접 읽어 **규칙과 채널 표를
    // 잇는다.** BatchMetricExposureTest 는 같은 규칙 파일에서 메트릭 이름을 뽑아 실제 노출과
    // 대조한다. 둘 다 태스크 입력에 안 들어 있어서, **그 두 파일만 바뀐 라운드는
    // `:batch:test` 가 UP-TO-DATE 로 건너뛰었다** — 실측으로 확인했다(CY-661).
    //
    // 그러면 규칙 파일에 `channel` 없는 알림을 더해도 CI 가 초록이고, 그 알림은
    // sink-unrouted 로 떨어져 아무도 안 본다. **잇는 검사가 있는데 안 도는 상태**가
    // 제일 나쁘다 — 있다고 믿기 때문이다.
    //
    // `org.gradle.caching` 을 켜기 전부터 있던 구멍이다(up-to-date 검사와 캐시는 별개다).
    // 다만 캐시가 CI 러너 사이로도 그 판정을 옮기므로 이 티켓에서 함께 막는다.
    inputs.files(
            rootProject.file('infra/prometheus/rules/batch-alerts.yml'),
            rootProject.file('docs/14-observability-wiring.md'),
            // DataSourceTimeoutGuardTest 가 이 파일의 URL 을 직접 읽어 가드와 대조한다.
            // 안 걸면 이 파일만 바뀐 빌드에서 UP-TO-DATE 로 건너뛰어 불일치를 놓친다.
            rootProject.file('storage/src/main/resources/storage.yml.example'))
            .withPathSensitivity(PathSensitivity.RELATIVE)
            .withPropertyName('externalContractFiles')

    // NoOrphanJavadocTest 가 저장소의 자바 소스를 **텍스트로** 훑는다. 클래스패스가 아니라
    // 파일을 읽으므로 gradle 이 스스로 알 수 없다 — 선언 안 하면 다른 모듈의 **주석만**
    // 바꿨을 때 :batch:test 가 UP-TO-DATE 로 건너뛴다(실측). 그러면 새 고아 javadoc 이
    // 로컬에서 조용히 통과한다. NoWallClockInBatchTest 도 같은 방식으로 소스를 읽는다.
    inputs.files(rootProject.fileTree(rootProject.projectDir) {
        // **한 칸이 아니라 전부다.** settings.gradle 에 infra:mq · infra:redis 처럼 중첩된
        // 모듈이 있어 `*/src/**` 로는 그 아래가 안 잡힌다 — 테스트는 뿌리부터 재귀로 훑으므로
        // 스캔 범위와 캐시 키가 어긋난다. 지금은 그 둘에 자바 파일이 없어 잠복해 있다.
        include '**/src/**/*.java'
        exclude '**/build/**'
    }).withPathSensitivity(PathSensitivity.RELATIVE)
            .withPropertyName('scannedJavaSources')
}

tasks.matching { it.name == 'bootRun' }.configureEach {
    // **컨테이너와 같은 존으로 띄운다.** batch.yml 이 TZ=UTC 를 주는데 bootRun 은 그 파일을
    // 안 읽으므로, 개발 기기 존이 그대로 JVM 기본 존이 된다(KST 기기에서 Asia/Seoul — 실측).
    //
    // 판정 컬럼은 TimeProvider 로 옮겨 이 값과 무관해졌지만, 배치 메타의 시각은 여전히
    // 인자 없는 LocalDateTime.now() 다 — RunningJobProbe 의 시체 판정이 그 위에 선다.
    // 로컬에서만 다른 존으로 돌면 그 가드의 동작이 운영과 달라진다.
    systemProperty 'user.timezone', 'UTC'
}

bootJar {
    enabled = true
}

jar {
    enabled = false
}

tasks.named('test') {
    // RedisLatencyWiringContractTest 는 클래스패스 밖 설정 파일을 직접 읽는다. 선언하지 않으면
    // Gradle 이 그 변경을 모르고 test 를 UP-TO-DATE 로 건너뛴다.
    //
    // 실측 — 선언 전에는 이 파일들을 고쳐도 :batch:test 가 UP-TO-DATE 로 통과했다.
    // 가드가 있는데 안 도는 상태가 가드가 없는 것보다 나쁘다 — 초록불이 검사했다는
    // 증거로 읽힌다(api/build.gradle 도 같은 이유).
    inputs.files(
            // 관측 계정을 만드는 스크립트. ObservationAccountPrivilegeTest 가 그 계정으로
            // GRANT 계약을 단언하므로, 선언하지 않으면 스크립트를 고쳐도 이 모듈이
            // UP-TO-DATE 로 건너뛴다 — 정작 계약을 보는 테스트가 안 도는 상태가 된다.
            rootProject.file('infra/mysql/initdb/20-obs-account.sh'),
            // [OBS-36] 권한을 실제로 주는 쪽. 계정 생성 스크립트와 분리돼 있으므로 둘 다
            // 선언해야 한다 — 목록에서 한 줄을 빼도 :batch:test 가 UP-TO-DATE 로 건너뛰면
            // 양방향 계약 테스트가 안 돈다.
            rootProject.file('infra/mysql/obs-grants'),
            // 관측 창의 기준. api 가 소유한다.
            rootProject.file('api/src/main/resources/observation.yml.example'),
            // 컨테이너에 마운트되는 배포 설정. batch 프로파일 문서가 창을 덮는지 본다.
            rootProject.file('application.yml.example'),
            // 소스셋 리소스라 이미 추적되지만, 이 목록이 "이 테스트가 읽는 파일 전체" 라는
            // 불변식을 스스로 완결하게 둔다 — 나중에 소스셋 밖으로 옮겨도 함정이 재발하지 않는다.
            file('src/main/resources/management.yml.example'))
        .withPropertyName('redisLatencyWiringContractInputs')
        .withPathSensitivity(PathSensitivity.RELATIVE)

    // [OBS-36] ObservationAccountPrivilegeTest 의 ③④ 는 **모든 모듈의 자바 원본**에서
    // 관측 질의문을 걷는다. 선언하지 않으면 api 에 새 관측 질의를 넣어도 :batch:test 가
    // UP-TO-DATE 로 건너뛴다 — 목록에 없는 테이블을 읽는 코드가 초록불로 들어온다.
    // (storage/build.gradle 의 observationQueryScopeInputs 가 같은 이유로 같은 목록을 갖는다.
    //  모듈 목록은 그 테스트의 MODULES 상수와 한 쌍이고, settings.gradle 과 어긋나면
    //  moduleListMatchesSettingsGradle 이 잡는다.)
    //
    // ⑤ 는 여기에 더해 **배포 안내(.env.example)와 각 모듈의 테스트·픽스처 원본**까지 읽는다.
    // 스키마 단위 GRANT 가 되살아나는 자리가 실제로 그 둘이었다 — 배포 안내가 그것을 권했고,
    // storage 테스트가 자기 컨테이너에 그것을 주고 있었다.
    inputs.files(
            rootProject.file('settings.gradle'),
            rootProject.file('.env.example'),
            rootProject.file('api/src/main/java'),
            rootProject.file('batch/src/main/java'),
            rootProject.file('core/src/main/java'),
            rootProject.file('storage/src/main/java'),
            rootProject.file('infra/mq/src/main/java'),
            rootProject.file('infra/redis/src/main/java'),
            rootProject.file('api/src/test/java'),
            rootProject.file('batch/src/test/java'),
            rootProject.file('core/src/test/java'),
            rootProject.file('storage/src/test/java'),
            rootProject.file('storage/src/testFixtures/java'),
            rootProject.file('core/src/testFixtures/java'),
            rootProject.file('infra/mq/src/test/java'),
            rootProject.file('infra/redis/src/test/java'))
        .withPropertyName('observationAllowlistContractInputs')
        .withPathSensitivity(PathSensitivity.RELATIVE)
}
