plugins {
    id 'org.springframework.boot'
}

dependencies {
    // 어댑터는 런타임에만. 배치가 JpaRepository 를 직접 참조하는 걸 컴파일 단계에서 막는다.
    // 배치는 JPA 엔티티를 만들지 않고 DataSource + Spring Batch JDBC 리더/라이터로 간다.
    implementation project(':core')
    testImplementation testFixtures(project(':core'))
    runtimeOnly project(':storage')
    testImplementation testFixtures(project(':storage'))

    // 테스트만 storage 를 본다. batch 가 끄는 관측 스위치의 키를 storage 가 소유해서, 둘을 잇는
    // 테스트가 그 상수를 직접 참조해야 하기 때문이다(DomainGaugeConfigContractTest).
    // 문자열로 옮겨 적으면 storage 가 키 이름을 바꿔도 CI 는 통과하고 기동만 조용히 죽는다.
    //
    // ⚠️ 위 runtimeOnly 는 그대로다. 본 코드는 여전히 storage 타입을 컴파일 타임에 못 본다.
    //    testFixtures 가 이미 전이로 끌어와 이 줄이 없어도 컴파일되지만, 선언 없이 경계를 넘는
    //    것보다 드러내 두는 편이 낫다 — api 가 같은 이유로 같은 줄을 갖고 있다.
    testImplementation project(':storage')

    implementation 'org.springframework.boot:spring-boot-starter-batch'
    // 300만 행 집계·리플레이는 전부 SQL 이다. starter-batch 가 끌어오지만 직접 쓰므로 명시한다.
    implementation 'org.springframework:spring-jdbc'
    // 관제 API가 내부 네트워크에서 호출하는 verify 트리거를 제공한다.
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // 도메인 Gauge(OBS-5)가 Redis 재고 카운터를 읽는다. V1 회차는 Redis 자체가 없어 조회하지
    // 않지만, V2·V3 에서 같은 코드가 그대로 돌아야 하므로 통로는 컴파일 타임에 열어 둔다.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // JobLauncherTestUtils / JobRepositoryTestUtils
    testImplementation 'org.springframework.batch:spring-batch-test'
}

bootJar {
    enabled = true
}

jar {
    enabled = false
}
