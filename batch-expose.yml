# 배치의 업무 포트를 호스트에 내보냅니다. 필요할 때만 얹습니다.
#
#   docker compose -f base.yml -f batch.yml -f batch-expose.yml up batch
#
# batch.yml 이 기본으로 안 내보내는 이유는 그 파일에 적혀 있다 — 그 포트에 열린
# admin API 에 **인증이 없다.** — POST /api/v1/admin/verify(트리거)와
# /api/v1/admin/expire/runs/**(복구). 복구는 실행 이력을 FAILED 로 닫는 쓰기다.
#
# **이 파일이 그 상태를 뒤집는다.** 포트를 내보내는 대신 아래 29행이 CY-742 토큰 관문을
# 켠다 — 미노출이 사라지는 자리에서만 관문을 강제하는 것이 이 두 파일의 분담이다.
#
# ⚠️ 127.0.0.1 을 빼면 안 된다. compose 의 짧은 문법은 IP 를 안 적으면 0.0.0.0 에 묶는다 —
#    공인 IP 가 붙은 호스트에서 띄우는 순간 인터넷 어디서든 검증 배치를 돌릴 수 있다.
#    CI 가 그 규율을 jq 로 검사한다(.github/workflows/build.yml).
#
# 이 파일은 **노출 축소**이지 방어가 아니다 — 같은 호스트를 쓰는 사람은 그대로 닿는다.
# 근거는 docs/15.
#
# ⚠️ **그래서 이 파일이 토큰 관문을 켠다(CY-742).** 1차 방어선(포트 미노출)이 사라지는
#    자리가 정확히 여기다. BATCH_ADMIN_TOKEN 을 안 주면 **기동을 거절한다** —
#    "포트는 열었는데 관문은 꺼진" 조합이 제일 위험하고, 그것을 조용히 허용하지 않는다.
#
#      export BATCH_ADMIN_TOKEN=$(openssl rand -hex 24)
#      docker compose -f base.yml -f batch.yml -f batch-expose.yml up batch
#
#    일부러 관문 없이 열어야 하면 BATCH_ADMIN_AUTH_REQUIRED=false 로 **명시**한다.
#    그 상태는 BatchAdminAuthDisabled 가 15분 뒤 운다 — 잊고 두는 것을 막는다.

services:
  batch:
    environment:
      BATCH_ADMIN_AUTH_REQUIRED: ${BATCH_ADMIN_AUTH_REQUIRED:-true}
      BATCH_ADMIN_PORT_EXPOSED: "true"
    ports:
      # 우변은 언제나 9090 이다(업무 포트). 관리 포트 9092 는 여기서도 안 연다.
      - "127.0.0.1:${BATCH_HOST_PORT:-9090}:9090"
