# 배치 서버 오버레이입니다. base.yml 위에 겹쳐 올립니다.
#
#   docker compose -f base.yml -f batch.yml up batch
#
# 부하 중에는 이 파일을 안 올린다 — 정지 수단이 설정이 아니라 컨테이너라는 것이
# docs/11-batch-implementation.md 의 결정이다.

services:
  batch:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-app}
      DB_USERNAME: ${DB_USERNAME:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app}
      BATCH_MANAGEMENT_PORT: 9092
      # 기본은 끈다. verifyJob 은 rejectRunningSchedulers 가 스케줄러 켜진 상태의 실행을
      # 거부하므로, 두 잡의 알림을 한 기동으로는 못 본다 — docs/14 의 시연 절차를 따른다.
      BATCH_SCHEDULING_ENABLED: ${BATCH_SCHEDULING_ENABLED:-false}
    ports:
      # 우변은 언제나 9090 이다(업무 포트). 관리 포트 9092 는 호스트로 안 내보낸다 —
      # 매핑하면 인증 없이 전 지표가 열린다. 관제는 내부 네트워크에서 batch:9092 로 긁는다.
      - "127.0.0.1:${BATCH_HOST_PORT:-9090}:9090"
    depends_on:
      mysql:
        condition: service_healthy
