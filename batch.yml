# 배치 서버 오버레이입니다. base.yml 위에 겹쳐 올립니다.
#
#   docker compose -f base.yml -f batch.yml up batch
#
# 부하 중에는 이 파일을 안 올린다 — 정지 수단이 설정이 아니라 컨테이너라는 것이
# docs/11-batch-implementation.md 의 결정이다.

services:
  batch:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-app}
      DB_USERNAME: ${DB_USERNAME:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app}
      BATCH_MANAGEMENT_PORT: 9092
      # **JVM 기본 존을 고정한다.** 배치는 시계를 둘 쓴다 — TimeProvider(Clock.systemUTC)와,
      # 스프링 배치가 메타에 찍는 인자 없는 LocalDateTime.now()(= JVM 기본 존)다.
      #
      # ⚠️ **드라이버는 이 사이에 끼지 않는다.** LocalDateTime 파라미터는 존 변환 없이 벽시계
      #    그대로 오간다 — TimestampMappingTest 가 JVM 존을 Asia/Seoul 로 바꾼 채 그것을
      #    단언한다. 그래서 어긋남은 "드라이버가 민다" 가 아니라 **두 시계가 다른 벽시계를
      #    쓴다** 는 것이다. (한때 여기에 드라이버 변환을 원인으로 적었는데 사실이 아니었다.)
      #
      # 판정에 쓰이는 컬럼(verification_runs.started_at · finished_at)은 CY-397 이
      # TimeProvider 로 옮겨 이 존과 무관해졌다. 남은 것은 **배치 메타 자신**이다 —
      # RunningJobProbe 의 시체 판정, BatchStuckExecution, 로그 시각이 전부 JVM 기본 존이고,
      # MySQL 세션 존은 base.yml 이 UTC 로 못 박았다. 그 둘을 같은 값으로 두면 배치 메타를
      # 손으로 조회할 때 보이는 시각과 로그가 일치한다.
      #
      # 실측: TZ 를 안 주면 호스트 존이 그대로 JVM 기본 존이 된다(KST 기기에서 Asia/Seoul).
      # 그래서 bootRun 쪽에도 같은 값을 박아 뒀다 — batch/build.gradle.
      TZ: UTC
      # 기본은 끈다. 근거는 application.yml.example 에 있다 — 만료가 검증 셋을 보면
      # 되돌릴 수 없고, 안 도는 쪽은 따라잡을 수 있다.
      #
      # CY-384 전에는 이유가 하나 더 있었다. 그때는 이 값이 true 이기만 해도 verifyJob 이
      # 거절돼 두 잡의 알림을 한 기동으로는 못 봤다. 지금은 배제가 양방향이라 —
      # 검증은 만료가 도는 중이면 거절하고, 만료는 검증이 도는 중이면 그 슬롯을 건너뛴다 —
      # true 로 띄운 채 검증을 트리거해도 그 실행이 크론에 물려 버려지지 않는다.
      BATCH_SCHEDULING_ENABLED: ${BATCH_SCHEDULING_ENABLED:-false}
    # ports 가 없다. **업무 포트를 기본으로 안 내보낸다.**
    #
    # CY-368 이 그 포트에 admin 트리거(POST /api/v1/admin/verify)를 열었는데 인증이 없다 —
    # batch 에 Spring Security 가 없고 토큰 규약은 영역 ③의 몫이라 여기서 혼자 정하면
    # 두 벌이 된다. PRD 보안 ①이 그 상태를 /actuator/env 와 같은 급의 구멍으로 묶었다.
    #
    # 필요할 때만 오버레이를 하나 더 얹는다:
    #   docker compose -f base.yml -f batch.yml -f batch-expose.yml up batch
    #
    # 관리 포트 9092 는 어느 경우에도 안 내보낸다. 관제는 내부 네트워크에서 batch:9092 를 긁는다.
    depends_on:
      mysql:
        condition: service_healthy
