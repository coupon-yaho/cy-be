plugins {
    id 'java-test-fixtures'
}

dependencies {
    implementation project(':core')

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-mysql'

    runtimeOnly 'com.mysql:mysql-connector-j'

    // 시드 픽스처가 core 의 상태·사건 enum 을 시그니처에 노출한다.
    testFixturesApi project(':core')

    testFixturesApi 'org.springframework.boot:spring-boot-starter-test'
    testFixturesApi 'org.springframework.boot:spring-boot-testcontainers'
    testFixturesApi 'org.springframework.boot:spring-boot-data-jpa-test'
    testFixturesApi 'org.springframework.boot:spring-boot-jdbc-test'
    testFixturesApi 'org.testcontainers:testcontainers-mysql'

    testFixturesRuntimeOnly 'com.mysql:mysql-connector-j'
}
