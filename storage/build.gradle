plugins {
    id 'java-test-fixtures'
}

dependencies {
    implementation project(':core')

    // outbox 재시도 지표(CY-908). **이 모듈의 첫 미터다.**
    //
    // 저장소에 미터를 두는 것이 가벼운 결정은 아니지만, 여기 말고는 셀 자리가 없다 —
    // lease 만료 회수와 DEAD 전이가 **이 어댑터 안에서만** 일어난다. 릴레이는 그 일이
    // 있었다는 사실조차 모른다(claimBatch 가 회수를 안쪽에서 하고 결과를 안 돌려준다).
    //
    // infra:mq 가 같은 이유로 같은 것을 물고 있다 — 레지스트리 구현은 앱의 actuator 가 준다.
    implementation 'io.micrometer:micrometer-core'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jackson'

    compileOnly 'org.springframework.boot:spring-boot-health'
    testImplementation 'org.springframework.boot:spring-boot-health'

    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-mysql'

    runtimeOnly 'com.mysql:mysql-connector-j'

    // 시드 픽스처가 core 의 상태·사건 enum 을 시그니처에 노출한다.
    testFixturesApi project(':core')

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testFixturesApi 'org.springframework.boot:spring-boot-starter-test'
    testFixturesApi 'org.springframework.boot:spring-boot-testcontainers'
    testFixturesApi 'org.springframework.boot:spring-boot-data-jpa-test'
    testFixturesApi 'org.springframework.boot:spring-boot-jdbc-test'
    testFixturesApi 'org.testcontainers:testcontainers-mysql'
    // 설정 우선순위 검사기가 쓴다. starter 가 끌어오지만 직접 쓰므로 명시한다.
    //
    // api 가 아니라 implementation 이다 — 공개 시그니처에 SnakeYAML 타입이 없다.
    //
    // 다만 이것으로 소비 모듈이 자기 파서를 짜는 것을 막지는 못한다: 루트 build.gradle 이
    // 모든 subproject 에 spring-boot-starter 를 걸고 그것이 snakeyaml 을 끌어온다.
    // 판정을 한 벌로 유지하는 것은 규약이지 컴파일 강제가 아니다.
    testFixturesImplementation 'org.yaml:snakeyaml'
    // AppGrantsComposeContractTest 가 저장소 루트의 compose.yml 을 직접 읽는다.
    // infra:mq 의 KafkaBrokerComposeContractTest 와 같은 이유로 명시한다.
    testImplementation 'org.yaml:snakeyaml'
    // ConfigurationPropertyName 이 여기 있다. starter 두 단계를 거친 전이라 명시한다.
    testFixturesImplementation 'org.springframework.boot:spring-boot'

    testFixturesRuntimeOnly 'com.mysql:mysql-connector-j'
}

tasks.named('test') {
    // CorruptionCountTest 는 클래스패스 밖의 docs/contract.json 을 직접 읽는다. 선언하지
    // 않으면 **계약만 고쳤을 때** Gradle 이 test 를 UP-TO-DATE 로 건너뛴다 — 가드가 있는데
    // 안 도는 상태가 가드가 없는 것보다 나쁘다.
    //
    // 실측 — 선언 전에 injections 를 700→650 으로 바꾸고 그냥 돌리니 915ms 만에
    // BUILD SUCCESSFUL 이었다. --rerun-tasks 를 줘야 비로소 빨개졌다.
    inputs.files(rootProject.file('docs/contract.json'))
        .withPropertyName('corruptionContract')
        .withPathSensitivity(PathSensitivity.RELATIVE)
}

tasks.named('test') {
    // 컨테이너 픽스처가 클래스패스 밖 파일을 읽는다. 선언하지 않으면 Gradle 이 그 변경을
    // 모르고 test 를 UP-TO-DATE 로 건너뛴다.
    //
    // ⚠️ **세 모듈 전부에 있어야 한다.** 이 픽스처는 testFixtures 라 storage·batch·api 가
    //    함께 쓰는데, GRANT 계약을 실제로 단언하는 것은 batch 의
    //    ObservationAccountPrivilegeTest 다. 여기만 선언했다가 그 모듈이 UP-TO-DATE 로
    //    건너뛰는 상태를 만든 적이 있다 — 이 주석이 예전에 "api·batch 도 같은 줄을 갖고
    //    있다" 고 적었는데 그때는 사실이 아니었다.
    //
    // 실측: 선언 전에는 초기화 스크립트를 고쳐도 :storage:test 가 UP-TO-DATE 로 통과했다.
    inputs.files(rootProject.file('infra/mysql/initdb/20-obs-account.sh'))
        .withPropertyName('obsAccountInitScript')
        .withPathSensitivity(PathSensitivity.RELATIVE)

    // ObservationQueryScopeTest 는 settings.gradle 과 **모든 모듈의 자바 원본**을 읽는다.
    // 다른 모듈의 소스는 이 모듈 test 의 입력이 아니라, 선언하지 않으면 api 에 members 질의를
    // 하나 넣어도 :storage:test 가 UP-TO-DATE 로 건너뛴다 — 가드가 있는데 안 도는 상태다.
    //
    // 모듈 목록은 그 테스트의 MODULES 상수와 한 쌍이고, settings.gradle 과 어긋나면
    // moduleListMatchesSettingsGradle 이 잡는다.
    inputs.files(
            rootProject.file('settings.gradle'),
            rootProject.file('api/src/main/java'),
            rootProject.file('batch/src/main/java'),
            rootProject.file('core/src/main/java'),
            rootProject.file('storage/src/main/java'),
            rootProject.file('infra/mq/src/main/java'),
            rootProject.file('infra/redis/src/main/java'))
        .withPropertyName('observationQueryScopeInputs')
        .withPathSensitivity(PathSensitivity.RELATIVE)
}

// AppAccountAppendOnlyTest 가 클래스패스 **밖**의 스크립트와 목록을 읽고, 컨테이너 안에서
// 그 스크립트를 그대로 돌린다. 입력으로 선언하지 않으면 목록만 고쳤을 때 Gradle 이
// UP-TO-DATE 로 건너뛰어 **권한 계약이 검증되지 않은 채 통과한다.**
tasks.named('test') {
    inputs.dir(rootProject.file('infra/mysql/app-grants'))
            .withPropertyName('appGrantScripts')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    // 같은 이유로 compose.yml 도 선언한다 — AppGrantsComposeContractTest 가 순서 계약을
    // 여기서 읽는다. 빠뜨리면 depends_on 을 service_started 로 되돌려도 UP-TO-DATE 다.
    inputs.files(rootProject.file('compose.yml'))
            .withPropertyName('composeFile')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    // healthcheck 가 두드리는 포트 변수와 앱이 읽는 변수를 잇는 계약이 이 파일을 읽는다.
    inputs.files(rootProject.file('api/src/main/resources/management.yml.example'))
            .withPropertyName('apiManagementConfig')
            .withPathSensitivity(PathSensitivity.RELATIVE)
}
