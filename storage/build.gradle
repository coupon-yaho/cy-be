plugins {
    id 'java-test-fixtures'
}

dependencies {
    implementation project(':core')

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    compileOnly 'org.springframework.boot:spring-boot-health'
    testImplementation 'org.springframework.boot:spring-boot-health'

    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-mysql'

    runtimeOnly 'com.mysql:mysql-connector-j'

    testFixturesApi 'org.springframework.boot:spring-boot-starter-test'
    testFixturesApi 'org.springframework.boot:spring-boot-testcontainers'
    testFixturesApi 'org.springframework.boot:spring-boot-data-jpa-test'
    testFixturesApi 'org.springframework.boot:spring-boot-jdbc-test'
    testFixturesApi 'org.testcontainers:testcontainers-mysql'

    testFixturesRuntimeOnly 'com.mysql:mysql-connector-j'
}

tasks.named('test') {
    // 컨테이너 픽스처가 클래스패스 밖 파일을 읽는다. 선언하지 않으면 Gradle 이 그 변경을
    // 모르고 test 를 UP-TO-DATE 로 건너뛴다.
    //
    // ⚠️ **세 모듈 전부에 있어야 한다.** 이 픽스처는 testFixtures 라 storage·batch·api 가
    //    함께 쓰는데, GRANT 계약을 실제로 단언하는 것은 batch 의
    //    ObservationAccountPrivilegeTest 다. 여기만 선언했다가 그 모듈이 UP-TO-DATE 로
    //    건너뛰는 상태를 만든 적이 있다 — 이 주석이 예전에 "api·batch 도 같은 줄을 갖고
    //    있다" 고 적었는데 그때는 사실이 아니었다.
    //
    // 실측: 선언 전에는 초기화 스크립트를 고쳐도 :storage:test 가 UP-TO-DATE 로 통과했다.
    inputs.files(rootProject.file('infra/mysql/initdb/20-obs-account.sh'))
        .withPropertyName('obsAccountInitScript')
        .withPathSensitivity(PathSensitivity.RELATIVE)

    // ObservationQueryScopeTest 는 settings.gradle 과 **모든 모듈의 자바 원본**을 읽는다.
    // 다른 모듈의 소스는 이 모듈 test 의 입력이 아니라, 선언하지 않으면 api 에 members 질의를
    // 하나 넣어도 :storage:test 가 UP-TO-DATE 로 건너뛴다 — 가드가 있는데 안 도는 상태다.
    //
    // 모듈 목록은 그 테스트의 MODULES 상수와 한 쌍이고, settings.gradle 과 어긋나면
    // moduleListMatchesSettingsGradle 이 잡는다.
    inputs.files(
            rootProject.file('settings.gradle'),
            rootProject.file('api/src/main/java'),
            rootProject.file('batch/src/main/java'),
            rootProject.file('core/src/main/java'),
            rootProject.file('storage/src/main/java'),
            rootProject.file('infra/mq/src/main/java'),
            rootProject.file('infra/redis/src/main/java'))
        .withPropertyName('observationQueryScopeInputs')
        .withPathSensitivity(PathSensitivity.RELATIVE)
}
