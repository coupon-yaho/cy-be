# 검증용 데이터셋 배치 둘을 세웁니다. batch.yml 위에 겹쳐 올립니다.
#
#   docker compose -f base.yml -f batch.yml -f batch-verify.yml up batch-clean batch-corrupt
#
# 왜 필요한가
#   관제 화면은 정상셋·오염셋·app 세 카드를 나란히 그리는데, compose 에는 **app 을 보는
#   batch 하나뿐**이었다. 나머지 둘은 사람이 docker run 으로 세웠고, 그래서 세울 때마다
#   포트가 달라졌다. Vite 프록시는 대상 주소를 기동 시점에 고정하므로 포트가 옮겨지면
#   프론트를 재기동해야 하고 그동안 화면이 빈다 — 2026-08-30 에 실제로 그렇게 됐다.
#
#   포트를 여기 박아 아무도 기억하지 않아도 되게 한다.
#
# ⚠️ **스케줄러를 켜지 마라.** 이 둘이 보는 DB 가 곧 검증 대상이다. 만료·정리 잡이 그 위에서
#    돌면 판정이 흔들린다 — 재고를 쓰는 잡은 expireJob 하나뿐이고, 그것이 정확히 검증이
#    얼려 두고 보는 축이다(docs/11). 여기서는 API 트리거로만 돌린다.
#
# ⚠️ **관제가 긁는 것은 batch:9092 하나다**(infra/prometheus/prometheus.yml).
#    이 둘은 스크랩 대상이 아니다. 스케줄러가 꺼져 있어 "잡이 안 돈다" 알림이 영구히 울
#    자리라, 넣으려면 알림 규칙부터 갈라야 한다.

services:
  batch-clean:
    extends:
      file: batch.yml
      service: batch
    environment:
      DB_NAME: ${CLEAN_DB_NAME:-coupon_clean}
      # 위 경고 참조. 여기만은 손잡이를 안 준다 — 켜고 싶은 이유가 없어야 맞다.
      BATCH_SCHEDULING_ENABLED: "false"
      # 포트를 여니 관문도 켠다. batch-expose.yml 이 batch 에 하는 것과 같은 분담이다 —
      # 1차 방어선(포트 미노출)이 사라지는 자리에서만 강제한다. 토큰이 비면 기동을 거절한다.
      #
      # ⚠️ **손잡이를 안 준다.** batch-expose.yml 은 ${BATCH_ADMIN_AUTH_REQUIRED:-true} 로
      #    끌 여지를 남기는데, 여기서는 그러면 안 된다 — AdminTokenConfig 는 required=false
      #    일 때 **빈 토큰 검사까지 건너뛰고** 필터를 통째로 끈다. 게다가 이 둘은
      #    Prometheus 스크랩 대상이 아니라, 그 상태를 15분 뒤 우는
      #    BatchAdminAuthDisabled 도 이 둘에는 안 붙는다. 끄면 **아무도 모른다.**
      #    (batch 는 스크랩 대상이라 그 알림이 받쳐 주는 것이 차이다.)
      BATCH_ADMIN_AUTH_REQUIRED: "true"
      BATCH_ADMIN_PORT_EXPOSED: "true"
    ports:
      # ⚠️ 127.0.0.1 을 빼면 안 된다. 짧은 문법은 IP 를 안 적으면 0.0.0.0 에 묶는다.
      #    CI 가 이 조합까지 jq 로 검사한다(.github/workflows/build.yml).
      - "127.0.0.1:${BATCH_CLEAN_HOST_PORT:-9191}:9091"
    # **적어 두는 것은 방어적 중복이다.** 한때 여기 "extends 는 depends_on 을 안
    # 물려준다" 고 적었는데 **거짓이었다** — 실측으로 지웠다 두 서비스 모두
    # depends_on=mysql 이 그대로 붙어 나온다. compose 가 안 가져오는 것은 그 설정이
    # **참조하는 리소스**(여기서는 mysql 서비스 자체)이고, 그것은 base.yml 이 이미 준다.
    #
    # 그래도 남기는 이유는 base.yml 없이 이 파일을 얹는 조합이 생겼을 때 조용히
    # 순서가 사라지는 것보다 낫기 때문이다.
    depends_on:
      mysql:
        condition: service_healthy

  batch-corrupt:
    extends:
      file: batch.yml
      service: batch
    environment:
      DB_NAME: ${CORRUPT_DB_NAME:-coupon_corrupt}
      BATCH_SCHEDULING_ENABLED: "false"
      BATCH_ADMIN_AUTH_REQUIRED: "true"
      BATCH_ADMIN_PORT_EXPOSED: "true"
    ports:
      - "127.0.0.1:${BATCH_CORRUPT_HOST_PORT:-9091}:9091"
    depends_on:
      mysql:
        condition: service_healthy
