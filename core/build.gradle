plugins {
    id 'java-test-fixtures'
}

dependencies {
    api 'org.springframework.boot:spring-boot-starter'
    // jackson-annotations 는 아래에서 api 로 선언한다(api 가 implementation 을 포함한다).
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // ResponseEnvelope 의 @JsonProperty 하나 때문이다. 직렬화 구현이 아니라 애노테이션
    // jar 라 core 가 웹 계층을 끌고 오지 않는다. 그 봉투가 여기 있는 이유는 batch 도
    // 같은 규약을 써야 하기 때문이다 — batch 는 core 만 의존한다.
    api 'com.fasterxml.jackson.core:jackson-annotations'
    testImplementation 'org.springframework.boot:spring-boot-starter-jackson'
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework:spring-tx'
}

tasks.named('test') {
    // ⚠️ 저장소 전체의 main 소스를 입력으로 건다. FailureSummaryPrefixContractTest 와
    // CoreArchitectureTest 가 **클래스패스 밖의 소스 파일을 직접 읽기** 때문이다 —
    // Gradle 은 그것을 모르므로, 선언하지 않으면 다른 모듈에 무엇이 추가돼도 이 test 를
    // UP-TO-DATE 로 건너뛴다.
    //
    // 실측(프로브): api 모듈에 `PAYMENT-001` 이라는 **새 접두어의 에러 코드**를 만들고
    // 돌려 보니 `:core:test` 가 아예 안 돌았다. 그 접두어는 FailureSummary 가 모르는
    // 것이라 EXIT_MESSAGE 에 **그대로 새어 나가는데**, 그것을 잡으라고 만든 계약 테스트가
    // 안 돈 것이다. 가드가 있는데 안 도는 상태가 가드가 없는 것보다 나쁘다 —
    // 초록불이 뜨는데 아무것도 안 봤다.
    //
    // (infra/mq/build.gradle 이 같은 이유로 같은 선언을 한다)
    inputs.files(rootProject.fileTree(rootProject.projectDir) {
        include '**/src/main/java/**/*.java'
        exclude '**/build/**'
    }).withPropertyName('repositoryMainSources')
        .withPathSensitivity(PathSensitivity.RELATIVE)
}
